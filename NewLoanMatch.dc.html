<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loan payment match</title>
<script src="./support.js"></script>
</head>
<body>
<template id="x-dc">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAFAF8;font-family:Inter,system-ui,sans-serif;color:#111114;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
input{font:inherit;color:#111114}
input::placeholder{color:#A09EAB}
a{color:#5134C9;text-decoration:none}a:hover{color:#3E24A8}
.kipu-noscroll{scrollbar-width:none}.kipu-noscroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 393px; height: 852px; position: relative; overflow: hidden; background: #FAFAF8; font-family: Inter, system-ui, sans-serif; color: #111114">

<div style="position: absolute; inset: 0; display: flex; flex-direction: column; background: #FAFAF8">
<div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 58px 20px 24px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; justify-content: space-between; height: 40px">
<sc-if value="{{isStep2}}" hint-placeholder-val="{{false}}"><button onClick="{{back}}" aria-label="Back" style="width: 40px; height: 40px; margin-left: -8px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2A2540" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></button></sc-if>
<sc-if value="{{isStep1}}" hint-placeholder-val="{{true}}"><span style="font-size: 12px; color: #6B6B76">Step 1 of 2</span></sc-if>
<a href="Loans.dc.html" aria-label="Close" style="width: 40px; height: 40px; border-radius: 999px; background: #F1F0F4; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2A2540" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
</div>
<header style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: #6B6B76">NEW LOAN</span>
<h1 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -0.02em">Add loan</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: #55555F">Track what you owe and see your progress over time.</p>
</header>

<sc-if value="{{isStep1}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{types}}" as="t" hint-placeholder-count="6"><button onClick="{{t.pick}}" style="{{t.style}}"><span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#2D5DB0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.icon}}"></path></svg></span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; text-align: left"><span style="font-size: 15px; font-weight: 600">{{t.label}}</span><span style="font-size: 12px; color: #6B6B76">{{t.desc}}</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A09EAB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></button></sc-for>
</div>
</sc-if>

<sc-if value="{{isStep2}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 20px">
<button onClick="{{back}}" style="align-self: flex-start; height: 34px; padding: 0 12px; border-radius: 999px; background: #EEF3FB; color: #2D5DB0; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2D5DB0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{typeIcon}}"></path></svg>{{type}} · change</button>

<section style="display: flex; flex-direction: column; gap: 14px">
<label style="display: flex; flex-direction: column; gap: 6px"><span style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: #6B6B76"><span>Loan name</span></span><input type="text" inputmode="text" value="{{name}}" onChange="{{onName}}" placeholder="e.g. Car loan" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 14px; background: #F6F5F8; font-size: 15px; outline: none; width: 100%"></label>
<sc-if value="{{isVehicle}}" hint-placeholder-val="{{true}}"><label style="display: flex; flex-direction: column; gap: 6px"><span style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: #6B6B76"><span>Vehicle</span><span style="font-weight: 400; color: #8A8896">Optional</span></span><input type="text" inputmode="text" value="{{vehicle}}" onChange="{{onVehicle}}" placeholder="e.g. 2023 Hyundai Tucson" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 14px; background: #F6F5F8; font-size: 15px; outline: none; width: 100%"></label></sc-if>
<label style="display: flex; flex-direction: column; gap: 6px"><span style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: #6B6B76"><span>Lender</span><span style="font-weight: 400; color: #8A8896">Optional</span></span><input type="text" inputmode="text" value="{{lender}}" onChange="{{onLender}}" placeholder="e.g. your bank" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 14px; background: #F6F5F8; font-size: 15px; outline: none; width: 100%"></label>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 600; color: #6B6B76">Owner</span><div style="display: flex; padding: 3px; gap: 2px; background: #F1F0F4; border-radius: 12px"><sc-for list="{{owners}}" as="o" hint-placeholder-count="2"><button onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="{{o.style}}">{{o.label}}</button></sc-for></div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 600; color: #6B6B76">Currency</span><div style="display: flex; padding: 3px; gap: 2px; background: #F1F0F4; border-radius: 12px"><sc-for list="{{curs}}" as="o" hint-placeholder-count="2"><button onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="{{o.style}}">{{o.label}}</button></sc-for></div></div>
</section>

<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 700">Loan balance</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px"><label style="display: flex; flex-direction: column; gap: 6px"><span style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: #6B6B76"><span>Original balance</span></span><input type="text" inputmode="decimal" value="{{orig}}" onChange="{{onOrig}}" placeholder="CA$0" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 14px; background: #F6F5F8; font-size: 15px; outline: none; width: 100%"></label><label style="display: flex; flex-direction: column; gap: 6px"><span style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: #6B6B76"><span>Current balance</span></span><input type="text" inputmode="decimal" value="{{cur}}" onChange="{{onCur}}" placeholder="CA$0" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 14px; background: #F6F5F8; font-size: 15px; outline: none; width: 100%"></label></div>
<sc-if value="{{hasProgress}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #EEEDF2">
<div style="display: flex; justify-content: space-between; align-items: baseline; font-variant-numeric: tabular-nums"><span style="font-size: 13px; color: #55555F">Paid so far <b style="color: #111114">{{prog.paid}}</b></span><b style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700; color: #1A6B46">{{prog.pct}}</b></div>
<div style="height: 10px; background: #F1F0F4; border-radius: 999px; position: relative"><div style="{{prog.fill}}"></div></div>
<span style="font-size: 11px; color: #8A8896">Calculated from the two balances.</span>
</div>
</sc-if>
</section>

<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 700">Interest</h2>
<sc-if value="{{rateKnown}}" hint-placeholder-val="{{true}}"><label style="display: flex; flex-direction: column; gap: 6px"><span style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: #6B6B76"><span>Interest rate</span><button onClick="{{rateLater}}" style="font-size: 12px; font-weight: 600; color: #5134C9">Add later</button></span><input type="text" inputmode="decimal" value="{{rate}}" onChange="{{onRate}}" placeholder="0.00%" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 14px; background: #F6F5F8; font-size: 15px; outline: none; width: 100%"><span style="font-size: 11px; color: #8A8896">Annual interest rate.</span></label></sc-if>
<sc-if value="{{rateUnknown}}" hint-placeholder-val="{{false}}"><div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: 14px; background: #FDF6E8"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; font-weight: 600; color: #4A3206">Interest rate · later</span><span style="font-size: 11px; color: #6B5320">A loan document or statement can fill this in.</span></span><button onClick="{{rateNow}}" style="height: 32px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; font-size: 12px; font-weight: 600; color: #94580A">Add now</button></div></sc-if>
</section>

<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 700">Payments</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px"><label style="display: flex; flex-direction: column; gap: 6px"><span style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: #6B6B76"><span>Payment amount</span></span><input type="text" inputmode="decimal" value="{{pay}}" onChange="{{onPay}}" placeholder="CA$0" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 14px; background: #F6F5F8; font-size: 15px; outline: none; width: 100%"></label><label style="display: flex; flex-direction: column; gap: 6px"><span style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: #6B6B76"><span>Next payment</span></span><input type="text" inputmode="text" value="{{next}}" onChange="{{onNext}}" placeholder="e.g. Sep 27, 2026" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 14px; background: #F6F5F8; font-size: 15px; outline: none; width: 100%"></label></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 600; color: #6B6B76">How often</span><div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{freqs}}" as="o" hint-placeholder-count="6"><button onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="{{o.style}}">{{o.label}}</button></sc-for></div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 600; color: #6B6B76">Autopay</span><div style="display: flex; padding: 3px; gap: 2px; background: #F1F0F4; border-radius: 12px"><sc-for list="{{autopays}}" as="o" hint-placeholder-count="3"><button onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="{{o.style}}">{{o.label}}</button></sc-for></div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: #6B6B76"><span>{{payFromLabel}}</span><span style="font-weight: 400; color: #8A8896">Optional</span></span><div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{payFrom}}" as="o" hint-placeholder-count="3"><button onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="{{o.style}}">{{o.label}}</button></sc-for></div><span style="font-size: 11px; color: #8A8896">Helps Kipu plan upcoming payments and match them later.</span></div>
</section>

<section style="{{est.box}}">
<div style="display: flex; justify-content: space-between; align-items: center"><h2 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 700">Payoff estimate</h2><span style="padding: 2px 7px; border: 1px dashed #9DB6E3; border-radius: 999px; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; color: #2D5DB0; white-space: nowrap">ESTIMATE</span></div>
<sc-if value="{{est.ok}}" hint-placeholder-val="{{true}}">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76">Payments left</span><b style="font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums">{{est.n}}</b></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76">Paid off</span><b style="font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; color: #2D5DB0">{{est.date}}</b></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76">Interest left</span><b style="font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums">{{est.interest}}</b></span></div>
</sc-if>
<sc-if value="{{est.missing}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; line-height: 19px; color: #3A3A42">Add the interest rate and payment schedule to see payoff projections.</span></sc-if>
<span style="font-size: 11px; color: #6B6B76">{{est.note}}</span>
</section>

<sc-if value="{{sim.on}}" hint-placeholder-val="{{false}}">
<section style="padding: 16px; border-radius: 20px; background: #F4F1FD; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 14px; font-weight: 600; color: #2B1F66">With {{sim.extra}} extra a month</span><span style="padding: 2px 7px; border: 1px dashed #9DB6E3; border-radius: 999px; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; color: #2D5DB0; white-space: nowrap">SIMULATION</span></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76">Without extra</span><b style="font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums">{{sim.base}}</b></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76">With extra</span><b style="font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; color: #2B1F66">{{sim.date}}</b></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76">Time saved</span><b style="font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; color: #1A6B46">{{sim.saved}}</b></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76">Interest saved</span><b style="font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; color: #1A6B46">{{sim.interest}}</b></span></div>
</section>
</sc-if>

<div style="border-top: 1px solid #ECEBF0; border-bottom: 1px solid #ECEBF0">
<button onClick="{{toggleDates}}" aria-expanded="{{datesAttr}}" style="width: 100%; padding: 14px 0; display: flex; align-items: center; gap: 12px; text-align: left"><span style="width: 28px; height: 28px; border-radius: 999px; background: #F4F1FD; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5134C9" stroke-width="2.4" stroke-linecap="round"><path d="{{datesIcon}}"></path></svg></span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 600">Loan dates</span><span style="font-size: 12px; color: #6B6B76">Start and payoff dates, if you have them</span></span></button>
<sc-if value="{{datesOpen}}" hint-placeholder-val="{{false}}"><div style="display: flex; flex-direction: column; gap: 14px; padding: 2px 0 16px"><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px"><label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 600; color: #6B6B76">Loan start</span><input type="text" inputmode="text" placeholder="e.g. Jan 2024" value="Jan 2024" readonly style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 14px; background: #F6F5F8; font-size: 15px; outline: none; width: 100%"></label><label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 600; color: #6B6B76">Original payoff</span><input type="text" inputmode="text" placeholder="e.g. Jan 2030" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 14px; background: #F6F5F8; font-size: 15px; outline: none; width: 100%"></label></div>
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 600; color: #6B6B76">Current payoff, if you know it</span><input type="text" inputmode="text" placeholder="Kipu can estimate this" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 14px; background: #F6F5F8; font-size: 15px; outline: none; width: 100%"></label></div></sc-if>
</div>
<div style="border-top: 1px solid #ECEBF0; border-bottom: 1px solid #ECEBF0">
<button onClick="{{toggleMore}}" aria-expanded="{{moreAttr}}" style="width: 100%; padding: 14px 0; display: flex; align-items: center; gap: 12px; text-align: left"><span style="width: 28px; height: 28px; border-radius: 999px; background: #F4F1FD; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5134C9" stroke-width="2.4" stroke-linecap="round"><path d="{{moreIcon}}"></path></svg></span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 600">More details</span><span style="font-size: 12px; color: #6B6B76">Last four, term, extra payments, sharing, reminder</span></span></button>
<sc-if value="{{moreOpen}}" hint-placeholder-val="{{false}}"><div style="display: flex; flex-direction: column; gap: 14px; padding: 2px 0 16px"><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px"><label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 600; color: #6B6B76">Last four</span><input type="text" inputmode="numeric" placeholder="••••" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 14px; background: #F6F5F8; font-size: 15px; outline: none; width: 100%"></label><label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 600; color: #6B6B76">Original term</span><input type="text" inputmode="text" placeholder="e.g. 72 months" value="72 months" readonly style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 14px; background: #F6F5F8; font-size: 15px; outline: none; width: 100%"></label></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 600; color: #6B6B76">Regular extra payment</span><div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{extras}}" as="o" hint-placeholder-count="4"><button onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="{{o.style}}">{{o.label}}</button></sc-for></div><span style="font-size: 11px; color: #8A8896">If you already pay extra, projections include it.</span></div>
<sc-if value="{{hasHousehold}}" hint-placeholder-val="{{true}}"><div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 600; color: #6B6B76">Household visibility</span>
<sc-for list="{{vis}}" as="o" hint-placeholder-count="3"><button role="radio" onClick="{{o.pick}}" aria-checked="{{o.pressed}}" style="{{o.style}}"><span style="{{o.radio}}"><span style="{{o.dot}}"></span></span><span style="display: flex; flex-direction: column; gap: 2px; text-align: left"><span style="font-size: 14px; font-weight: 600">{{o.label}}</span><span style="font-size: 11px; color: #6B6B76">{{o.sub}}</span></span></button></sc-for>
<span style="font-size: 11px; color: #8A8896">A personal loan can count in Household debt without sharing its details.</span></div></sc-if>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 600; color: #6B6B76">Reminder</span><div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{reminders}}" as="o" hint-placeholder-count="3"><button onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="{{o.style}}">{{o.label}}</button></sc-for></div></div>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 12px; background: #F6F5F8; font-size: 13px"><span>Included in Net Worth as a liability</span><b style="font-weight: 600; color: #1A6B46">On</b></div>
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 600; color: #6B6B76">Notes</span><input type="text" inputmode="text" placeholder="Optional" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 14px; background: #F6F5F8; font-size: 15px; outline: none; width: 100%"></label></div></sc-if>
</div>
</div>
</sc-if>
</div>

<sc-if value="{{isStep2}}" hint-placeholder-val="{{false}}">
<div style="flex-shrink: 0; padding: 12px 20px 30px; background: #FFFFFF; border-top: 1px solid #F1F0F4; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: #F6F5F8">
<span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 11px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5134C9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{typeIcon}}"></path></svg></span>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {

      name: s.name, vehicle: s.vehicle, lender: s.lender, orig: withSym(s.orig), cur: withSym(s.cur), rate: s.rate, pay: withSym(s.pay), next: s.next,
      owners: opts(s.household ? ['Personal', 'Household'] : ['Personal'], 'owner', seg), curs: opts(['CAD', 'USD'], 'currency', seg),
