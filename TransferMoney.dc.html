<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transfer money</title>
<script src="./support.js"></script>
</head>
<body>
<template id="x-dc">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAFAF8;font-family:Inter,system-ui,sans-serif;color:#111114;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
input{font:inherit;color:#111114}
input::placeholder{color:#A09EAB}
a{color:#5134C9;text-decoration:none}a:hover{color:#3E24A8}
.kipu-noscroll{scrollbar-width:none}.kipu-noscroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 393px; height: 852px; position: relative; overflow: hidden; background: #FAFAF8; font-family: Inter, system-ui, sans-serif; color: #111114">

<div style="height: 100%; overflow-y: auto; box-sizing: border-box; padding: 62px 20px 132px; display: flex; flex-direction: column; gap: 22px">

<header style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between; height: 40px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: #6B6B76">YOUR MONEY</span>
<div style="display: flex; gap: 8px">
<button aria-label="Search accounts and transactions" style="width: 40px; height: 40px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E9E7EF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2A2540" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 17.5a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13zM16 16l4 4"></path></svg></button>
<button onClick="{{openAdd}}" aria-label="Add account" style="width: 40px; height: 40px; border-radius: 999px; background: #5134C9; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
</div>
<h1 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -0.02em">Money</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: #55555F">See all your accounts in one place.</p>
<div class="kipu-noscroll" role="navigation" aria-label="Sections" style="display: flex; gap: 6px; overflow-x: auto; margin: 2px -20px 0; padding: 0 20px"><a href="Money.dc.html" aria-current="page" style="flex-shrink: 0; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; display: flex; align-items: center; background: #111114; color: #FFFFFF; font-weight: 600">Accounts</a><a href="Cards.dc.html" style="flex-shrink: 0; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; display: flex; align-items: center; background: #F1F0F4; color: #3A3A42; font-weight: 500">Cards</a><a href="Loans.dc.html" style="flex-shrink: 0; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; display: flex; align-items: center; background: #F1F0F4; color: #3A3A42; font-weight: 500">Loans</a><a href="Transactions.dc.html" style="flex-shrink: 0; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; display: flex; align-items: center; background: #F1F0F4; color: #3A3A42; font-weight: 500">Activity</a><a href="Household.dc.html" style="flex-shrink: 0; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; display: flex; align-items: center; background: #F1F0F4; color: #3A3A42; font-weight: 500">Household</a></div>
<div style="display: flex; align-items: center; justify-content: space-between; margin-top: 6px">
<div role="group" aria-label="Owner" style="display: flex; gap: 6px"><sc-for list="{{owners}}" as="o" hint-placeholder-count="3"><button onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="{{o.style}}">{{o.label}}</button></sc-for></div>
<div style="position: relative">
<button onClick="{{toggleCur}}" aria-haspopup="listbox" aria-expanded="{{curExpanded}}" aria-label="Currency" style="height: 36px; padding: 0 10px 0 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E9E7EF; display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600">{{curLabel}}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B6B76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></button>
<sc-if value="{{curOpen}}" hint-placeholder-val="{{false}}">
<div role="listbox" style="position: absolute; top: 42px; right: 0; z-index: 25; width: 176px; padding: 5px; background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 14px; box-shadow: 0 12px 32px rgba(24, 16, 64, 0.12); display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{currencies}}" as="o" hint-placeholder-count="4"><button role="option" onClick="{{o.pick}}" aria-selected="{{o.pressed}}" style="{{o.style}}"><span>{{o.label}}</span><span style="font-size: 11px; color: #8A8896; font-weight: 400">{{o.sub}}</span></button></sc-for>
</div>
</sc-if>
</div>
</div>
</header>

<section aria-label="Total money" style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #6B6B76">{{sum.label}}</span><span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 36px; line-height: 40px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">{{sum.total}}</span></div>
<sc-if value="{{sum.hasAny}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; height: 10px; gap: 2px"><sc-for list="{{sum.segs}}" as="g" hint-placeholder-count="4"><span style="{{g.style}}"></span></sc-for></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px">
<sc-for list="{{sum.segs}}" as="g" hint-placeholder-count="4"><span style="display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 12px; font-variant-numeric: tabular-nums"><span style="display: flex; align-items: center; gap: 6px; color: #55555F"><span style="{{g.dot}}"></span>{{g.label}}</span><b style="font-weight: 600; color: #111114">{{g.value}}</b></span></sc-for>
</div>
</div>
</sc-if>
<sc-if value="{{sum.showCur}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; padding-top: 12px; border-top: 1px solid #F1F0F4; font-size: 13px; font-variant-numeric: tabular-nums">
<div style="display: flex; justify-content: space-between; padding: 4px 0"><span style="display: flex; align-items: center; gap: 8px; color: #55555F"><span style="padding: 1px 6px; border-radius: 6px; background: #F5F4F8; font-size: 11px; font-weight: 700; color: #3A3A42">CAD</span>Canadian dollar accounts</span><b style="font-weight: 600">{{sum.cad}}</b></div>
<div style="display: flex; justify-content: space-between; padding: 4px 0"><span style="display: flex; align-items: center; gap: 8px; color: #55555F"><span style="padding: 1px 6px; border-radius: 6px; background: #EEF3FB; font-size: 11px; font-weight: 700; color: #2D5DB0">USD</span>US dollar accounts</span><span style="display: flex; flex-direction: column; align-items: flex-end"><b style="font-weight: 600">{{sum.usd}}</b><span style="font-size: 11px; color: #6B6B76">{{sum.usdConv}}</span></span></div>
</div>
</sc-if>
<sc-if value="{{sum.hasAny}}" hint-placeholder-val="{{true}}">
<span style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; background: #F4F1FD; font-size: 12px; color: #2B1F66; font-variant-numeric: tabular-nums"><span style="width: 7px; height: 7px; border-radius: 999px; background: #5134C9"></span><span><b style="font-weight: 700">{{sum.sts}}</b> counts toward Safe to Spend</span></span>
</sc-if>
<sc-if value="{{sum.noneForCur}}" hint-placeholder-val="{{false}}">
<span style="font-size: 13px; line-height: 19px; color: #55555F">No PEN accounts yet. PEN expenses on your cards don’t need one; you can add a PEN account any time.</span>
</sc-if>
</section>

<div style="display: flex; gap: 8px">
<button onClick="{{openAdd}}" style="flex: 1.3 1 0; height: 44px; border-radius: 14px; background: #F4F1FD; color: #5134C9; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5134C9" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>Add account</button>
<button onClick="{{openTransfer}}" style="flex: 1 1 0; height: 44px; border-radius: 14px; background: #F6F5F8; font-size: 13px; font-weight: 600; color: #3A3A42; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3A3A42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3M20 16H7l3 3"></path></svg>Transfer</button>
<a href="Main.dc.html" style="flex: 0.8 1 0; height: 44px; border-radius: 14px; background: #F6F5F8; font-size: 13px; font-weight: 600; color: #3A3A42; display: flex; align-items: center; justify-content: center">Income</a>
<a href="AddExpense.dc.html" style="flex: 0.9 1 0; height: 44px; border-radius: 14px; background: #F6F5F8; font-size: 13px; font-weight: 600; color: #3A3A42; display: flex; align-items: center; justify-content: center">Expense</a>
</div>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
<section style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: space-between"><h2 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.01em">{{g.name}}</h2><span style="font-size: 12px; color: #6B6B76; font-variant-numeric: tabular-nums">{{g.total}}</span></div>
<div style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 2px 16px">
<sc-for list="{{g.accounts}}" as="a" hint-placeholder-count="2">
<a href="{{a.href}}" aria-label="{{a.aria}}" style="{{a.rowStyle}}">
<span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: #EEF3FB; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#2D5DB0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{a.icon}}"></path></svg></span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; align-items: center; gap: 6px; min-width: 0"><span style="font-size: 15px; font-weight: 600; color: #111114; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{a.name}}</span><span style="{{a.ownerStyle}}">{{a.owner}}</span></span>
<span style="font-size: 12px; color: #6B6B76; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{a.meta}}</span>
<sc-if value="{{a.hasGoal}}" hint-placeholder-val="{{false}}"><span style="display: flex; align-items: center; gap: 8px"><span style="flex-grow: 1; height: 4px; background: #EEEDF2; border-radius: 999px; position: relative; display: block"><span style="{{a.goalFill}}"></span></span><span style="font-size: 11px; color: #1A6B46; font-weight: 600; white-space: nowrap">{{a.goalText}}</span></span></sc-if>
</span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex-shrink: 0"><span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 700; color: #111114; font-variant-numeric: tabular-nums">{{a.balance}}</span><sc-if value="{{a.hasSub}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; color: #6B6B76; font-variant-numeric: tabular-nums">{{a.sub}}</span></sc-if></span>
</a>
</sc-for>
</div>
<sc-if value="{{g.hasNote}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; line-height: 16px; color: #8A8896">{{g.note}}</span></sc-if>
</section>
</sc-for>

<sc-if value="{{showOwners}}" hint-placeholder-val="{{true}}">
<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.01em">By owner</h2>
<div style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; height: 10px; gap: 2px"><sc-for list="{{byOwner}}" as="b" hint-placeholder-count="3"><span style="{{b.style}}"></span></sc-for></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; font-variant-numeric: tabular-nums"><sc-for list="{{byOwner}}" as="b" hint-placeholder-count="3"><span style="display: flex; flex-direction: column; gap: 2px"><span style="display: flex; align-items: center; gap: 5px; font-size: 12px; color: #6B6B76"><span style="{{b.dot}}"></span>{{b.label}}</span><b style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 700">{{b.value}}</b></span></sc-for></div>
<span style="font-size: 11px; color: #8A8896">Private account details stay private; their balances are included in household totals.</span>
</div>
</section>
</sc-if>

<a href="#" style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-radius: 16px; background: #F6F5F8">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600; color: #111114">1 closed account</span><span style="font-size: 12px; color: #6B6B76">Old Savings · history kept in Statistics</span></span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A09EAB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg>
</a>

</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: linear-gradient(180deg, rgba(250, 250, 248, 0) 0%, #FAFAF8 55%); pointer-events: none"></div>
<nav aria-label="Primary" style="position: absolute; left: 16px; right: 16px; bottom: 28px; height: 68px; background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 24px; box-shadow: 0 10px 30px rgba(24, 16, 64, 0.08); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #6B6B76; padding-bottom: 6px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6B76" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"></path></svg><span style="font-size: 11px; font-weight: 500">Home</span></a>
<a href="Money.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #111114"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111114" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V5.5A1.5 1.5 0 0 0 17.5 4h-12A2.5 2.5 0 0 0 3 6.5v11A2.5 2.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V9a1.5 1.5 0 0 0-1.5-1.5H5.5"></path><circle cx="16.5" cy="13.75" r="1" fill="#111114"></circle></svg><span style="font-size: 11px; font-weight: 600">Money</span><span style="width: 16px; height: 3px; border-radius: 999px; background: #5134C9"></span></a>
<div style="display: flex; justify-content: center"><a href="QuickAdd.dc.html" aria-label="Add" style="width: 58px; height: 58px; margin-top: -30px; border-radius: 999px; background: #5134C9; border: 4px solid #FAFAF8; box-sizing: content-box; box-shadow: 0 10px 24px rgba(81, 52, 201, 0.35); display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></a></div>
<a href="Plan.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #6B6B76; padding-bottom: 6px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6B76" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 12h10M4 19h6M15.5 17l2 2 3.5-4"></path></svg><span style="font-size: 11px; font-weight: 500">Plan</span></a>
<a href="Stats.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #6B6B76; padding-bottom: 6px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6B76" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V12M11 20V5M17 20v-9M3 20.5h18"></path></svg><span style="font-size: 11px; font-weight: 500">Stats</span></a>
</nav>

<sc-if value="{{sheetAdd}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; z-index: 40; background: rgba(17, 17, 20, 0.34)">
<button onClick="{{closeSheet}}" aria-label="Close" style="position: absolute; inset: 0; width: 100%; height: 100%"></button>
<div role="dialog" aria-modal="true" aria-label="Add account" style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 780px; overflow-y: auto; background: #FFFFFF; border-radius: 28px 28px 0 0; box-shadow: 0 -12px 40px rgba(24, 16, 64, 0.14); padding: 10px 20px 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: center"><span style="width: 36px; height: 5px; border-radius: 999px; background: #DCDAE3"></span></div>
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -0.02em">Add account</span><span style="font-size: 13px; color: #6B6B76">No account number or bank login needed.</span></span>
<button onClick="{{closeSheet}}" aria-label="Close" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 999px; background: #F5F4F8; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2A2540" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; gap: 6px"><span style="flex: 1 1 0; height: 4px; border-radius: 999px; background: #5134C9"></span><span style="{{add.bar2}}"></span></div>
<span style="font-size: 12px; color: #6B6B76">Step {{add.step}} of 2 · {{add.stepName}}</span>
</div>
<sc-if value="{{add.isStep1}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px"><label style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: #3A3A42">Account name</span>
<input type="text" inputmode="text" placeholder="e.g. Chequing" style="height: 46px; box-sizing: border-box; padding: 0 14px; border: 1px solid #E4E2EA; border-radius: 12px; background: #FFFFFF; font-size: 15px; outline: none">
</label><label style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: #3A3A42">Institution</span>
<input type="text" inputmode="text" placeholder="e.g. CIBC" style="height: 46px; box-sizing: border-box; padding: 0 14px; border: 1px solid #E4E2EA; border-radius: 12px; background: #FFFFFF; font-size: 15px; outline: none">
</label></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 600; color: #3A3A42">Account type</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{add.types}}" as="o" hint-placeholder-count="6"><button onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="{{o.style}}">{{o.label}}</button></sc-for></div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 600; color: #3A3A42">Owner</span><div style="display: flex; padding: 3px; gap: 2px; background: #F1F0F4; border-radius: 12px">
<sc-for list="{{add.owners}}" as="o" hint-placeholder-count="3">
<button onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="{{o.style}}">{{o.label}}</button>
</sc-for>
</div></div>
<div style="display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 10px; align-items: end">
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 600; color: #3A3A42">Currency</span><div style="display: flex; padding: 3px; gap: 2px; background: #F1F0F4; border-radius: 12px">
<sc-for list="{{add.currencies}}" as="o" hint-placeholder-count="3">
<button onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="{{o.style}}">{{o.label}}</button>
</sc-for>
</div></div>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: #3A3A42">Current balance</span>
<input type="text" inputmode="decimal" placeholder="0.00" style="height: 46px; box-sizing: border-box; padding: 0 14px; border: 1px solid #E4E2EA; border-radius: 12px; background: #FFFFFF; font-size: 15px; outline: none">
</label>
</div>
</div>
</sc-if>
<sc-if value="{{add.isStep2}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{add.switches}}" as="w" hint-placeholder-count="2">
