<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projections, variable income</title>
<script src="./support.js"></script>
</head>
<body>
<template id="x-dc">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAFAF8;font-family:Inter,system-ui,sans-serif;color:#111114;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
input{font:inherit;color:#111114}
input::placeholder{color:#A09EAB}
a{color:#5134C9;text-decoration:none}a:hover{color:#3E24A8}
.kipu-noscroll{scrollbar-width:none}.kipu-noscroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 393px; height: 852px; position: relative; overflow: hidden; background: #FAFAF8; font-family: Inter, system-ui, sans-serif; color: #111114">

<div style="height: 100%; overflow-y: auto; box-sizing: border-box; padding: 62px 20px 132px; display: flex; flex-direction: column; gap: 22px">
<header style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between; height: 40px">
<div style="display: flex; align-items: center; gap: 10px"><a href="Stats.dc.html" aria-label="Back to Statistics" style="width: 32px; height: 32px; margin-left: -6px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2A2540" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a><span style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: #6B6B76">FINANCIAL FORECAST</span></div>
<button onClick="{{openAssume}}" aria-label="Projection settings" style="width: 40px; height: 40px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E9E7EF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2A2540" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8M16 9a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM10 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"></path></svg></button>
</div>
<h1 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -0.02em">Projections</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: #55555F">See where your current financial path may take you.</p>
<div class="kipu-noscroll" role="navigation" aria-label="Sections" style="display: flex; gap: 6px; overflow-x: auto; margin: 2px -20px 0; padding: 0 20px"><a href="Stats.dc.html" style="flex-shrink: 0; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; display: flex; align-items: center; background: #F1F0F4; color: #3A3A42; font-weight: 500">Statistics</a><a href="Insights.dc.html" style="flex-shrink: 0; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; display: flex; align-items: center; background: #F1F0F4; color: #3A3A42; font-weight: 500">Insights</a><a href="Review.dc.html" style="flex-shrink: 0; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; display: flex; align-items: center; background: #F1F0F4; color: #3A3A42; font-weight: 500">Reviews</a><a href="Projections.dc.html" aria-current="page" style="flex-shrink: 0; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; display: flex; align-items: center; background: #111114; color: #FFFFFF; font-weight: 600">Forecast</a></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 3px; gap: 2px; background: #F1F0F4; border-radius: 12px; margin-top: 4px">
<a href="Stats.dc.html" style="height: 40px; border-radius: 9px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #6B6B76"><span style="font-size: 13px; font-weight: 600">Statistics</span><span style="font-size: 10px">Past and present</span></a>
<span aria-current="page" style="height: 40px; border-radius: 9px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(24, 16, 64, 0.12); display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 13px; font-weight: 700; color: #111114">Projections</span><span style="font-size: 10px; color: #6B6B76">Future</span></span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between">
<div role="group" aria-label="Owner" style="display: flex; gap: 5px"><sc-for list="{{owners}}" as="o" hint-placeholder-count="3"><button onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="{{o.style}}">{{o.label}}</button></sc-for></div>
<div style="position: relative"><button onClick="{{toggleCur}}" aria-haspopup="listbox" aria-expanded="{{curAttr}}" aria-label="Currency" style="height: 34px; padding: 0 10px 0 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E9E7EF; display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600">{{currency}}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B6B76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></button>
<sc-if value="{{curOpen}}" hint-placeholder-val="{{false}}"><div role="listbox" style="position: absolute; top: 40px; right: 0; z-index: 25; width: 140px; padding: 5px; background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 14px; box-shadow: 0 12px 32px rgba(24, 16, 64, 0.12); display: flex; flex-direction: column; gap: 2px"><sc-for list="{{currencies}}" as="o" hint-placeholder-count="4"><button onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="{{o.style}}">{{o.label}}</button></sc-for></div></sc-if></div>
</div>
<div role="group" aria-label="Projection range" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 3px; gap: 2px; background: #F1F0F4; border-radius: 12px"><sc-for list="{{ranges}}" as="o" hint-placeholder-count="3"><button onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="{{o.style}}">{{o.label}}</button></sc-for></div>
</header>

<sc-if value="{{isLimited}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="padding: 30px 22px; border-radius: 24px; background: #FFFFFF; border: 1px dashed #E4E2EA; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
<span style="width: 56px; height: 56px; border-radius: 18px; background: #F4F1FD; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5134C9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"></path></svg></span>
<span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 21px; font-weight: 700">Projections need a little history</span>
<span style="font-size: 14px; line-height: 20px; color: #55555F">Kipu will build better forecasts as you add transactions, recurring expenses and income.</span>
</div>
<span style="font-size: 12px; font-weight: 600; color: #6B6B76">Already possible</span>
<div style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 2px 16px">
<div style="display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid #F1F0F4; font-size: 14px"><span style="color: #3A3A42">Upcoming bills · next 30 days</span><b style="font-weight: 700; font-variant-numeric: tabular-nums">CA$4,533</b></div>
<div style="display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid #F1F0F4; font-size: 14px"><span style="color: #3A3A42">Hyundai Tucson payoff</span><b style="font-weight: 700">May 2029</b></div>
<div style="display: flex; justify-content: space-between; padding: 14px 0; font-size: 14px"><span style="color: #3A3A42">Emergency Fund timeline</span><b style="font-weight: 700">May 2027</b></div>
</div>
</div>
</sc-if>

<sc-if value="{{hasData}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 22px">

<div style="display: flex; justify-content: center; gap: 16px; font-size: 11px; color: #55555F">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 16px; height: 2.5px; background: #2A2540; border-radius: 2px"></span>Actual</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 16px; border-top: 2px dashed #5134C9"></span>Projected</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 16px; border-top: 2px dotted #2E9B69"></span>Target</span>
</div>

<sc-if value="{{isVolatile}}" hint-placeholder-val="{{false}}"><div style="display: flex; gap: 12px; padding: 14px; border-radius: 16px; background: #FDF6E8"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94580A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4.5M12 15.5h.01M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18z"></path></svg><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600; color: #4A3206">Income varies month to month.</span><span style="font-size: 12px; line-height: 17px; color: #6B5320">Projections show a range instead of a single number.</span></span></div></sc-if>

<sc-if value="{{scenActive}}" hint-placeholder-val="{{false}}"><div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: 16px; background: #F4F1FD; border: 1px dashed #CFC6F2"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: #5134C9">SCENARIO ACTIVE</span><span style="font-size: 13px; color: #2B1F66">{{scenLabel}}</span></span><button onClick="{{resetScen}}" style="height: 34px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; font-size: 12px; font-weight: 600; color: #5134C9">Reset</button></div></sc-if>

<section aria-label="Forecast summary" style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; border-radius: 24px; overflow: hidden">
<div style="padding: 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 13px; color: #6B6B76">Net worth in {{rangeLabel}}</span><span style="padding: 2px 7px; border: 1px dashed #9DB6E3; border-radius: 999px; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; color: #2D5DB0; white-space: nowrap">PROJECTED</span></div>
<span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: {{sum.nwSize}}; line-height: 40px; font-weight: 700; letter-spacing: -0.02em; color: #2B1F66; font-variant-numeric: tabular-nums">{{sum.nw}}</span>
<span style="font-size: 13px; color: #1A6B46; font-weight: 600; font-variant-numeric: tabular-nums">{{sum.nwChange}}</span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 14px 20px; border-top: 1px solid #F1F0F4; gap: 8px"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76">Savings</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">{{sum.savings}}</b></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76">Debt remaining</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">{{sum.debt}}</b></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76">Avg Safe to Spend</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">{{sum.sts}}</b></span></div>
<div style="padding: 12px 20px; border-top: 1px solid #F1F0F4; background: #FBFAFD; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; line-height: 17px; color: #55555F">Based on current income, spending, scheduled payments and savings pace.</span>
<span style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #3A3A42"><span style="display: flex; gap: 2px"><span style="width: 10px; height: 6px; border-radius: 2px; background: #5134C9"></span><span style="width: 10px; height: 6px; border-radius: 2px; background: #5134C9"></span><span style="width: 10px; height: 6px; border-radius: 2px; background: #DCD8E6"></span></span>Projection confidence: <b style="font-weight: 600">Medium</b> · 9 months of history</span>
</div>
</section>

<button onClick="{{openScen}}" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 18px; background: #F4F1FD; text-align: left"><span style="width: 36px; height: 36px; border-radius: 11px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5134C9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 17h16M8 4v6M16 14v6"></path></svg></span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600; color: #2B1F66">Try a scenario</span><span style="font-size: 12px; color: #55506E">See what one change could do, without changing your plan</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5134C9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></button>

<section style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 3px"><h2 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.01em">Net worth</h2><p style="margin: 0; font-size: 13px; color: #6B6B76">Where could your overall position be heading?</p></div>
<div style="position: relative; width: 321px; height: 170px">
<svg width="321" height="150" viewBox="0 0 321 150" style="position: absolute; left: 0; top: 0; overflow: visible">
<path d="{{nw.band}}" fill="#5134C9" fill-opacity="0.07"></path>
<path d="{{nw.actual}}" fill="none" stroke="#2A2540" stroke-width="2.2" stroke-linejoin="round"></path>
<path d="{{nw.proj}}" fill="none" stroke="#5134C9" stroke-width="2.2" stroke-dasharray="5 4" stroke-linejoin="round"></path>
<path d="{{nw.divider}}" stroke="#D2CEDC" stroke-width="1" stroke-dasharray="2 3"></path>
</svg>
<sc-for list="{{nw.pts}}" as="p" hint-placeholder-count="4"><span style="{{p.dot}}"></span><span style="{{p.lab}}">{{p.t}}</span></sc-for>
<span style="{{nw.todayLab}}">Today</span>
<span style="position: absolute; left: 0; top: 154px; font-size: 10px; color: #8A8896">Jan 2026</span>
<span style="position: absolute; right: 0; top: 154px; font-size: 10px; color: #8A8896">{{nw.endLab}}</span>
</div>
<span style="font-size: 11px; color: #8A8896">Shaded area shows a likely range. It widens further out because the future is less certain.</span>
</section>

<section style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.01em">Savings</h2><span style="font-size: 12px; color: #6B6B76">CA$1,220 / month pace</span></div>
<div style="position: relative; height: 54px">
<div style="position: absolute; left: 0; right: 0; top: 18px; height: 14px; background: #F1F0F4; border-radius: 999px"></div>
<div style="{{sv.fill}}"></div>
<div style="position: absolute; left: 92.5%; right: 0; top: 18px; height: 14px; border-radius: 0 999px 999px 0; background: repeating-linear-gradient(135deg, #F1D39E 0 3px, transparent 3px 6px)"></div>
<span style="position: absolute; right: 0; top: 0; font-size: 10px; font-weight: 600; color: #1A6B46">Target CA$20,000</span>
<sc-for list="{{sv.marks}}" as="m" hint-placeholder-count="3"><span style="{{m.tick}}"></span><span style="{{m.lab}}">{{m.t}}</span></sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76">Projected savings rate</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">19.4%</b></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76">Projected, 12 months</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">CA$18,500</b></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76">Gap to target</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; color: #94580A">CA$1,500</b></span></div>
<span style="font-size: 12px; color: #55555F">About CA$125 more a month would close the gap.</span>
</section>

<section style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.01em">Spending</h2><span style="padding: 2px 8px; border-radius: 999px; background: #E6F4EC; color: #1A6B46; font-size: 11px; font-weight: 600">CA$130 under budget</span></div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="position: relative; height: 14px; background: #F1F0F4; border-radius: 999px"><div style="position: absolute; left: 0; top: 0; bottom: 0; width: 79.5%; background: #2A2540; border-radius: 999px 0 0 999px"></div><div style="position: absolute; left: 79.5%; top: 2px; bottom: 2px; width: 17.5%; border: 1.5px dashed #5134C9; border-left: 0; box-sizing: border-box; border-radius: 0 999px 999px 0"></div><div style="position: absolute; left: 100%; top: -4px; width: 2px; height: 22px; margin-left: -2px; background: #2E9B69; border-radius: 1px"></div></div>
<div style="display: flex; justify-content: space-between; font-size: 11px; color: #6B6B76; font-variant-numeric: tabular-nums"><span>Spent CA$3,428 · actual</span><span>Month end ≈ CA$4,180</span><span style="color: #1A6B46">Budget CA$4,310</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid #F1F0F4">
<span style="font-size: 12px; font-weight: 600; color: #3A3A42">Next 12 months vs last year</span>
<div style="display: grid; grid-template-columns: 82px minmax(0, 1fr) 70px; align-items: center; gap: 8px; font-size: 12px; font-variant-numeric: tabular-nums"><span style="color: #6B6B76">Last year</span><span style="height: 10px; background: #2A2540; border-radius: 999px; display: block"></span><b style="text-align: right; font-weight: 600">CA$52,400</b></div>
<div style="display: grid; grid-template-columns: 82px minmax(0, 1fr) 70px; align-items: center; gap: 8px; font-size: 12px; font-variant-numeric: tabular-nums"><span style="color: #6B6B76">Projected</span><span style="display: block"><span style="width: 96.9%; height: 10px; border: 1.5px dashed #5134C9; box-sizing: border-box; border-radius: 999px; display: block"></span></span><b style="text-align: right; font-weight: 600; color: #2B1F66">≈ CA$50,800</b></div>
<span style="font-size: 12px; color: #1A6B46; font-weight: 600">≈ 3.1% less than last year</span>
</div>
</section>

<section style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.01em">End of month</h2><span style="font-size: 12px; font-weight: 600; color: #94580A">6 days remaining</span></div>
<div style="display: flex; flex-direction: column; font-size: 14px; font-variant-numeric: tabular-nums">
<div style="display: flex; justify-content: space-between; padding: 6px 0"><span style="color: #55555F">Expected income</span><b style="font-weight: 600; color: #1A6B46">+CA$6,590</b></div>
<span style="margin: -2px 0 4px; font-size: 11px; color: #8A8896">Includes US$1,750 USD income ≈ CA$2,390 at today’s rate</span>
<div style="display: flex; justify-content: space-between; padding: 6px 0"><span style="color: #55555F">Expected spending</span><b style="font-weight: 600">−CA$4,180</b></div>
<div style="display: flex; justify-content: space-between; padding: 6px 0"><span style="color: #55555F">Scheduled debt payments</span><b style="font-weight: 600">−CA$720</b></div>
<div style="display: flex; justify-content: space-between; padding: 6px 0"><span style="color: #55555F">Planned savings</span><b style="font-weight: 600">−CA$600</b></div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<span style="display: flex; flex-direction: column; gap: 2px; padding: 12px; border-radius: 14px; background: #F4F1FD"><span style="font-size: 11px; color: #55506E">Ending cash</span><b style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700; color: #2B1F66; font-variant-numeric: tabular-nums">{{eom.cash}}</b></span>
<span style="display: flex; flex-direction: column; gap: 2px; padding: 12px; border-radius: 14px; background: #F4F1FD"><span style="font-size: 11px; color: #55506E">Safe to Spend</span><b style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700; color: #2B1F66; font-variant-numeric: tabular-nums">{{eom.sts}}</b></span>
</div>
