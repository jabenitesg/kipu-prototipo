<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monthly review, share or export</title>

</head>
<body>
<template id="x-dc">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAFAF8;font-family:Inter,system-ui,sans-serif;color:#111114;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
input{font:inherit;color:#111114}
input::placeholder{color:#A09EAB}
a{color:#5134C9;text-decoration:none}a:hover{color:#3E24A8}
.kipu-noscroll{scrollbar-width:none}.kipu-noscroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 393px; height: 852px; position: relative; overflow: hidden; background: #FAFAF8; font-family: Inter, system-ui, sans-serif; color: #111114">

<div style="position: absolute; inset: 0; overflow-y: auto; padding: 58px 20px 130px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; justify-content: space-between; height: 40px">
<a href="Main.dc.html" aria-label="Back" style="width: 40px; height: 40px; margin-left: -8px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2A2540" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
<div style="display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px; background: #F1F0F4">
<button onClick="{{openArchive}}" aria-label="Previous month" style="width: 32px; height: 32px; border-radius: 999px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2A2540" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></button>
<button onClick="{{openArchive}}" style="padding: 0 6px; font-size: 13px; font-weight: 600">Sep 2026</button>
<button disabled aria-label="Next month" style="width: 32px; height: 32px; border-radius: 999px; display: flex; align-items: center; justify-content: center; opacity: 0.35"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2A2540" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></button>
</div>
<button onClick="{{openShare}}" aria-label="Share or export" style="width: 40px; height: 40px; border-radius: 999px; background: #F1F0F4; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2A2540" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"></path></svg></button>
</div>
<header style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: #6B6B76">MONTHLY REVIEW</span>
<h1 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: -0.02em">September</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: #55555F">Here’s how your financial month came together.</p>
<div class="kipu-noscroll" role="navigation" aria-label="Sections" style="display: flex; gap: 6px; overflow-x: auto; margin: 2px -20px 0; padding: 0 20px"><a href="Stats.dc.html" style="flex-shrink: 0; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; display: flex; align-items: center; background: #F1F0F4; color: #3A3A42; font-weight: 500">Statistics</a><a href="Insights.dc.html" style="flex-shrink: 0; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; display: flex; align-items: center; background: #F1F0F4; color: #3A3A42; font-weight: 500">Insights</a><a href="Review.dc.html" aria-current="page" style="flex-shrink: 0; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; display: flex; align-items: center; background: #111114; color: #FFFFFF; font-weight: 600">Reviews</a><a href="Projections.dc.html" style="flex-shrink: 0; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; display: flex; align-items: center; background: #F1F0F4; color: #3A3A42; font-weight: 500">Forecast</a></div>
</header>
<div style="display: flex; gap: 8px; align-items: center">

<button onClick="{{openCurrency}}" style="margin-left: auto; height: 36px; padding: 0 12px; border-radius: 12px; background: #F1F0F4; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px">{{curLabel}}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2A2540" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></button>
</div>
<section style="border-radius: 26px; padding: 20px; background: linear-gradient(160deg, #2B1F66 0%, #3F2A9E 100%); color: #FFFFFF; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 14px 34px rgba(43, 31, 102, 0.22)">
<div style="display: flex; justify-content: space-between; align-items: flex-start">
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: rgba(255, 255, 255, 0.7)">Net cash flow</span><b style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 38px; line-height: 42px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">{{h.net}}</b></span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; padding: 8px 12px; border-radius: 14px; background: rgba(255, 255, 255, 0.12)"><span style="font-size: 10px; letter-spacing: 0.06em; color: rgba(255, 255, 255, 0.7)">SAVINGS RATE</span><b style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 20px; font-variant-numeric: tabular-nums">{{h.rate}}</b><span style="font-size: 10px; color: #A8E6C6; font-variant-numeric: tabular-nums">{{h.rateFrom}}</span></span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; gap: 2px; height: 10px"><span style="{{h.s1}}"></span><span style="{{h.s2}}"></span><span style="{{h.s3}}"></span></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="display: flex; align-items: center; gap: 5px; font-size: 11px; color: rgba(255, 255, 255, 0.7)"><span style="width: 7px; height: 7px; border-radius: 2px; background: #FFFFFF"></span>Income</span><b style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">{{h.income}}</b></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="display: flex; align-items: center; gap: 5px; font-size: 11px; color: rgba(255, 255, 255, 0.7)"><span style="width: 7px; height: 7px; border-radius: 2px; background: rgba(255, 255, 255, 0.38)"></span>Spending</span><b style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">{{h.spend}}</b></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="display: flex; align-items: center; gap: 5px; font-size: 11px; color: rgba(255, 255, 255, 0.7)"><span style="width: 7px; height: 7px; border-radius: 2px; background: #7FD3A8"></span>Saved</span><b style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">{{h.saved}}</b></span>
</div></div>
<p style="margin: 0; padding-top: 14px; border-top: 1px solid rgba(255, 255, 255, 0.14); font-size: 14px; line-height: 20px; color: rgba(255, 255, 255, 0.92)">{{h.sentence}}</p>
</section>
<sc-if value="{{isPersonal}}" hint-placeholder-val="{{true}}"><div style="display: flex; flex-direction: column; gap: 20px">

</section>

<div style="display: flex; align-items: center; gap: 10px"><span style="width: 28px; height: 28px; border-radius: 9px; background: #F4F1FD; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5134C9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18v12H3zM3 11h18M7 15h3"></path></svg></span><h2 style="margin: 0; flex-grow: 1; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 17px; font-weight: 700; letter-spacing: -0.01em">Spending</h2></div>

<div style="height: 8px; background: #F1F0F4; border-radius: 999px"><div style="width: 27.6%; height: 100%; background: #E0A33B; border-radius: 999px"></div></div></div><div style="display: flex; flex-direction: column; gap: 5px"><div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 13px; color: #3A3A42">Shopping</span><span style="display: flex; gap: 8px; align-items: baseline"><span style="font-size: 11px; color: #6B6B76">−12%</span><b style="font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums">CA$310</b></span></div>

</section>
<section style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 10px"><span style="width: 28px; height: 28px; border-radius: 9px; background: #F4F1FD; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5134C9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l5-5 4 4 7-8M15 8h5v5"></path></svg></span><h2 style="margin: 0; flex-grow: 1; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 17px; font-weight: 700; letter-spacing: -0.01em">Biggest changes</h2></div>

<div style="position: relative; height: 10px; background: #F6F5F8; border-radius: 999px"><span style="position: absolute; top: -3px; bottom: -3px; left: 50%; width: 1px; background: #D8D6DF"></span><span style="position: absolute; top: 0; bottom: 0; left: calc(50% - 2px); width: 4px; background: #C9C7D2; border-radius: 999px"></span></div>

    H.s1 = sg(H.p[0] - 0.4, 'rgba(255, 255, 255, 0.38)', '999px 3px 3px 999px');
    H.s2 = sg(H.p[1] - 0.4, '#7FD3A8', '3px');
    H.s3 = sg(100 - H.p[0] - H.p[1] - 0.4, '#FFFFFF', '3px 999px 999px 3px');
    const CUR = { Combined: ['Combined · CA$', 'Everything, converted at each day’s rate'], CAD: ['CAD only', 'Canadian dollar accounts'], USD: ['USD only', 'US dollar accounts, in US$'], PEN: ['PEN only', 'Peruvian sol accounts, in S/'] };
    const curList = Object.keys(CUR).map((k) => ({ label: CUR[k][0], sub: CUR[k][1], pressed: k === s.currency ? 'true' : 'false', pick: () => this.setState({ currency: k, sheet: null }),
      style: 'width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; ' + (k === s.currency ? 'background: #F4F1FD; box-shadow: inset 0 0 0 1.5px #5134C9;' : 'background: #F6F5F8;'),
      check: 'display: flex; opacity: ' + (k === s.currency ? '1' : '0') + ';' }));
    const tg = (k) => ({ attr: s[k] ? 'true' : 'false', toggle: () => this.setState({ [k]: !s[k] }),
      track: 'width: 44px; height: 26px; flex-shrink: 0; border-radius: 999px; padding: 3px; box-sizing: border-box; display: flex; background: ' + (s[k] ? '#5134C9' : '#DCDAE3') + '; justify-content: ' + (s[k] ? 'flex-end' : 'flex-start') + ';',
      knob: 'width: 20px; height: 20px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);' });
    const sh = { rate: s.tPct ? (s.tAmt ? '18.5%' : '18.5%') : '—', spend: s.tAmt ? 'CA$4,050' : (s.tPct ? '−6.0%' : '—'), nw: s.tAmt ? '+CA$1,860' : (s.tPct ? '+0.8%' : '—'),
      foot: s.tAmt ? 'Includes amounts in CA$.' : 'No amounts or account names included.' };
    const open = (k) => () => this.setState({ sheet: k });
    return {
      h: H, scopes: ['Personal', 'Household'].map((o) => ({ label: o, pressed: o === s.scope ? 'true' : 'false', style: seg(o === s.scope), pick: () => this.setState({ scope: o }) })),
      hasHousehold: !!s.household, isPersonal: s.scope !== 'Household', isHousehold: s.scope === 'Household', curLabel: CUR[s.currency][0], curList,
      tPct: tg('tPct'), tAmt: tg('tAmt'), tNames: tg('tNames'), tMembers: tg('tMembers'), sh,
      openShare: open('share'), openTable: open('table'), openArchive: open('archive'), openCurrency: open('currency'), closeSheet: () => this.setState({ sheet: null }),
      sheetShare: s.sheet === 'share', sheetTable: s.sheet === 'table', sheetArchive: s.sheet === 'archive', sheetCurrency: s.sheet === 'currency'
    };
  }
}
