<body>
<template id="x-dc">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">

<div style="width: 393px; height: 852px; position: relative; overflow: hidden; background: #FAFAF8; font-family: Inter, system-ui, sans-serif; color: #111114">

<div style="height: 100%; overflow-y: auto; box-sizing: border-box; padding: 62px 20px 132px; display: flex; flex-direction: column; gap: 22px">
<header style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between; height: 40px">
<div style="display: flex; align-items: center; gap: 10px"><a href="Main.dc.html" aria-label="Back" style="width: 32px; height: 32px; margin-left: -6px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2A2540" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a><span style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: #6B6B76">SHARED FINANCES</span></div>
<sc-if value="{{hasHH}}" hint-placeholder-val="{{true}}"><button aria-label="Household settings" style="width: 40px; height: 40px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E9E7EF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2A2540" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></button></sc-if>
</div>
<h1 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -0.02em">Household</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: #55555F">Manage shared money while keeping personal finances clear.</p>
<div class="kipu-noscroll" role="navigation" aria-label="Sections" style="display: flex; gap: 6px; overflow-x: auto; margin: 2px -20px 0; padding: 0 20px"><a href="Money.dc.html" style="flex-shrink: 0; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; display: flex; align-items: center; background: #F1F0F4; color: #3A3A42; font-weight: 500">Accounts</a><a href="Cards.dc.html" style="flex-shrink: 0; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; display: flex; align-items: center; background: #F1F0F4; color: #3A3A42; font-weight: 500">Cards</a><a href="Loans.dc.html" style="flex-shrink: 0; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; display: flex; align-items: center; background: #F1F0F4; color: #3A3A42; font-weight: 500">Loans</a><a href="Transactions.dc.html" style="flex-shrink: 0; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; display: flex; align-items: center; background: #F1F0F4; color: #3A3A42; font-weight: 500">Activity</a><a href="Household.dc.html" aria-current="page" style="flex-shrink: 0; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; display: flex; align-items: center; background: #111114; color: #FFFFFF; font-weight: 600">Household</a></div>
</header>

<sc-if value="{{noHH}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 20px">
<section style="padding: 26px 22px; border-radius: 24px; background: #FFFFFF; border: 1px solid #EEEDF2; display: flex; flex-direction: column; gap: 14px">
<span style="width: 52px; height: 52px; border-radius: 16px; background: #F4F1FD; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5134C9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10.5h12v9.5H6zM8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3"></path></svg></span>
<span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 24px; line-height: 30px; font-weight: 700; letter-spacing: -0.02em">Your finances can stay personal.</span>
<span style="font-size: 14px; line-height: 21px; color: #55555F">Create a Household only if you want to manage shared expenses, accounts, goals or budgets with someone else.</span>
<button onClick="{{openCreate}}" style="height: 50px; border-radius: 16px; background: #5134C9; color: #FFFFFF; font-size: 15px; font-weight: 600; margin-top: 4px">Create Household</button>
<span style="font-size: 12px; color: #6B6B76; text-align: center">You can keep using Kipu personally without creating one.</span>
</section>
<section style="display: flex; flex-direction: column; gap: 10px"><span style="font-size: 12px; font-weight: 600; color: #6B6B76">A Household can help you share</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px"><sc-for list="{{shareables}}" as="s" hint-placeholder-count="6"><span style="padding: 14px 8px; border-radius: 16px; background: #F6F5F8; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: #3A3A42"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2D5DB0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{s.icon}}"></path></svg>{{s.label}}</span></sc-for></div>
<span style="font-size: 12px; line-height: 17px; color: #8A8896">You choose each item to share. Nothing personal is shared by default.</span>
</section>
</div>
</sc-if>

<sc-if value="{{hasHH}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 22px">

<div style="display: flex; align-items: center; gap: 12px"><span style="width: 44px; height: 44px; border-radius: 14px; background: #EEF3FB; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2D5DB0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1z"></path></svg></span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700">{{hhName}}</span><span style="font-size: 12px; color: #6B6B76">{{memberCount}} · CAD · you’re the owner</span></span></div>

<div role="group" aria-label="View" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 3px; gap: 2px; background: #F1F0F4; border-radius: 12px"><sc-for list="{{scopes}}" as="o" hint-placeholder-count="2"><button onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="{{o.style}}">{{o.label}}</button></sc-for></div>

<sc-if value="{{isPersonal}}" hint-placeholder-val="{{false}}">
<section style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<span style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: #5134C9"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5134C9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10.5h12v9.5H6zM8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3"></path></svg>Personal view · only you see this</span>
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #6B6B76">Your personal cash</span><span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums">CA$9,360</span></span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76">Personal Safe to Spend</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">CA$1,060</b></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76">Your cards</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">CA$2,400 · 20%</b></span></div>
<span style="font-size: 12px; color: #6B6B76">Switch to Household to see shared money. Personal and Household Safe to Spend are always calculated separately.</span>
</section>
</sc-if>

<sc-if value="{{isHousehold}}" hint-placeholder-val="{{true}}">

<section aria-label="Household summary" style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; border-radius: 24px; overflow: hidden">
<div style="padding: 20px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #6B6B76">Household cash</span><span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 36px; line-height: 40px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">{{sum.cash}}</span><span style="font-size: 12px; color: #2D5DB0">Shared accounts plus balances members chose to include</span></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px; padding: 16px 20px; border-top: 1px solid #F1F0F4"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76">Shared monthly income</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">CA$6,590</b></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76">Shared spending</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">CA$4,050</b></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76">Shared debt</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">CA$45,270</b></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76">Shared goals</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; color: #1A6B46">CA$8,200</b></span></div>
</section>

<section style="padding: 16px; border-radius: 20px; background: #F4F1FD; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 13px; font-weight: 600; color: #2B1F66">Household Safe to Spend</span><b style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 22px; font-weight: 700; color: #2B1F66; font-variant-numeric: tabular-nums">CA$1,480</b></div>
<div style="display: flex; height: 8px; gap: 2px"><span style="width: 63.9%; background: #B7A9EC; border-radius: 999px 3px 3px 999px"></span><span style="flex-grow: 1; background: #5134C9; border-radius: 3px 999px 999px 3px"></span></div>
<span style="font-size: 12px; color: #55506E; font-variant-numeric: tabular-nums">CA$4,100 shared cash − CA$2,620 shared commitments. Your personal Safe to Spend is separate.</span>
</section>

<section style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: space-between"><h2 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.01em">Members</h2><button onClick="{{openInvite}}" style="height: 32px; padding: 0 12px; border-radius: 999px; background: #F4F1FD; color: #5134C9; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 4px">+ Invite</button></div>
<div style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 2px 16px">
<sc-for list="{{members}}" as="m" hint-placeholder-count="3">
<button onClick="{{m.pick}}" style="{{m.row}}"><span style="{{m.avatar}}">{{m.initial}}</span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; text-align: left"><span style="font-size: 14px; font-weight: 600">{{m.name}}</span><span style="font-size: 12px; color: #6B6B76">{{m.sub}}</span></span><span style="{{m.roleStyle}}">{{m.role}}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A09EAB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></button>
</sc-for>
</div>
</section>

<section style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 700">This month</h2><span style="font-size: 12px; color: #6B6B76">Shared records only</span></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76">Shared income</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; color: #1A6B46">CA$6,590</b></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76">Shared spending</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">CA$4,050</b></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76">Shared savings</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">CA$1,220</b></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76">Net cash flow</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; color: #1A6B46">+CA$1,220</b></span></div>
</section>

<section style="display: flex; flex-direction: column; gap: 10px"><div style="display: flex; align-items: baseline; justify-content: space-between"><h2 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.01em">Shared accounts</h2><span style="font-size: 12px; color: #6B6B76">In Household totals</span></div>
<div style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 2px 16px"><sc-for list="{{accounts}}" as="r" hint-placeholder-count="3"><div style="{{r.row}}"><span style="{{r.tile}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{r.iconColor}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.icon}}"></path></svg></span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="display: flex; align-items: center; gap: 6px; min-width: 0"><span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span><span style="{{r.tagStyle}}">{{r.tag}}</span></span><span style="font-size: 12px; color: #6B6B76; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.sub}}</span><sc-if value="{{r.hasBar}}" hint-placeholder-val="{{false}}"><span style="height: 5px; background: #F1F0F4; border-radius: 999px; position: relative; display: block; margin-top: 3px"><span style="{{r.bar}}"></span></span></sc-if></span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0"><b style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">{{r.right}}</b><span style="font-size: 11px; color: #6B6B76; font-variant-numeric: tabular-nums">{{r.rightSub}}</span></span></div></sc-for></div></section>
<section style="display: flex; flex-direction: column; gap: 10px"><div style="display: flex; align-items: baseline; justify-content: space-between"><h2 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.01em">Shared credit</h2><span style="font-size: 12px; color: #6B6B76">18.4% household use</span></div>
<div style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 2px 16px"><sc-for list="{{cards}}" as="r" hint-placeholder-count="3"><div style="{{r.row}}"><span style="{{r.tile}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{r.iconColor}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.icon}}"></path></svg></span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="display: flex; align-items: center; gap: 6px; min-width: 0"><span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span><span style="{{r.tagStyle}}">{{r.tag}}</span></span><span style="font-size: 12px; color: #6B6B76; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.sub}}</span><sc-if value="{{r.hasBar}}" hint-placeholder-val="{{false}}"><span style="height: 5px; background: #F1F0F4; border-radius: 999px; position: relative; display: block; margin-top: 3px"><span style="{{r.bar}}"></span></span></sc-if></span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0"><b style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">{{r.right}}</b><span style="font-size: 11px; color: #6B6B76; font-variant-numeric: tabular-nums">{{r.rightSub}}</span></span></div></sc-for></div><span style="font-size: 11px; line-height: 16px; color: #8A8896">A card can belong to one person and still count in Household totals.</span></section>
<section style="display: flex; flex-direction: column; gap: 10px"><div style="display: flex; align-items: baseline; justify-content: space-between"><h2 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.01em">Shared loans</h2><span style="font-size: 12px; color: #6B6B76">CA$45,270</span></div>
<div style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 2px 16px"><sc-for list="{{loans}}" as="r" hint-placeholder-count="3"><div style="{{r.row}}"><span style="{{r.tile}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{r.iconColor}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.icon}}"></path></svg></span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="display: flex; align-items: center; gap: 6px; min-width: 0"><span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span><span style="{{r.tagStyle}}">{{r.tag}}</span></span><span style="font-size: 12px; color: #6B6B76; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.sub}}</span><sc-if value="{{r.hasBar}}" hint-placeholder-val="{{false}}"><span style="height: 5px; background: #F1F0F4; border-radius: 999px; position: relative; display: block; margin-top: 3px"><span style="{{r.bar}}"></span></span></sc-if></span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0"><b style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">{{r.right}}</b><span style="font-size: 11px; color: #6B6B76; font-variant-numeric: tabular-nums">{{r.rightSub}}</span></span></div></sc-for></div></section>
<section style="display: flex; flex-direction: column; gap: 10px"><div style="display: flex; align-items: baseline; justify-content: space-between"><h2 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.01em">Shared bills</h2><a href="Bills.dc.html" style="font-size: 13px; font-weight: 600; color: #5134C9">All bills ›</a></div>
