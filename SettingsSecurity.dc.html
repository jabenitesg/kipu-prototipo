        dotG: 'width: 5px; height: 5px; border-radius: 999px; background: ' + green + ';', dotA: 'width: 5px; height: 5px; border-radius: 2px; background: ' + amber + ';',
        btn: 'height: 28px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 600; background: ' + g + '; color: ' + M.hero + ';',
        nav: 'margin-top: 4px; height: 30px; border-radius: 12px; display: flex; align-items: center; justify-content: space-around; background: ' + M.surf + '; border: 1px solid ' + line + ';',
        navI: 'width: 12px; height: 4px; border-radius: 999px; background: ' + neutral + ';',
        navOn: 'width: 14px; height: 4px; border-radius: 999px; background: ' + M.acc + ';',
        navAdd: 'width: 18px; height: 18px; border-radius: 999px; background: ' + g + ';',
        apply: 'height: 52px; border-radius: 16px; font-size: 15px; font-weight: 600; background: ' + grad(T.gl) + '; color: ' + T.l.hero + ';' + (s.applied === name ? ' opacity: 0.55;' : ''),
        applyLabel: s.applied === name ? '✓ Applied' : 'Apply theme',
        applyNote: s.applied === name ? name + ' is your theme in Light and Dark.' : 'Currently using ' + s.applied + '. Preview anything before applying.'
      };
    };
    const pv = mk(s.theme, s.segs.preview ? s.segs.preview.v : 'Light');
    const themes = Object.keys(THEMES).map((n) => { const on = n === s.theme;
      return { name: n, pressed: on ? 'true' : 'false', pick: () => this.setState({ theme: n }),
        ring: 'width: 48px; height: 48px; box-sizing: border-box; border-radius: 999px; padding: 3px; display: flex; box-shadow: inset 0 0 0 2px ' + (on ? '#111114' : 'transparent') + ';',
        dot: 'flex-grow: 1; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: ' + grad(THEMES[n].gl) + ';',
        check: 'display: flex; opacity: ' + (on ? '1' : '0') + ';',
        labelStyle: 'font-size: 11px; text-align: center; line-height: 13px; ' + (on ? 'font-weight: 700; color: #111114;' : 'font-weight: 500; color: #6B6B76;') }; });
    const FREQ = { 'Important only': 'Only big changes, about one a week.', Balanced: 'A few useful insights each week.', 'More insights': 'Everything Kipu notices, still grouped.' };
    const ASSUME = { 'Recent avg': 'Uses your last 3 months of income and spending.', 'Budget based': 'Uses your budget plan as the expected spending.', Conservative: 'Assumes 10% less income and 10% more spending.', Custom: 'You set income and spending for each month.' };
    const desk = {}; ['Appearance', 'Currencies'].forEach((n) => { const on = s.desk === n; desk[n] = { pick: () => this.setState({ desk: n }),
      style: 'height: 40px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; font-size: 14px; text-align: left; ' + (on ? 'background: #F4F1FD; color: #5134C9; font-weight: 600;' : 'color: #55555F; font-weight: 500;') }; });
    const delOk = s.delText === 'DELETE';
    const hhIcons = Object.keys(HH_ICONS).map((k) => ({ d: HH_ICONS[k], pressed: k === s.hhIcon ? 'true' : 'false', pick: () => this.setState({ hhIcon: k }),
      style: 'width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; ' + (k === s.hhIcon ? 'background: #F4F1FD; color: #5134C9; box-shadow: inset 0 0 0 1.5px #5134C9;' : 'background: #F6F5F8; color: #55555F;') }));
    const open = (k) => () => this.setState({ sheet: k });
    return Object.assign({ onDel: this.onDel }, {
      sg, t, pv, pvL: mk(s.theme, 'Light'), pvD: mk(s.theme, 'Dark'), themes, apply: () => this.setState({ applied: s.theme }),
      baseLabel: v('base') || 'CAD', freqNote: FREQ[v('freq')] || '', assumeNote: ASSUME[v('assume')] || '', utilLabel: v('util') || '30%',
      hidePreview: s.on.pHide ? '••••••' : 'CA$8,420.50', hidePreviewNote: s.on.pHide ? 'Hidden · tap to reveal with Face ID' : 'Balances shown',
      desk, deskTheme: s.desk === 'Appearance', deskCur: s.desk === 'Currencies', deskTitle: s.desk === 'Appearance' ? 'Appearance & theme' : 'Currencies',
      deskSub: s.desk === 'Appearance' ? 'Preview every theme in Light and Dark before applying.' : 'Base currency, active currencies and exchange rates.',
      delText: s.delText, delDisabled: delOk ? 'false' : 'true', confirmDelete: () => {},
      delStyle: 'height: 54px; border-radius: 18px; font-size: 15px; font-weight: 600; ' + (delOk ? 'background: #A3325A; color: #FFFFFF;' : 'background: #F1F0F4; color: #A09EAB;'),
      hhIcons, openAddCur: open('addcur'), openBase: open('base'), openRule: open('rule'), closeSheet: () => this.setState({ sheet: null }),
      sheetAddCur: s.sheet === 'addcur', sheetBase: s.sheet === 'base', sheetRule: s.sheet === 'rule'
    });
  }
}
</script>
