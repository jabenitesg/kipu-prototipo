<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kipu Statistics, full scroll</title>

</head>
<body>
<template id="x-dc">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAFAF8;font-family:Inter,system-ui,sans-serif;color:#111114;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
a{color:#5134C9;text-decoration:none}a:hover{color:#3E24A8}
.kipu-noscroll{scrollbar-width:none}.kipu-noscroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 393px; height: 3280px; position: relative; overflow: hidden; background: #FAFAF8; font-family: Inter, system-ui, sans-serif; color: #111114">



<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: linear-gradient(180deg, rgba(250, 250, 248, 0) 0%, #FAFAF8 55%); pointer-events: none"></div>
<nav aria-label="Primary" style="position: absolute; left: 16px; right: 16px; bottom: 28px; height: 68px; background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 24px; box-shadow: 0 10px 30px rgba(24, 16, 64, 0.08); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #6B6B76; padding-bottom: 6px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6B76" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"></path></svg><span style="font-size: 11px; font-weight: 500">Home</span></a>
<a href="Money.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #6B6B76; padding-bottom: 6px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6B76" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V5.5A1.5 1.5 0 0 0 17.5 4h-12A2.5 2.5 0 0 0 3 6.5v11A2.5 2.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V9a1.5 1.5 0 0 0-1.5-1.5H5.5"></path><circle cx="16.5" cy="13.75" r="1" fill="#6B6B76"></circle></svg><span style="font-size: 11px; font-weight: 500">Money</span></a>
<div style="display: flex; justify-content: center"><a href="QuickAdd.dc.html" aria-label="Add" style="width: 58px; height: 58px; margin-top: -30px; border-radius: 999px; background: #5134C9; border: 4px solid #FAFAF8; box-sizing: content-box; box-shadow: 0 10px 24px rgba(81, 52, 201, 0.35); display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></a></div>
<a href="Plan.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #6B6B76; padding-bottom: 6px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6B76" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 12h10M4 19h6M15.5 17l2 2 3.5-4"></path></svg><span style="font-size: 11px; font-weight: 500">Plan</span></a>
<a href="Stats.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #111114"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111114" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V12M11 20V5M17 20v-9M3 20.5h18"></path></svg><span style="font-size: 11px; font-weight: 600">Stats</span><span style="width: 16px; height: 3px; border-radius: 999px; background: #5134C9"></span></a>
</nav>


<div style="height: 100%; overflow: hidden; box-sizing: border-box; padding: 62px 20px 132px; display: flex; flex-direction: column; gap: 24px">

<header style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between; height: 40px">
<div style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: #6B6B76">FINANCIAL PERFORMANCE</div>
<button aria-label="Filters" style="width: 40px; height: 40px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E9E7EF; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2A2540" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
</button>
</div>
<h1 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -0.02em">Statistics</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: #55555F">Understand how your money is changing over time.</p>
<div class="kipu-noscroll" role="navigation" aria-label="Sections" style="display: flex; gap: 6px; overflow-x: auto; margin: 2px -20px 0; padding: 0 20px"><a href="Stats.dc.html" aria-current="page" style="flex-shrink: 0; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; display: flex; align-items: center; background: #111114; color: #FFFFFF; font-weight: 600">Statistics</a><a href="Insights.dc.html" style="flex-shrink: 0; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; display: flex; align-items: center; background: #F1F0F4; color: #3A3A42; font-weight: 500">Insights</a><a href="Review.dc.html" style="flex-shrink: 0; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; display: flex; align-items: center; background: #F1F0F4; color: #3A3A42; font-weight: 500">Reviews</a><a href="Projections.dc.html" style="flex-shrink: 0; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; display: flex; align-items: center; background: #F1F0F4; color: #3A3A42; font-weight: 500">Forecast</a></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 6px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
<div style="position: relative">
<button onClick="{{f.toggle}}" aria-haspopup="listbox" aria-expanded="{{f.expanded}}" style="width: 100%; height: 48px; box-sizing: border-box; padding: 0 10px 0 12px; background: #FFFFFF; border: 1px solid #E9E7EF; border-radius: 14px; display: flex; align-items: center; justify-content: space-between; text-align: left">
<span style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
<span style="font-size: 10px; font-weight: 600; letter-spacing: 0.06em; color: #6B6B76">{{f.label}}</span>
<span style="font-size: 13px; font-weight: 600; color: #111114; white-space: nowrap">{{f.value}}</span>
</span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B6B76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
</button>
<sc-if value="{{f.open}}" hint-placeholder-val="{{false}}">
<div role="listbox" style="position: absolute; top: 54px; left: 0; right: 0; z-index: 20; padding: 5px; background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 14px; box-shadow: 0 12px 32px rgba(24, 16, 64, 0.12); display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{f.options}}" as="o" hint-placeholder-count="3">
<button onClick="{{o.pick}}" role="option" aria-selected="{{o.selectedAttr}}" style="{{o.style}}">{{o.label}}</button>
</sc-for>
</div>
</sc-if>
</div>
</sc-for>
</div>
</header>

<nav aria-label="Statistics sections" class="kipu-noscroll" style="margin: -8px -20px 0; padding: 0 20px; overflow-x: auto; border-bottom: 1px solid #ECEBF0">
<div style="display: flex; gap: 22px; width: max-content">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="7">
<button onClick="{{t.pick}}" aria-current="{{t.current}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>
</nav>

<section aria-label="September summary" style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))">
<div style="padding: 14px 16px; border-right: 1px solid #F1F0F4; border-bottom: 1px solid #F1F0F4; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 12px; color: #6B6B76">Income</span><span style="padding: 2px 6px; border-radius: 999px; background: #E6F4EC; color: #1A6B46; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums">↑ 4.2%</span></div>
<span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums">CA$6,590</span>
<svg width="100%" height="30" viewBox="0 0 140 30" preserveAspectRatio="none" style="display: block; overflow: visible"><path d="{{spark.income.d}}" fill="none" stroke="#2E9B69" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></path><circle cx="140" cy="{{spark.income.y}}" r="2.6" fill="#2E9B69"></circle></svg>
</div>
<div style="padding: 14px 16px; border-bottom: 1px solid #F1F0F4; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 12px; color: #6B6B76">Spending</span><span style="padding: 2px 6px; border-radius: 999px; background: #E6F4EC; color: #1A6B46; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums">↓ 6.1%</span></div>
<span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums">CA$4,050</span>
<svg width="100%" height="30" viewBox="0 0 140 30" preserveAspectRatio="none" style="display: block; overflow: visible"><path d="{{spark.spend.d}}" fill="none" stroke="#2E9B69" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></path><circle cx="140" cy="{{spark.spend.y}}" r="2.6" fill="#2E9B69"></circle></svg>
</div>
<div style="padding: 14px 16px; border-right: 1px solid #F1F0F4; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 12px; color: #6B6B76">Savings</span><span style="padding: 2px 6px; border-radius: 999px; background: #E6F4EC; color: #1A6B46; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums">↑ 18.4%</span></div>
<span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums">CA$1,220</span>
<svg width="100%" height="30" viewBox="0 0 140 30" preserveAspectRatio="none" style="display: block; overflow: visible"><path d="{{spark.saved.d}}" fill="none" stroke="#2E9B69" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></path><circle cx="140" cy="{{spark.saved.y}}" r="2.6" fill="#2E9B69"></circle></svg>
</div>
<div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 12px; color: #6B6B76">Savings rate</span><span style="padding: 2px 6px; border-radius: 999px; background: #E6F4EC; color: #1A6B46; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums">↑ 2.8 pts</span></div>
<span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums">18.7%</span>
<svg width="100%" height="30" viewBox="0 0 140 30" preserveAspectRatio="none" style="display: block; overflow: visible"><path d="{{spark.rate.d}}" fill="none" stroke="#2E9B69" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></path><circle cx="140" cy="{{spark.rate.y}}" r="2.6" fill="#2E9B69"></circle></svg>
</div>
<div style="grid-column: 1 / -1; padding: 8px 16px; border-top: 1px solid #F1F0F4; font-size: 11px; color: #6B6B76; display: flex; justify-content: space-between"><span>Jan – Sep trend</span><span>Change vs August</span></div>
</section>

<section style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px">
<div style="display: flex; flex-direction: column; gap: 3px">
<h2 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.01em">Monthly spending</h2>
<p style="margin: 0; font-size: 13px; color: #6B6B76">Are you spending more or less over time?</p>
</div>
<span style="flex-shrink: 0; padding: 3px 8px; border-radius: 999px; background: #E6F4EC; color: #1A6B46; font-size: 11px; font-weight: 600">↓ 6.1% vs Aug</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="position: relative; width: 321px; height: 150px">
<svg width="321" height="150" viewBox="0 0 321 150" style="position: absolute; left: 0; top: 0; overflow: visible">
<path d="M32 27.75H321M32 75H321M32 122.25H321" stroke="#F1F0F4" stroke-width="1"></path>
<text x="0" y="31" font-size="10" fill="#8A8896" font-family="Inter, sans-serif">4.6k</text>
<text x="0" y="79" font-size="10" fill="#8A8896" font-family="Inter, sans-serif">4.3k</text>
<text x="0" y="126" font-size="10" fill="#8A8896" font-family="Inter, sans-serif">4.0k</text>
<path d="{{spendArea}}" fill="#5134C9" fill-opacity="0.06"></path>
<path d="M32 69.3H321" stroke="#6E8FC9" stroke-width="1.2" stroke-dasharray="3 4"></path>
<path d="{{spendPath}}" fill="none" stroke="#5134C9" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"></path>
</svg>
<div style="position: absolute; right: 0; top: 50px; font-size: 10px; font-weight: 600; color: #3E5F9E; background: #FFFFFF; padding: 0 0 0 4px">Avg CA$4,336</div>
<div style="{{spendGuideStyle}}"></div>
<sc-for list="{{spendDots}}" as="d" hint-placeholder-count="9">
<div style="{{d.style}}"></div>
</sc-for>
<div style="position: absolute; left: 32px; top: 0; width: 289px; height: 150px; display: grid; grid-template-columns: repeat(9, minmax(0, 1fr))">
<sc-for list="{{spendCols}}" as="c" hint-placeholder-count="9">
<button onClick="{{c.pick}}" aria-label="{{c.aria}}" aria-pressed="{{c.pressed}}" style="height: 150px"></button>
</sc-for>
</div>
</div>
<div style="margin-left: 32px; display: grid; grid-template-columns: repeat(9, minmax(0, 1fr))">
<sc-for list="{{spendCols}}" as="c" hint-placeholder-count="9">
<span style="{{c.labelStyle}}">{{c.short}}</span>
</sc-for>
</div>
</div>
<div style="background: #F7F6FA; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 13px; font-weight: 600">{{sel.long}}</span>
<span style="font-size: 12px; color: #6B6B76">Top category <b style="font-weight: 600; color: #111114">{{sel.top}}</b></span>
</div>
<div style="display: flex; height: 10px; gap: 2px">
<div style="{{sel.spendBar}}"></div>
<div style="{{sel.savedBar}}"></div>
<div style="flex-grow: 1; background: #DCD8E6; border-radius: 3px 999px 999px 3px"></div>
</div>
<div style="display: flex; justify-content: space-between; font-size: 12px; font-variant-numeric: tabular-nums">
<span style="display: flex; flex-direction: column; gap: 1px"><span style="display: flex; align-items: center; gap: 5px; color: #6B6B76"><span style="width: 7px; height: 7px; border-radius: 2px; background: #5134C9"></span>Spent</span><b style="font-size: 14px; font-weight: 700">{{sel.spend}}</b></span>
<span style="display: flex; flex-direction: column; gap: 1px"><span style="display: flex; align-items: center; gap: 5px; color: #6B6B76"><span style="width: 7px; height: 7px; border-radius: 2px; background: #2E9B69"></span>Saved</span><b style="font-size: 14px; font-weight: 700">{{sel.saved}}</b></span>
<span style="display: flex; flex-direction: column; gap: 1px; text-align: right"><span style="color: #6B6B76">Income</span><b style="font-size: 14px; font-weight: 700">{{sel.income}}</b></span>
</div>
</div>
</section>

<section style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.01em">2026 overview</h2>
<a href="ReviewYear.dc.html" style="font-size: 13px; font-weight: 600; color: #5134C9; padding: 6px 0">View full year ›</a>
</div>
<div style="display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); height: 128px; align-items: end">
<sc-for list="{{yearCols}}" as="y" hint-placeholder-count="9">
<button onClick="{{y.pick}}" aria-label="{{y.aria}}" aria-pressed="{{y.pressed}}" style="height: 128px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center">
<span style="{{y.stackStyle}}">
<span style="flex-grow: 1; background: #E4E1EC"></span>
<span style="{{y.savedStyle}}"></span>
<span style="{{y.spentStyle}}"></span>
</span>
</button>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); margin-top: -6px">
<sc-for list="{{yearCols}}" as="y" hint-placeholder-count="9">
<span style="{{y.labelStyle}}">{{y.short}}</span>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding-top: 12px; border-top: 1px solid #F1F0F4; font-variant-numeric: tabular-nums">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="display: flex; align-items: center; gap: 5px; font-size: 12px; color: #6B6B76"><span style="width: 8px; height: 8px; border-radius: 2px; background: #E4E1EC; box-shadow: inset 0 0 0 1px #D2CEDC"></span>Income</span><b style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 700">{{sel.income}}</b></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="display: flex; align-items: center; gap: 5px; font-size: 12px; color: #6B6B76"><span style="width: 8px; height: 8px; border-radius: 2px; background: #5134C9"></span>Spent</span><b style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 700">{{sel.spend}}</b></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="display: flex; align-items: center; gap: 5px; font-size: 12px; color: #6B6B76"><span style="width: 8px; height: 8px; border-radius: 2px; background: #2E9B69"></span>Saved</span><b style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 700; color: #1A6B46">{{sel.saved}}</b></span>
</div>
</section>

<section style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 18px 16px 8px; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px">
<h2 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.01em">Where your money went</h2>
<span style="font-size: 12px; color: #6B6B76">CA$4,050</span>
</div>
<sc-for list="{{cats}}" as="k" hint-placeholder-count="7">
<div style="{{k.wrapStyle}}">
<button onClick="{{k.pick}}" aria-expanded="{{k.expanded}}" style="width: 100%; padding: 9px 0; display: flex; align-items: center; gap: 12px; text-align: left">
<span style="{{k.iconWrap}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{k.iconColor}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{k.icon}}"></path></svg></span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
<span style="display: flex; align-items: baseline; gap: 6px"><span style="font-size: 14px; font-weight: 600; color: #111114">{{k.name}}</span><span style="font-size: 11px; color: #8A8896; font-variant-numeric: tabular-nums">{{k.pct}}</span></span>
<span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums">{{k.amount}}</span>
</span>
<span style="display: flex; align-items: center; gap: 8px">
<span style="flex-grow: 1; height: 6px; background: #F1F0F4; border-radius: 999px; display: block; position: relative"><span style="{{k.barStyle}}"></span></span>
<span style="{{k.deltaStyle}}">{{k.delta}}</span>
</span>
</span>
</button>
<sc-if value="{{k.open}}" hint-placeholder-val="{{false}}">

      expanded: s.openFilter === f.key ? 'true' : 'false',
      toggle: () => this.setState({ openFilter: s.openFilter === f.key ? null : f.key }),
      options: f.options.map((o) => ({
        label: o,
        selectedAttr: o === s[f.key] ? 'true' : 'false',
        pick: () => this.setState({ [f.key]: o, openFilter: null }),
        style: optRow + (o === s[f.key] ? 'background: #F4F1FD; color: #2B1F66; font-weight: 600;' : 'background: transparent; color: #111114; font-weight: 500;')
      }))

    const tabs = ['Overview', 'Spending', 'Income', 'Cash Flow', 'Net Worth', 'Debt', 'Projections'].map((t) => ({
      label: t,
      current: t === s.tab ? 'page' : 'false',

      style: 'height: 40px; font-size: 14px; white-space: nowrap; border-bottom: 2px solid ' +

    const spend = [4350, 4100, 4420, 4280, 4600, 4390, 4520, 4310, 4050];
    const income = [6050, 6050, 6180, 6180, 6240, 6300, 6300, 6420, 6590];
    const saved = [880, 910, 820, 900, 760, 980, 1050, 1080, 1220];
    const rate = saved.map((v, i) => v / income[i] * 100);

    const sparkOf = (arr) => {
      const lo = Math.min.apply(null, arr), hi = Math.max.apply(null, arr);
      const ys = arr.map((v) => 3 + (hi - v) / (hi - lo) * 24);
      return {
        d: 'M' + ys.map((y, i) => (i * 17.5).toFixed(1) + ' ' + y.toFixed(1)).join(' L'),
        y: ys[ys.length - 1].toFixed(1)

      return {
        style: 'position: absolute; pointer-events: none; box-sizing: border-box; border-radius: 999px; left: ' + (sx(i) - r).toFixed(1) + 'px; top: ' + (sy(v) - r).toFixed(1) + 'px; width: ' + (r * 2) + 'px; height: ' + (r * 2) + 'px; ' +
          (on ? 'background: #5134C9; border: 2.5px solid #FFFFFF; box-shadow: 0 0 0 1px #5134C9, 0 4px 10px rgba(81, 52, 201, 0.3);' : 'background: #FFFFFF; border: 1.5px solid #5134C9;')

      aria: long[i] + ' spending ' + fmt(spend[i]),

      pick: () => this.setState({ month: i }),

    const px = 120 / 6590;
    const yearCols = short.map((lbl, i) => {
      const on = i === m;
      return {
        short: lbl,
        aria: long[i] + ': income ' + fmt(income[i]) + ', spent ' + fmt(spend[i]) + ', saved ' + fmt(saved[i]),
        pressed: on ? 'true' : 'false',

      };

    const icons = {
      Housing: 'M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z',
      Groceries: 'M4 9h16l-1.6 10.2a2 2 0 0 1-2 1.8H7.6a2 2 0 0 1-2-1.8zM8.5 9 12 3.5 15.5 9M9.5 13v4M14.5 13v4',
      Transportation: 'M5 11 6.6 6.9A2 2 0 0 1 8.5 5.5h7a2 2 0 0 1 1.9 1.4L19 11M5 11h14a2 2 0 0 1 2 2v4H3v-4a2 2 0 0 1 2-2zM6 17v2M18 17v2',
      Dining: 'M7 3v18M4.5 3v5a2.5 2.5 0 0 0 5 0V3M17 21V3c-2 0-3.5 2.5-3.5 6s1.5 4 3.5 4',
      Shopping: 'M5.5 8h13l-1 12.5h-11zM9 8V6.5a3 3 0 0 1 6 0V8',
      Subscriptions: 'M17 2.5 20 5.5l-3 3M4 11.5v-2a4 4 0 0 1 4-4h12M7 21.5l-3-3 3-3M20 12.5v2a4 4 0 0 1-4 4H4',
      Other: 'M5.5 12h.01M12 12h.01M18.5 12h.01'
    };
    const catData = [
      ['Housing', 1520, 1520], ['Groceries', 720, 780], ['Transportation', 610, 690], ['Dining', 420, 360],
      ['Shopping', 310, 400], ['Subscriptions', 186, 186], ['Other', 284, 374]
    ];
    const total = 4050;
    const cats = catData.map(([name, cur, prev], idx) => {
      const open = s.cat === name;
      const ch = (cur - prev) / prev * 100;
      const delta = ch === 0 ? '0.0%' : (ch > 0 ? '↑ ' : '↓ ') + Math.abs(ch).toFixed(1) + '%';
      const tone = ch > 0 ? '#A3325A' : ch < 0 ? '#1A6B46' : '#6B6B76';
      const toneBg = ch > 0 ? '#FCEBF1' : ch < 0 ? '#E6F4EC' : '#F1F0F4';
      const big = Math.max(cur, prev);
      return {
        name, open,
        expanded: open ? 'true' : 'false',
        amount: fmt(cur), prev: fmt(prev), delta,
        pct: (cur / total * 100).toFixed(1) + '%',
        icon: icons[name],
        iconColor: open ? '#FFFFFF' : '#2A2540',
        iconWrap: 'width: 32px; height: 32px; flex-shrink: 0; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: ' + (open ? '#5134C9' : '#F5F4F8') + ';',

        deltaStyle: 'flex-shrink: 0; min-width: 44px; text-align: center; padding: 1px 5px; border-radius: 999px; font-size: 10px; font-weight: 600; font-variant-numeric: tabular-nums; color: ' + tone + '; background: ' + toneBg + ';',

    const nw = [217800, 219100, 220400, 222900, 224300, 227000, 229800, 233100, 236200];
    const nColW = 321 / 9;

    const ny = (v) => 10 + (238000 - v) / 23000 * 92;
    const nwPath = 'M' + nw.map((v, i) => nx(i).toFixed(1) + ' ' + ny(v).toFixed(1)).join(' L');
    const nwArea = nwPath + ' L' + nx(8).toFixed(1) + ' 110 L' + nx(0).toFixed(1) + ' 110 Z';
    const n = s.nwMonth;
    const nwDotStyle = 'position: absolute; pointer-events: none; box-sizing: border-box; width: 12px; height: 12px; border-radius: 999px; background: #5134C9; border: 2.5px solid #FFFFFF; box-shadow: 0 0 0 1px #5134C9; left: ' + (nx(n) - 6).toFixed(1) + 'px; top: ' + (ny(nw[n]) - 6).toFixed(1) + 'px;';
    const nwGuideStyle = 'position: absolute; pointer-events: none; top: 0; height: 110px; width: 1px; background: #E4DDFA; left: ' + nx(n).toFixed(1) + 'px;';
    const nwCols = short.map((lbl, i) => ({
      short: lbl.charAt(0),
      aria: long[i] + ' net worth ' + fmt(nw[i]),
      pressed: i === n ? 'true' : 'false',
      pick: () => this.setState({ nwMonth: i }),
      labelStyle: 'text-align: center; font-size: 11px; ' + (i === n ? 'color: #111114; font-weight: 700;' : 'color: #8A8896; font-weight: 500;')
    }));
    const nwSel = { value: fmt(nw[n]), label: n === 8 ? 'As of Sep 24' : 'End of ' + long[n] };

    return {
      filters, tabs, spark,
      spendPath, spendArea, spendDots, spendGuideStyle, spendCols, sel,
      yearCols, cats,
      nwPath, nwArea, nwDotStyle, nwGuideStyle, nwCols, nwSel
    };
  }
}
