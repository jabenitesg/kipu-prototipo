<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peru 2026 trip, day and card selected</title>
<script src="./support.js"></script>
</head>
<body>
<template id="x-dc">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAFAF8;font-family:Inter,system-ui,sans-serif;color:#111114;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
input{font:inherit;color:#111114}
input::placeholder{color:#A09EAB}
a{color:#5134C9;text-decoration:none}a:hover{color:#3E24A8}
.kipu-noscroll{scrollbar-width:none}.kipu-noscroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 393px; height: 852px; position: relative; overflow: hidden; background: #FAFAF8; font-family: Inter, system-ui, sans-serif; color: #111114">

<div style="height: 100%; overflow-y: auto; box-sizing: border-box; padding: 58px 20px 132px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; align-items: center; justify-content: space-between; height: 40px">
<a href="Trips.dc.html" aria-label="Back to Trips" style="width: 40px; height: 40px; margin-left: -8px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2A2540" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
<div style="position: relative">
<button onClick="{{toggleMenu}}" aria-label="Trip actions" aria-haspopup="menu" aria-expanded="{{menuAttr}}" style="width: 40px; height: 40px; border-radius: 999px; background: #F5F4F8; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="#2A2540"><circle cx="5.5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="18.5" cy="12" r="1.6"></circle></svg></button>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
<div role="menu" style="position: absolute; top: 46px; right: 0; z-index: 30; width: 200px; padding: 6px; background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 16px; box-shadow: 0 14px 34px rgba(24, 16, 64, 0.14); display: flex; flex-direction: column">
<button role="menuitem" onClick="{{openEdit}}" style="height: 42px; padding: 0 10px; border-radius: 10px; display: flex; align-items: center; gap: 10px; font-size: 14px; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2A2540" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>Edit trip</button>
<button role="menuitem" onClick="{{openEdit}}" style="height: 42px; padding: 0 10px; border-radius: 10px; display: flex; align-items: center; gap: 10px; font-size: 14px; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2A2540" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M16 7.5c-.6-1.5-2.2-2.5-4-2.5-2.2 0-4 1.3-4 3.2 0 4.3 8 2.3 8 6.6 0 1.9-1.8 3.2-4 3.2-1.9 0-3.5-1-4.1-2.6"></path></svg>Change budget</button>
<button role="menuitem" onClick="{{openEdit}}" style="height: 42px; padding: 0 10px; border-radius: 10px; display: flex; align-items: center; gap: 10px; font-size: 14px; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2A2540" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1M9 11.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM22 20v-1a4 4 0 0 0-3-3.87M16 4.13a4 4 0 0 1 0 7.75"></path></svg>Manage members</button>
<button role="menuitem" onClick="{{closeMenu}}" style="height: 42px; padding: 0 10px; border-radius: 10px; display: flex; align-items: center; gap: 10px; font-size: 14px; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2A2540" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 4.5h17v4h-17zM5 8.5v11h14v-11M10 12.5h4"></path></svg>Archive trip</button>
<div style="height: 1px; background: #F1F0F4; margin: 4px 6px"></div>
<button role="menuitem" onClick="{{closeMenu}}" style="height: 38px; padding: 0 10px; border-radius: 10px; display: flex; align-items: center; gap: 10px; font-size: 13px; text-align: left; color: #A3325A"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#A3325A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"></path></svg>Delete trip</button>
</div>
</sc-if>
</div>
</div>

<header style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: #6B6B76">TRIP</span>
<h1 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -0.02em">Peru 2026</h1>
<span style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #55555F"><span>Sep 9 – Oct 2</span><span style="{{t.statusStyle}}">{{t.status}}</span><span style="font-size: 12px; color: #8A8896">{{t.dayLabel}}</span></span>
</header>

<sc-if value="{{isActive}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 22px">
<section style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; border-radius: 24px; overflow: hidden">
<div style="padding: 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: flex-end; font-variant-numeric: tabular-nums"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: #6B6B76">Spent</span><span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 36px; line-height: 40px; font-weight: 700; letter-spacing: -0.02em">CA$1,760</span></span><span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px"><span style="font-size: 13px; color: #6B6B76">Remaining</span><span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 20px; font-weight: 700; color: #1A6B46">CA$1,740</span></span></div>
<div style="height: 12px; background: #F1F0F4; border-radius: 999px; position: relative"><div style="position: absolute; left: 0; top: 0; bottom: 0; width: 50.3%; background: #5134C9; border-radius: 999px"></div></div>
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #55555F"><span><b style="color: #111114">50%</b> of CA$3,500 budget used</span></div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 14px 20px; border-top: 1px solid #F1F0F4"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76; display: flex; align-items: center; gap: 5px">Daily average</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">CA$110</b></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76; display: flex; align-items: center; gap: 5px">Projected final<span style="padding: 2px 7px; border: 1px dashed #9DB6E3; border-radius: 999px; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; color: #2D5DB0; white-space: nowrap">EST.</span></span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; color: #2D5DB0">{{fc.total}}</b></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76; display: flex; align-items: center; gap: 5px">{{fc.cushionLabel}}<span style="padding: 2px 7px; border: 1px dashed #9DB6E3; border-radius: 999px; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; color: #2D5DB0; white-space: nowrap">EST.</span></span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums{{fc.cushionColor}}">{{fc.cushion}}</b></span></div>
</section>

<div style="display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px">
<a href="AddExpenseForeign.dc.html" style="height: 50px; border-radius: 16px; background: #5134C9; color: #FFFFFF; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 8px 18px rgba(81, 52, 201, 0.25)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>Add trip expense</a>
<a href="ScanCamera.dc.html" style="height: 50px; border-radius: 16px; background: #F4F1FD; color: #5134C9; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5134C9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M9 10h6M9 14h4"></path></svg>Scan receipt</a>
</div>
<span style="margin-top: -14px; font-size: 11px; color: #8A8896; text-align: center">New expenses are tagged Peru 2026 automatically. You can remove the tag.</span>

<section style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 3px"><h2 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 700">Budget pace</h2><span style="font-size: 12px; color: #6B6B76">Are you spending too quickly?</span></div>
<div style="display: flex; flex-direction: column; gap: 8px; font-size: 12px; font-variant-numeric: tabular-nums">
<div style="display: grid; grid-template-columns: 86px minmax(0, 1fr) 40px; align-items: center; gap: 8px"><span style="color: #55555F">Budget used</span><span style="height: 10px; background: #F1F0F4; border-radius: 999px; position: relative; display: block"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 50.3%; background: #5134C9; border-radius: 999px"></span></span><b style="text-align: right">50%</b></div>
<div style="display: grid; grid-template-columns: 86px minmax(0, 1fr) 40px; align-items: center; gap: 8px"><span style="color: #55555F">Time used</span><span style="height: 10px; background: #F1F0F4; border-radius: 999px; position: relative; display: block"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 66.7%; background: #B7A9EC; border-radius: 999px"></span></span><b style="text-align: right">67%</b></div>
</div>
<span style="font-size: 13px; color: #1A6B46; font-weight: 600">Spending is slower than time. The pace looks comfortable.</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding-top: 12px; border-top: 1px solid #F1F0F4"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76; display: flex; align-items: center; gap: 5px">Trip length</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">24 days</b></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76; display: flex; align-items: center; gap: 5px">Days completed</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">16</b></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76; display: flex; align-items: center; gap: 5px">Current daily average</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">CA$110</b></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76; display: flex; align-items: center; gap: 5px">Left per day, 8 days</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; color: #1A6B46">CA$217</b></span></div>
<span style="font-size: 11px; color: #8A8896">Or about CA$165 a day after the planned expenses below.</span>
</section>
</div>
</sc-if>

<sc-if value="{{isReview}}" hint-placeholder-val="{{false}}">
<section style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; border-radius: 24px; overflow: hidden">
<div style="padding: 20px; display: flex; flex-direction: column; gap: 10px">
<span style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 13px; color: #6B6B76">Total spent</span><span style="padding: 3px 9px; border-radius: 999px; background: #E6F4EC; color: #1A6B46; font-size: 11px; font-weight: 600">CA$260 under budget</span></span>
<span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 36px; line-height: 40px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">CA$3,240</span>
<div style="height: 12px; background: #F1F0F4; border-radius: 999px; position: relative"><div style="position: absolute; left: 0; top: 0; bottom: 0; width: 92.6%; background: #2E9B69; border-radius: 999px"></div></div>
<span style="font-size: 12px; color: #55555F; font-variant-numeric: tabular-nums">of CA$3,500 budget · S/ 8,920 in PEN</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px; padding: 16px 20px; border-top: 1px solid #F1F0F4"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76; display: flex; align-items: center; gap: 5px">FX fees</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">CA$76</b></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76; display: flex; align-items: center; gap: 5px">Daily average</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">CA$135</b></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76; display: flex; align-items: center; gap: 5px">Largest category</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">Dining</b></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76; display: flex; align-items: center; gap: 5px">Most used payment</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">CIBC Visa</b></span></div>
<a href="Stats.dc.html" style="display: flex; justify-content: space-between; align-items: center; padding: 13px 20px; border-top: 1px solid #F4F3F7; font-size: 14px; font-weight: 600; color: #5134C9">View full trip review<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5134C9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></a>
</section>
</sc-if>

<section style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 700">Currencies</h2><span style="font-size: 12px; color: #6B6B76">1 CAD ≈ 2.76 PEN</span></div>
<div style="display: flex; align-items: center; gap: 12px; padding: 8px 0"><span style="padding: 3px 7px; border-radius: 7px; background: #EEF3FB; color: #2D5DB0; font-size: 11px; font-weight: 700">PEN</span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">{{t.pen}}</b><span style="font-size: 11px; color: #6B6B76">{{t.penSub}}</span></span><span style="font-size: 13px; color: #55555F; font-variant-numeric: tabular-nums">{{t.penCad}}</span></div>
<div style="display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid #F1F0F4"><span style="padding: 3px 7px; border-radius: 7px; background: #EEF3FB; color: #2D5DB0; font-size: 11px; font-weight: 700">USD</span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">US$120</b><span style="font-size: 11px; color: #6B6B76">Tour booked online</span></span><span style="font-size: 13px; color: #55555F; font-variant-numeric: tabular-nums">≈ CA$164</span></div>
<div style="display: flex; justify-content: space-between; padding: 10px 0 0; border-top: 1px solid #F1F0F4; font-size: 14px; font-variant-numeric: tabular-nums"><span style="font-weight: 600">CAD equivalent</span><b style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 700">{{t.total}}</b></div>
<span style="font-size: 11px; line-height: 16px; color: #8A8896">Each transaction keeps the rate from its own date. Live rates only change estimates and new entries.</span>
</section>

<section style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><div style="display: flex; flex-direction: column; gap: 3px"><h2 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 700">Daily spending</h2><span style="font-size: 12px; color: #6B6B76">Which days were expensive? Tap a day.</span></div></div>
<div style="position: relative; height: 140px">
<div style="position: absolute; left: 0; right: 0; bottom: 18px; top: 8px; display: flex; align-items: flex-end; gap: 3px">
<sc-for list="{{daily}}" as="d" hint-placeholder-count="16"><button onClick="{{d.pick}}" aria-label="{{d.aria}}" aria-pressed="{{d.pressed}}" style="flex: 1 1 0; height: 100%; display: flex; align-items: flex-end"><span style="{{d.style}}"></span></button></sc-for>
</div>
<span style="{{avgLine}}"></span><span style="{{avgLab}}">Avg CA$110</span>
<span style="position: absolute; left: 0; bottom: 0; font-size: 10px; color: #8A8896">Sep 9</span><span style="position: absolute; right: 0; bottom: 0; font-size: 10px; color: #8A8896">Sep 24</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76; display: flex; align-items: center; gap: 5px">Average</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">CA$110</b></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76; display: flex; align-items: center; gap: 5px">Highest day</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">Sep 12 · CA$230</b></span></div>
<sc-if value="{{day.open}}" hint-placeholder-val="{{false}}">
<div style="padding: 12px; border-radius: 14px; background: #F7F6FA; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-size: 13px; font-variant-numeric: tabular-nums"><b style="font-weight: 700">{{day.label}}</b><span style="color: #55555F">{{day.total}}</span></div>
<sc-for list="{{day.rows}}" as="r" hint-placeholder-count="3"><div style="display: flex; justify-content: space-between; gap: 10px; font-size: 12px; font-variant-numeric: tabular-nums"><span style="color: #3A3A42">{{r.m}} · <span style="color: #8A8896">{{r.c}}</span></span><b style="font-weight: 600">{{r.a}}</b></div></sc-for>
</div>
</sc-if>
</section>

<section style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px"><h2 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 700">By category</h2><span style="font-size: 12px; color: #6B6B76">With trip budgets</span></div>
<sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
<div style="{{c.row}}">
<div style="display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; font-variant-numeric: tabular-nums"><span style="font-weight: 600">{{c.name}}</span><span style="font-size: 13px; color: #55555F"><b style="color: #111114; font-weight: 700">{{c.spent}}</b>{{c.of}}</span></div>
<div style="height: 8px; background: #F1F0F4; border-radius: 999px; position: relative"><div style="{{c.fill}}"></div></div>
<div style="display: flex; justify-content: space-between; font-size: 11px; color: #6B6B76"><span style="{{c.noteStyle}}">{{c.note}}</span><span>{{c.share}} of trip</span></div>
</div>
</sc-for>
</section>

<sc-if value="{{hasMembers}}" hint-placeholder-val="{{true}}">
<section style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 700">By person</h2>
<div style="display: flex; height: 10px; gap: 2px"><sc-for list="{{members}}" as="m" hint-placeholder-count="2"><span style="{{m.bar}}"></span></sc-for></div>
<sc-for list="{{members}}" as="m" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 12px"><span style="{{m.avatar}}">{{m.initial}}</span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 600">{{m.name}}</span><span style="font-size: 11px; color: #6B6B76">{{m.meta}}</span></span><b style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">{{m.amount}}</b></div>
</sc-for>
<span style="font-size: 11px; color: #8A8896">Private card details stay private. Only trip totals are shared.</span>
