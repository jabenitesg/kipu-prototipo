<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Upload statement</title>
<script src="./support.js"></script>
</head>
<body>
<template id="x-dc">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAFAF8;font-family:Inter,system-ui,sans-serif;color:#111114;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
input{font:inherit;color:#111114}
input::placeholder{color:#A09EAB}
a{color:#5134C9;text-decoration:none}a:hover{color:#3E24A8}
.kipu-noscroll{scrollbar-width:none}.kipu-noscroll::-webkit-scrollbar{display:none}
@keyframes kipu-spin{to{transform:rotate(360deg)}}
@keyframes kipu-in{0%{opacity:0;transform:translateY(4px)}100%{opacity:1;transform:none}}
@keyframes kipu-sweep{0%{top:6%}50%{top:88%}100%{top:6%}}
@keyframes kipu-pulse{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</helmet>
<div style="width: 393px; height: 852px; position: relative; overflow: hidden; background: #FAFAF8; font-family: Inter, system-ui, sans-serif; color: #111114">

<div style="height: 100%; overflow-y: auto; box-sizing: border-box; padding: 58px 20px 40px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; align-items: center; justify-content: space-between; height: 40px"><a href="Cards.dc.html" aria-label="Close" style="width: 40px; height: 40px; border-radius: 999px; background: #F5F4F8; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2A2540" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></a><span style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: #8A8896"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8A8896" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v5c0 4.5 3 8.3 7 10 4-1.7 7-5.5 7-10V6z"></path></svg>Securely processed and stored</span></div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: #6B6B76">IMPORT STATEMENT</span>
<h1 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 28px; line-height: 32px; font-weight: 700; letter-spacing: -0.02em">Upload statement</h1>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #55555F">Add transactions and payment details from a bank or credit card statement.</p>
</div>
<section style="background: #F6F5F8; border-radius: 22px; padding: 22px 18px 18px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
<span style="width: 52px; height: 52px; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(24, 16, 64, 0.06)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5134C9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h4"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700">Choose a statement</span><span style="font-size: 13px; color: #6B6B76">PDF, image or photo · multi-page PDFs are fine</span></span>
<a href="StmtProcessing.dc.html" style="width: 100%; height: 50px; border-radius: 16px; background: #5134C9; color: #FFFFFF; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 8px 18px rgba(81, 52, 201, 0.26)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V5M7.5 9.5 12 5l4.5 4.5M5 19h14"></path></svg>Choose file</a>
<div style="width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<a href="StmtProcessing.dc.html" style="height: 44px; border-radius: 14px; background: #FFFFFF; font-size: 13px; font-weight: 600; color: #111114; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5134C9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4zM12 16.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"></path></svg>Take photo</a>
<a href="StmtProcessing.dc.html" style="height: 44px; border-radius: 14px; background: #FFFFFF; font-size: 13px; font-weight: 600; color: #111114; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5134C9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 5.5h17v13h-17zM8.5 11a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM20.5 15.5l-5-5-8 8"></path></svg>From photos</a>
</div>
<span style="font-size: 11px; color: #8A8896">CSV import is coming later.</span>
</section>
<section style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 12px; font-weight: 600; color: #6B6B76">Import to</span><span style="font-size: 11px; color: #8A8896">Optional</span></div>
<div style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{accounts}}" as="a" hint-placeholder-count="6">
<button onClick="{{a.pick}}" aria-pressed="{{a.pressed}}" style="{{a.style}}">
<span style="{{a.thumb}}"></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px; text-align: left"><span style="font-size: 14px; font-weight: 600">{{a.name}}</span><span style="font-size: 12px; color: #6B6B76">{{a.sub}}</span></span>
<span style="{{a.radio}}"><span style="{{a.dot}}"></span></span>
</button>
</sc-for>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 12px; font-weight: 600; color: #6B6B76">Owner</span><span style="font-size: 11px; color: #8A8896">{{ownerHint}}</span></div>
<div role="group" aria-label="Owner" style="display: flex; padding: 3px; gap: 2px; background: #F1F0F4; border-radius: 12px">
<sc-for list="{{owners}}" as="o" hint-placeholder-count="3"><button onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="{{o.style}}">{{o.label}}</button></sc-for>
</div>
</section>
</div>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { acc: 'detect', owner: 'Juan' }; }
  renderVals() {
    const s = this.state;
    const ACC = [
      ['detect', 'Detect from statement', 'Kipu reads the institution and card', 'linear-gradient(135deg, #F4F1FD, #E4DDFA)', null],
      ['cibc', 'CIBC Costco Mastercard', '•••• 4821 · Juan', 'linear-gradient(135deg, #3A3552, #111018)', 'Juan'],
      ['amex', 'American Express', '•••• 2714 · Karinna', 'linear-gradient(135deg, #F4F2F8, #BBB5CC)', 'Karinna'],
      ['chequing', 'Chequing', 'Shared account', 'linear-gradient(135deg, #E6F4EC, #BFE3CF)', 'Household'],
      ['usd', 'USD Account', 'Shared account', 'linear-gradient(135deg, #EAF1FC, #BCD0F0)', 'Household'],
      ['other', 'Other', 'Add a new account after import', 'linear-gradient(135deg, #F5F4F8, #E4E2EA)', null]
    ];
    const accounts = ACC.map((a) => { const on = a[0] === s.acc; return {
      name: a[1], sub: a[2], pressed: on ? 'true' : 'false', pick: () => this.setState(a[4] ? { acc: a[0], owner: a[4] } : { acc: a[0] }),
      thumb: 'width: 36px; height: 24px; flex-shrink: 0; border-radius: 5px; background: ' + a[3] + '; box-shadow: 0 1px 3px rgba(24, 16, 64, 0.14);',
      radio: 'width: 20px; height: 20px; flex-shrink: 0; border-radius: 999px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 2px solid ' + (on ? '#5134C9' : '#D2CEDC') + ';',
      dot: 'width: 10px; height: 10px; border-radius: 999px; background: ' + (on ? '#5134C9' : 'transparent') + ';',
      style: 'height: 58px; padding: 0 14px; border-radius: 16px; display: flex; align-items: center; gap: 12px; ' + (on ? 'background: #FFFFFF; box-shadow: inset 0 0 0 1.5px #5134C9;' : 'background: #F6F5F8;') }; });
    const seg = (on) => 'flex: 1 1 0; height: 38px; border-radius: 9px; font-size: 14px; ' + (on ? 'background: #FFFFFF; color: #111114; font-weight: 600; box-shadow: 0 1px 3px rgba(24, 16, 64, 0.12);' : 'color: #6B6B76; font-weight: 500;');
    const owners = ['Juan', 'Karinna', 'Household'].map((o) => ({ label: o, pressed: o === s.owner ? 'true' : 'false', style: seg(o === s.owner), pick: () => this.setState({ owner: o }) }));
    const cur = ACC.find((a) => a[0] === s.acc);
    return { accounts, owners, ownerHint: cur[4] ? 'Set from ' + (cur[0] === 'chequing' || cur[0] === 'usd' ? 'shared account' : 'card owner') : (s.acc === 'detect' ? 'Set from the card Kipu detects' : '') };
  }
}
</script>
</body>
</html>
