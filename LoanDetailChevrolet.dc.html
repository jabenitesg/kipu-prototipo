<div style="position: absolute; inset: 0; z-index: 40; background: rgba(17, 17, 20, 0.34)">
<button onClick="{{closeSheet}}" aria-label="Close" style="position: absolute; inset: 0; width: 100%; height: 100%"></button>
<div role="dialog" aria-modal="true" aria-label="Payment detail" style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 780px; overflow-y: auto; background: #FFFFFF; border-radius: 28px 28px 0 0; box-shadow: 0 -12px 40px rgba(24, 16, 64, 0.14); padding: 10px 20px 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: center"><span style="width: 36px; height: 5px; border-radius: 999px; background: #DCDAE3"></span></div>
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -0.02em">Payment · {{pay.date}}</span><span style="font-size: 13px; color: #6B6B76">{{loanName}}</span></span>
<button onClick="{{closeSheet}}" aria-label="Close" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 999px; background: #F5F4F8; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2A2540" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 34px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">{{pay.amount}}</span><span style="font-size: 13px; color: #1A6B46; font-weight: 600">Paid on time</span></div>
<div style="display: flex; flex-direction: column; gap: 8px"><div style="display: flex; height: 10px; gap: 2px"><span style="{{pay.princBar}}"></span><span style="flex-grow: 1; background: #7FA0D8; border-radius: 3px 999px 999px 3px"></span></div></div>
<div style="background: #F7F6FA; border-radius: 16px; padding: 4px 14px">
<sc-for list="{{pay.rows}}" as="r" hint-placeholder-count="5"><div style="{{r.style}}"><span style="color: #55555F">{{r.k}}</span><span style="font-weight: 600; font-variant-numeric: tabular-nums">{{r.v}}</span></div></sc-for>
</div>
</div>
</div>
</sc-if>

</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sim: '+CA$100', sheet: null, pay: 0 };
  }
  renderVals() {
    const s = this.state;
    const D = {"name": "Chevrolet", "owner": "Joint · Juan & Karinna", "remaining": 26850, "original": 36500, "pct": 26, "rate": "1.99%", "payment": "CA$662.34", "freq": "Monthly", "next": "Oct 01", "payoff": "Mar 2030", "principalPaid": 9650, "interestPaid": 790, "interestLeft": 970, "chart": {"B0": 36500, "a": 644.4, "b": -0.071, "T": 57, "now": 15, "start": "Jun 2025", "ms": [[14.2, "25%"], [28.5, "50%"], [43.3, "75%"]]}, "sims": {"+CA$50": ["Dec 2029", 3, 60], "+CA$100": ["Oct 2029", 5, 110], "+CA$200": ["Jun 2029", 9, 190], "Custom": ["Aug 2029", 7, 150]}, "history": [["Sep 1", 662.34, 616.79, 45.55, 26850.0], ["Aug 1", 662.34, 615.77, 46.57, 27466.79], ["Jul 1", 662.34, 614.75, 47.59, 28082.55]], "monthsLeft": 42};
    const fmt = (n, dd) => 'CA$' + n.toLocaleString('en-US', { minimumFractionDigits: dd || 0, maximumFractionDigits: dd || 0 });
    const C = D.chart;
    const B = (t) => Math.max(0, C.B0 - C.a * t - C.b * t * t);
    const X = (t) => 8 + t / C.T * 305;
    const Y = (v) => 14 + (1 - v / C.B0) * 120;
    const pathOf = (t0, t1, f) => { const pts = []; for (let i = 0; i <= 24; i++) { const t = t0 + (t1 - t0) * i / 24; pts.push(X(t).toFixed(1) + ' ' + Y(f(t)).toFixed(1)); } return 'M' + pts.join(' L'); };
    const keys = ['+CA$50', '+CA$100', '+CA$200', 'Custom'];
    const cur = D.sims[s.sim];
    const Tsim = C.T - cur[1];
    const simF = (t) => B(C.now + (t - C.now) * (C.T - C.now) / (Tsim - C.now));
    const ms = C.ms.map((m) => { const t = m[0], v = B(t), past = t <= C.now; return {
      label: m[1] + ' paid',
      dotStyle: 'position: absolute; width: 8px; height: 8px; border-radius: 999px; box-sizing: border-box; left: ' + (X(t) - 4).toFixed(1) + 'px; top: ' + (Y(v) - 4).toFixed(1) + 'px; ' + (past ? 'background: #2E9B69;' : 'background: #FFFFFF; border: 1.5px solid #8A8896;'),
      labelStyle: 'position: absolute; white-space: nowrap; font-size: 10px; font-weight: 600; left: ' + (X(t) + 7).toFixed(1) + 'px; top: ' + (Y(v) - 16).toFixed(1) + 'px; color: ' + (past ? '#1A6B46' : '#6B6B76') + ';' }; });
    ms.push({ label: 'Paid off', dotStyle: 'position: absolute; width: 10px; height: 10px; border-radius: 999px; box-sizing: border-box; background: #FFFFFF; border: 2px solid #8A8896; left: ' + (X(C.T) - 5).toFixed(1) + 'px; top: ' + (Y(0) - 5).toFixed(1) + 'px;',
      labelStyle: 'position: absolute; white-space: nowrap; font-size: 10px; font-weight: 600; color: #6B6B76; right: 0; top: ' + (Y(0) - 20).toFixed(1) + 'px;' });
    const nx = X(C.now), ny = Y(B(C.now));
    const chart = {
      actual: pathOf(0, C.now, B), projected: pathOf(C.now, C.T, B), sim: pathOf(C.now, Tsim, simF), milestones: ms,
      nowDot: 'position: absolute; width: 12px; height: 12px; border-radius: 999px; box-sizing: border-box; background: #2E9B69; border: 2.5px solid #FFFFFF; box-shadow: 0 0 0 1px #2E9B69; left: ' + (nx - 6).toFixed(1) + 'px; top: ' + (ny - 6).toFixed(1) + 'px;',
      nowLabel: 'position: absolute; white-space: nowrap; font-size: 10px; font-weight: 700; color: #111114; font-variant-numeric: tabular-nums; left: ' + (nx - 30).toFixed(1) + 'px; top: ' + (ny + 10).toFixed(1) + 'px;',
      todayStyle: 'position: absolute; top: 144px; font-size: 10px; font-weight: 600; color: #111114; transform: translateX(-50%); left: ' + nx.toFixed(1) + 'px;'
    };
    const optStyle = (on) => 'height: 40px; border-radius: 12px; font-size: 13px; ' + (on ? 'background: #5134C9; color: #FFFFFF; font-weight: 600;' : 'background: #F5F4F8; color: #3A3A42; font-weight: 500;');
    const simOpts = keys.map((k) => ({ label: k === 'Custom' ? 'Custom' : k.replace('CA$', '$'), pressed: k === s.sim ? 'true' : 'false', style: optStyle(k === s.sim), pick: () => this.setState({ sim: k }) }));
    const left = D.monthsLeft;
    const sim = {
      label: s.sim === 'Custom' ? '+CA$150' : s.sim, isCustom: s.sim === 'Custom', date: cur[0], saved: cur[1] + ' months', interest: fmt(cur[2]),
      barStyle: 'height: 10px; border-radius: 999px; background: #5134C9; display: block; width: ' + ((left - cur[1]) / left * 100).toFixed(1) + '%;'
    };
    const history = D.history.map((p, i) => ({
      date: p[0], amount: fmt(p[1], 2), principal: fmt(p[2], 2), interest: fmt(p[3], 2), aria: 'Payment ' + p[0] + ', ' + fmt(p[1], 2),
      princBar: 'width: ' + (p[2] / p[1] * 100).toFixed(1) + '%; background: #2E9B69; border-radius: 999px 2px 2px 999px;',
      rowStyle: 'width: 100%; padding: 14px 0; display: flex; flex-direction: column; gap: 8px; text-align: left;' + (i > 0 ? ' border-top: 1px solid #F1F0F4;' : ''),
      pick: () => this.setState({ sheet: 'pay', pay: i })
    }));
    const P = D.history[s.pay || 0];
    const pairs = [['Principal', fmt(P[2], 2)], ['Interest', fmt(P[3], 2)], ['Balance after', fmt(P[4], 2)], ['Method', 'Autopay'], ['Status', 'Paid']];
    const pay = { date: P[0], amount: fmt(P[1], 2), princBar: 'width: ' + (P[2] / P[1] * 100).toFixed(1) + '%; background: #2E9B69; border-radius: 999px 3px 3px 999px;',
      rows: pairs.map((r, i) => ({ k: r[0], v: r[1], style: 'display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; font-size: 14px;' + (i < pairs.length - 1 ? ' border-bottom: 1px solid #ECEAF1;' : '') })) };
    return {
      chart, simOpts, sim, history, pay, loanName: D.name,
      nextSim: () => this.setState({ sim: keys[(keys.indexOf(s.sim) + 1) % keys.length] }),
      sheetPay: s.sheet === 'pay', closeSheet: () => this.setState({ sheet: null })
    };
  }
}
</script>
