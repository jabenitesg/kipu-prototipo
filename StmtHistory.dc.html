<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { menu: true, confirm: false, also: false }; }
  renderVals() {
    const s = this.state;
    return {
      menuOpen: !!s.menu, menuExpanded: s.menu ? 'true' : 'false', toggleMenu: () => this.setState({ menu: !s.menu }),
      askDelete: () => this.setState({ menu: false, confirm: true }), confirmOpen: !!s.confirm, cancelDelete: () => this.setState({ confirm: false, also: false }),
      alsoAttr: s.also ? 'true' : 'false', toggleAlso: () => this.setState({ also: !s.also }),
      alsoBox: 'width: 22px; height: 22px; flex-shrink: 0; border-radius: 6px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; ' + (s.also ? 'background: #A3325A;' : 'background: #FFFFFF; border: 2px solid #D2CEDC;'),
      deleteLabel: s.also ? 'Delete all' : 'Delete record'
    };
  }
}
