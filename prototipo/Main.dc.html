<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { member: 'Household', currency: 'CAD', menuOpen: false };
  }
  renderVals() {
    const s = this.state;
    const pill = 'height: 24px; padding: 0 9px; border-radius: 999px; font-size: 11px; font-weight: 600; ';
    const currencies = ['CAD', 'USD', 'Combined'].map((c) => ({
      label: c,
      pressed: c === s.currency ? 'true' : 'false',
      pick: () => this.setState({ currency: c }),
      style: pill + (c === s.currency
        ? 'background: #FFFFFF; color: #2B1F66; box-shadow: 0 1px 3px rgba(43, 31, 102, 0.14);'
        : 'background: transparent; color: #5A5670;')
    }));
    const row = 'height: 40px; padding: 0 10px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; text-align: left; ';
    const members = ['Juan', 'Karinna', 'Household'].map((m) => ({
      label: m,
      selected: m === s.member,
      selectedAttr: m === s.member ? 'true' : 'false',
      pick: () => this.setState({ member: m, menuOpen: false }),
      style: row + (m === s.member ? 'background: #F4F1FD; color: #2B1F66; font-weight: 600;' : 'background: transparent; color: #111114; font-weight: 500;')
    }));
    const credit = [
      { name: 'Juan', pct: '20%', w: 20 },
      { name: 'Karinna', pct: '16.5%', w: 16.5 },
      { name: 'Household', pct: '18.4%', w: 18.4 }
    ].map((r) => {
      const on = r.name === s.member;
      return {
        name: r.name,
        pct: r.pct,
        nameStyle: on ? 'color: #111114; font-weight: 600;' : 'color: #55555F; font-weight: 500;',
        fillStyle: 'position: absolute; left: 0; top: 0; bottom: 0; width: ' + r.w + '%; border-radius: 999px; background: ' + (on ? '#5134C9' : '#2A2540') + ';'
      };
    });
    return {
      member: s.member,
      menuOpen: s.menuOpen,
      menuExpanded: s.menuOpen ? 'true' : 'false',
      toggleMenu: () => this.setState({ menuOpen: !s.menuOpen }),
      members,
      currencies,
      credit
    };
  }
}
</script>
