<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Card detail, overview</title>
<script src="./support.js"></script>
</head>
<body>
<template id="x-dc">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAFAF8;font-family:Inter,system-ui,sans-serif;color:#111114;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
input{font:inherit;color:#111114}
input::placeholder{color:#A09EAB}
a{color:#5134C9;text-decoration:none}a:hover{color:#3E24A8}
.kipu-noscroll{scrollbar-width:none}.kipu-noscroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 393px; height: 852px; position: relative; overflow: hidden; background: #FAFAF8; font-family: Inter, system-ui, sans-serif; color: #111114">

<div style="height: 100%; overflow-y: auto; box-sizing: border-box; padding: 62px 20px 132px; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; align-items: center; justify-content: space-between; height: 40px">
<a href="Cards.dc.html" style="display: flex; align-items: center; gap: 4px; margin-left: -6px; font-size: 14px; font-weight: 600; color: #2A2540"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2A2540" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>Credit Cards</a>
<div style="position: relative"><button onClick="{{toggleMenu}}" aria-label="Card actions" aria-haspopup="menu" aria-expanded="{{menuExpanded}}" style="width: 36px; height: 36px; border-radius: 999px; background: #F5F4F8; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="#2A2540"><circle cx="5.5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="18.5" cy="12" r="1.6"></circle></svg></button><sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
<div role="menu" style="position: absolute; top: 44px; right: 0; z-index: 30; width: 200px; padding: 6px; background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 16px; box-shadow: 0 14px 34px rgba(24, 16, 64, 0.14); display: flex; flex-direction: column">
<sc-for list="{{menuItems}}" as="m" hint-placeholder-count="5">
<button role="menuitem" onClick="{{m.pick}}" style="{{m.style}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{m.color}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{m.icon}}"></path></svg>{{m.label}}</button>
</sc-for>
</div>
</sc-if></div>
</div>

<button aria-label="{{card.name}}" style="{{card.style}}; width: 353px; height: 222px; cursor: default">
<span style="position: absolute; inset: 0; background: {{card.sheen}}; pointer-events: none"></span>
<span style="position: absolute; right: -82.4px; bottom: -129.4px; width: 305.9px; height: 305.9px; border-radius: 999px; border: 1px solid {{card.ring}}; pointer-events: none"></span>
<span style="position: absolute; right: -35.3px; bottom: -82.4px; width: 211.8px; height: 211.8px; border-radius: 999px; border: 1px solid {{card.ring}}; pointer-events: none"></span>
<span style="position: relative; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px">
<span style="font-size: 15.3px; font-weight: 600; letter-spacing: 0.01em; line-height: 1.25">{{card.name}}</span>
<span style="{{card.pillStyle}}">{{card.owner}}</span>
</span>
<span style="position: relative; display: flex; align-items: center; gap: 11.8px">
<span style="width: 40.0px; height: 30.6px; border-radius: 7.1px; background: linear-gradient(135deg, #E9D8A6 0%, #C9A961 50%, #E3CD8C 100%); box-shadow: inset 0 0 0 1px rgba(120, 90, 30, 0.25); position: relative; display: block">
<span style="position: absolute; left: 30%; top: 0; bottom: 0; width: 1px; background: rgba(120, 90, 30, 0.35)"></span><span style="position: absolute; right: 30%; top: 0; bottom: 0; width: 1px; background: rgba(120, 90, 30, 0.35)"></span><span style="position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(120, 90, 30, 0.35)"></span>
</span>
<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="opacity: 0.7"><path d="M8.5 7.5a6 6 0 0 1 0 9M12 5a9.5 9.5 0 0 1 0 14M15.5 3a13 13 0 0 1 0 18"></path></svg>
<span style="margin-left: auto; font-size: 14.1px; letter-spacing: 0.14em; opacity: 0.85; font-variant-numeric: tabular-nums">•••• {{card.last4}}</span>
</span>
<span style="position: relative; display: flex; flex-direction: column; gap: 9.4px">
<span style="display: flex; justify-content: space-between; align-items: flex-end">
<span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 11.8px; opacity: 0.7; letter-spacing: 0.04em">Current balance</span><span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 25.9px; font-weight: 700; letter-spacing: -0.01em; font-variant-numeric: tabular-nums">{{card.balance}}</span></span>
<span style="font-size: 12.9px; font-weight: 600; letter-spacing: 0.04em; opacity: 0.8">{{card.network}}</span>
</span>
<span style="display: flex; align-items: center; gap: 8px; font-size: 12.4px; font-variant-numeric: tabular-nums">
<span style="flex-grow: 1; height: 4.7px; border-radius: 999px; background: {{card.track}}; position: relative; display: block"><span style="{{card.fillStyle}}"></span></span>
<span style="opacity: 0.85; white-space: nowrap">{{card.utilText}} of {{card.limitText}}</span>
</span>
</span>
</button>

<div role="tablist" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid #ECEBF0">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button role="tab" onClick="{{t.pick}}" aria-selected="{{t.selected}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>

<sc-if value="{{isOverview}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 4px 16px"><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 16px">
<sc-for list="{{metrics}}" as="k" hint-placeholder-count="8">
<div style="{{k.style}}"><span style="font-size: 12px; color: #6B6B76">{{k.label}}</span><span style="{{k.valStyle}}">{{k.value}}</span></div>
</sc-for>
</div></div>
<div style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 14px; font-weight: 600">Current vs statement</span>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; height: 12px; gap: 2px">
<div style="{{cvs.stmtStyle}}"></div>
<div style="{{cvs.newStyle}}"></div>
</div>
<div style="display: flex; justify-content: space-between; font-size: 12px; font-variant-numeric: tabular-nums">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="display: flex; align-items: center; gap: 6px; color: #6B6B76"><span style="width: 8px; height: 8px; border-radius: 2px; background: #5134C9"></span>Statement balance</span><b style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 17px; font-weight: 700">{{cvs.statement}}</b></span>
<span style="display: flex; flex-direction: column; gap: 2px; text-align: right"><span style="display: flex; align-items: center; justify-content: flex-end; gap: 6px; color: #6B6B76"><span style="width: 8px; height: 8px; border-radius: 2px; background: #CFC6F2"></span>Current balance</span><b style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 17px; font-weight: 700">{{cvs.current}}</b></span>
</div>
</div>
<span style="font-size: 12px; color: #6B6B76; font-variant-numeric: tabular-nums">{{cvs.newer}} in newer transactions since the statement closed.</span>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #E6F4EC; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1A6B46" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">Next payment · Oct 12</span><span style="font-size: 12px; color: #6B6B76">Autopay will pay the statement balance</span></span>
<span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums">CA$980</span>
</div>
</div>
</sc-if>

<sc-if value="{{isTransactions}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 14px">
<label style="height: 44px; padding: 0 14px; border: 1px solid #E4E2EA; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; gap: 10px">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8A8896" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search transactions</span>
<input type="search" placeholder="Search transactions" style="flex-grow: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 14px">
</label>
<div class="kipu-noscroll" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 0 20px">
<button style="flex-shrink: 0; height: 34px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #E4E2EA; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 4px">September<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6B6B76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></button>
<button style="flex-shrink: 0; height: 34px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #E4E2EA; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 4px">All categories<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6B6B76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></button>
<button style="flex-shrink: 0; height: 34px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #E4E2EA; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 4px">Juan<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6B6B76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></button>
</div>
<div style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 13px; color: #6B6B76">September on this card</span><span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums">CA$914.38</span></div>
<div style="display: flex; height: 10px; gap: 2px"><span style="width: 58.5%; background: #5134C9; border-radius: 999px 3px 3px 999px"></span><span style="width: 15%; background: #8C78E0; border-radius: 3px"></span><span style="width: 15.8%; background: #B7A9EC; border-radius: 3px"></span><span style="flex-grow: 1; background: #DDD6F6; border-radius: 3px 999px 999px 3px"></span></div>
<div style="display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: #6B6B76">
<span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 2px; background: #5134C9"></span>Groceries 59%</span>
<span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 2px; background: #8C78E0"></span>Gas 15%</span>
<span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 2px; background: #B7A9EC"></span>Dining 16%</span>
<span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 2px; background: #DDD6F6"></span>Other 10%</span>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button style="height: 44px; border-radius: 14px; border: 1px solid #E4E2EA; background: #FFFFFF; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5134C9" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Add manually</button>
<button style="height: 44px; border-radius: 14px; border: 1px solid #E4E2EA; background: #FFFFFF; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5134C9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M9 10h6M9 14h4"></path></svg>Scan receipt</button>
</div>
<div style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 2px 16px">
<sc-for list="{{allTx}}" as="t" hint-placeholder-count="8">
<button onClick="{{t.pick}}" aria-label="{{t.aria}}" style="{{t.rowStyle}}">
<span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: #F5F4F8; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#2A2540" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.icon}}"></path></svg></span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 600; color: #111114">{{t.merchant}}</span><span style="font-size: 12px; color: #6B6B76">{{t.cat}} · {{t.date}}</span></span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 3px"><span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">{{t.amount}}</span><sc-if value="{{t.hasFx}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; color: #6B6B76; font-variant-numeric: tabular-nums">{{t.fx}}</span></sc-if></span>
</button>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{isStatements}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{statements}}" as="m" hint-placeholder-count="3">
<div style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: flex-start">
<span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 600">{{m.month}}</span><span style="font-size: 12px; color: #6B6B76">Due {{m.due}}</span></span>
<span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums">{{m.balance}}</span>
</div>
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="{{m.statusStyle}}">{{m.status}}</span>
<span style="{{m.fileStyle}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{m.fileIcon}}"></path></svg>{{m.file}}</span>
</div>
</div>
</sc-for>
<button onClick="{{openUpload}}" style="height: 48px; border-radius: 14px; border: 1px dashed #CFC6F2; background: #FBFAFE; color: #5134C9; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5134C9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V5M7.5 9.5 12 5l4.5 4.5M5 19h14"></path></svg>Upload statement</button>
</div>
</sc-if>

<sc-if value="{{isRewards}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #F4F1FD; border-radius: 14px; font-size: 13px; line-height: 18px; color: #2B1F66"><span style="flex-shrink: 0; padding: 2px 8px; border-radius: 999px; background: #FFFFFF; font-size: 11px; font-weight: 600; color: #5134C9">Coming later</span>Rewards tracking is optional. Add what you know.</div>
<div style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 2px 16px">
<sc-for list="{{rewards}}" as="r" hint-placeholder-count="5">
<div style="{{r.style}}"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">{{r.label}}</span><span style="font-size: 12px; color: #8A8896">Not set</span></span><button style="height: 32px; padding: 0 12px; border-radius: 999px; background: #F5F4F8; font-size: 12px; font-weight: 600; color: #3A3A42">Add</button></div>
</sc-for>
</div>
</div>
</sc-if>

</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: linear-gradient(180deg, rgba(250, 250, 248, 0) 0%, #FAFAF8 55%); pointer-events: none"></div>
<nav aria-label="Primary" style="position: absolute; left: 16px; right: 16px; bottom: 28px; height: 68px; background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 24px; box-shadow: 0 10px 30px rgba(24, 16, 64, 0.08); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #6B6B76; padding-bottom: 6px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6B76" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"></path></svg><span style="font-size: 11px; font-weight: 500">Home</span></a>
<a href="Money.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #111114"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111114" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V5.5A1.5 1.5 0 0 0 17.5 4h-12A2.5 2.5 0 0 0 3 6.5v11A2.5 2.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V9a1.5 1.5 0 0 0-1.5-1.5H5.5"></path><circle cx="16.5" cy="13.75" r="1" fill="#111114"></circle></svg><span style="font-size: 11px; font-weight: 600">Money</span><span style="width: 16px; height: 3px; border-radius: 999px; background: #5134C9"></span></a>
<div style="display: flex; justify-content: center"><a href="QuickAdd.dc.html" aria-label="Add" style="width: 58px; height: 58px; margin-top: -30px; border-radius: 999px; background: #5134C9; border: 4px solid #FAFAF8; box-sizing: content-box; box-shadow: 0 10px 24px rgba(81, 52, 201, 0.35); display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></a></div>
<a href="Plan.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #6B6B76; padding-bottom: 6px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6B76" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 12h10M4 19h6M15.5 17l2 2 3.5-4"></path></svg><span style="font-size: 11px; font-weight: 500">Plan</span></a>
<a href="Stats.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #6B6B76; padding-bottom: 6px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6B76" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V12M11 20V5M17 20v-9M3 20.5h18"></path></svg><span style="font-size: 11px; font-weight: 500">Stats</span></a>
</nav>

<sc-if value="{{sheetUpload}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; z-index: 40; background: rgba(17, 17, 20, 0.34)">
<button onClick="{{closeSheet}}" aria-label="Close" style="position: absolute; inset: 0; width: 100%; height: 100%"></button>
<div role="dialog" aria-modal="true" aria-label="Upload statement" style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 780px; overflow-y: auto; background: #FFFFFF; border-radius: 28px 28px 0 0; box-shadow: 0 -12px 40px rgba(24, 16, 64, 0.14); padding: 10px 20px 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: center"><span style="width: 36px; height: 5px; border-radius: 999px; background: #DCDAE3"></span></div>
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -0.02em">Upload statement</span><span style="font-size: 13px; color: #6B6B76">Kipu reads the statement for you.</span></span>
