<div style="display: flex; padding: 3px; gap: 2px; background: #F1F0F4; border-radius: 999px"><sc-for list="{{years}}" as="o" hint-placeholder-count="3"><button onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="{{o.style}}">{{o.label}}</button></sc-for></div>

<p style="margin: 0; font-size: 15px; line-height: 22px; color: #55555F">Your financial year, clearly understood.</p>

<div style="display: flex; gap: 8px; align-items: center">

</div>
<section style="border-radius: 26px; padding: 20px; background: linear-gradient(160deg, #2B1F66 0%, #3F2A9E 100%); color: #FFFFFF; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 14px 34px rgba(43, 31, 102, 0.22)">

<div style="display: flex; flex-direction: column; gap: 10px">

</section>

<span role="cell" style="display: flex; align-items: center; justify-content: flex-end; gap: 6px"><span style="width: 28px; height: 4px; background: #F1F0F4; border-radius: 999px"><span style="display: block; width: 75%; height: 100%; background: #2E9B69; border-radius: 999px"></span></span>1,040</span></div><div role="row" style="display: grid; grid-template-columns: 38px repeat(3, minmax(0, 1fr)); gap: 6px; align-items: center; padding: 9px 0; border-top: 1px solid #F3F2F6; font-size: 13px; font-variant-numeric: tabular-nums">
