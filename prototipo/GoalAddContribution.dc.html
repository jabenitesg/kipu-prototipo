<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Goal detail, add contribution</title>
<script src="./support.js"></script>
</head>
<body>
<template id="x-dc">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAFAF8;font-family:Inter,system-ui,sans-serif;color:#111114;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
input{font:inherit;color:#111114}
input::placeholder{color:#A09EAB}
a{color:#5134C9;text-decoration:none}a:hover{color:#3E24A8}
.kipu-noscroll{scrollbar-width:none}.kipu-noscroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 393px; height: 852px; position: relative; overflow: hidden; background: #FAFAF8; font-family: Inter, system-ui, sans-serif; color: #111114">

<div style="height: 100%; overflow-y: auto; box-sizing: border-box; padding: 58px 20px 132px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; align-items: center; justify-content: space-between; height: 40px">
<a href="Goals.dc.html" aria-label="Back to Goals" style="width: 40px; height: 40px; margin-left: -8px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2A2540" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
<div style="position: relative">
<button onClick="{{toggleMenu}}" aria-label="Goal actions" aria-haspopup="menu" aria-expanded="{{menuAttr}}" style="width: 40px; height: 40px; border-radius: 999px; background: #F5F4F8; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="#2A2540"><circle cx="5.5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="18.5" cy="12" r="1.6"></circle></svg></button>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
<div role="menu" style="position: absolute; top: 46px; right: 0; z-index: 30; width: 190px; padding: 6px; background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 16px; box-shadow: 0 14px 34px rgba(24, 16, 64, 0.14); display: flex; flex-direction: column">
<button role="menuitem" onClick="{{openEdit}}" style="height: 42px; padding: 0 10px; border-radius: 10px; display: flex; align-items: center; gap: 10px; font-size: 14px; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2A2540" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>Edit goal</button>
<button role="menuitem" onClick="{{closeMenu}}" style="height: 42px; padding: 0 10px; border-radius: 10px; display: flex; align-items: center; gap: 10px; font-size: 14px; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2A2540" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5v14M15 5v14"></path></svg>Pause goal</button>
<button role="menuitem" onClick="{{closeMenu}}" style="height: 42px; padding: 0 10px; border-radius: 10px; display: flex; align-items: center; gap: 10px; font-size: 14px; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2A2540" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 4.5h17v4h-17zM5 8.5v11h14v-11M10 12.5h4"></path></svg>Archive goal</button>
<div style="height: 1px; background: #F1F0F4; margin: 4px 6px"></div>
<button role="menuitem" onClick="{{askDelete}}" style="height: 40px; padding: 0 10px; border-radius: 10px; display: flex; align-items: center; gap: 10px; font-size: 13px; text-align: left; color: #A3325A"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#A3325A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"></path></svg>Delete goal</button>
</div>
</sc-if>
</div>
</div>

<header style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: #6B6B76">GOAL</span>
<h1 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -0.02em">{{g.name}}</h1>
<p style="margin: 0; font-size: 15px; color: #55555F">{{g.sub}}</p>
</header>

<sc-if value="{{isActive}}" hint-placeholder-val="{{true}}">
<section style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; border-radius: 24px; overflow: hidden">
<div style="padding: 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: flex-end; font-variant-numeric: tabular-nums">
<span style="display: flex; align-items: baseline; gap: 6px"><span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 36px; line-height: 40px; font-weight: 700; letter-spacing: -0.02em">{{g.saved}}</span><span style="font-size: 14px; color: #6B6B76">of {{g.target}}</span></span>
<span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 20px; font-weight: 700; color: #1A6B46">{{g.pct}}</span>
</div>
<sc-if value="{{g.isForeign}}" hint-placeholder-val="{{false}}"><span style="margin-top: -8px; font-size: 12px; color: #6B6B76; font-variant-numeric: tabular-nums">{{g.baseEq}}</span></sc-if>
<div style="position: relative; height: 14px; background: #F1F0F4; border-radius: 999px"><div style="{{g.fill}}"></div><span style="position: absolute; left: 25%; top: 3px; bottom: 3px; width: 2px; background: rgba(255,255,255,0.8)"></span><span style="position: absolute; left: 50%; top: 3px; bottom: 3px; width: 2px; background: rgba(255,255,255,0.8)"></span><span style="position: absolute; left: 75%; top: 3px; bottom: 3px; width: 2px; background: rgba(255,255,255,0.8)"></span></div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px; padding: 16px 20px; border-top: 1px solid #F1F0F4">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76; display: flex; align-items: center; gap: 5px">Remaining</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">{{g.remaining}}</b></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76; display: flex; align-items: center; gap: 5px">Monthly contribution</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">{{g.monthlyText}}</b></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76; display: flex; align-items: center; gap: 5px">Target date</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">{{g.targetDate}}</b></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76; display: flex; align-items: center; gap: 5px">Projected completion<span style="padding: 0 5px; border: 1px dashed #9DB6E3; border-radius: 999px; font-size: 9px; font-weight: 700; letter-spacing: 0.04em; color: #2D5DB0">EST.</span></span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">{{g.projected}}</b></span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-top: 1px solid #F1F0F4; background: #FBFAFD"><span style="font-size: 13px; color: #55555F">Status</span><span style="{{g.statusStyle}}">{{g.status}}</span></div>
</section>
<button onClick="{{openContrib}}" style="height: 52px; border-radius: 16px; background: #5134C9; color: #FFFFFF; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 8px 20px rgba(81, 52, 201, 0.25)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>Add contribution</button>
</sc-if>

<sc-if value="{{isDone}}" hint-placeholder-val="{{false}}">
<section style="border-radius: 24px; padding: 22px 20px; background: #EEF7F2; display: flex; flex-direction: column; gap: 14px">
<span style="display: flex; align-items: center; gap: 10px"><span style="width: 36px; height: 36px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A6B46" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></span><span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 20px; font-weight: 700; color: #1F3B2D">Goal reached</span></span>
<span style="display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums"><span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 34px; font-weight: 700; color: #111114">{{g.target}}</span><span style="font-size: 14px; color: #3F6B55">of {{g.target}}</span></span>
<div style="height: 10px; background: #2E9B69; border-radius: 999px"></div>
<span style="font-size: 13px; color: #3F6B55">Completed {{g.completedOn}}</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button style="height: 42px; border-radius: 12px; background: #FFFFFF; font-size: 13px; font-weight: 600">Keep saving</button>
<button style="height: 42px; border-radius: 12px; background: #FFFFFF; font-size: 13px; font-weight: 600">Increase target</button>
<button style="height: 42px; border-radius: 12px; background: #FFFFFF; font-size: 13px; font-weight: 600">Archive goal</button>
<button style="height: 42px; border-radius: 12px; background: #FFFFFF; font-size: 13px; font-weight: 600">Transfer funds</button>
</div>
</section>
</sc-if>

<sc-if value="{{g.hasTrip}}" hint-placeholder-val="{{false}}">
<section style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 700">Trip fund</h2><a href="TxTrip.dc.html" style="font-size: 12px; font-weight: 600; color: #5134C9">Peru 2026 trip ›</a></div>
<span style="font-size: 12px; color: #6B6B76">Trip started Sep 10. Savings and trip spending are kept separate.</span>
<div style="display: flex; height: 10px; gap: 2px"><span style="{{g.tripSpent}}"></span><span style="flex-grow: 1; background: #2E9B69; border-radius: 3px 999px 999px 3px"></span></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76; display: flex; align-items: center; gap: 5px">Saved before trip</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">{{g.tripBefore}}</b></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76; display: flex; align-items: center; gap: 5px">Spent so far</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">{{g.tripSpentText}}</b></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76; display: flex; align-items: center; gap: 5px">Left in fund</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">{{g.tripLeft}}</b></span></div>
</section>
</sc-if>

<sc-if value="{{g.hasSplit}}" hint-placeholder-val="{{false}}">
<section style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center"><h2 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 700">Shared goal</h2><span style="padding: 2px 8px; border-radius: 999px; background: #F4F1FD; color: #5134C9; font-size: 11px; font-weight: 600">{{g.owner}}</span></div>
<div style="display: flex; height: 10px; gap: 2px"><sc-for list="{{g.split}}" as="p" hint-placeholder-count="2"><span style="{{p.bar}}"></span></sc-for></div>
<div style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-variant-numeric: tabular-nums"><sc-for list="{{g.split}}" as="p" hint-placeholder-count="2"><div style="display: flex; justify-content: space-between"><span style="display: flex; align-items: center; gap: 8px; color: #3A3A42"><span style="{{p.dot}}"></span>{{p.name}}</span><span style="color: #55555F"><b style="color: #111114; font-weight: 600">{{p.amount}}</b> contributed</span></div></sc-for></div>
</section>
</sc-if>
<sc-if value="{{g.single}}" hint-placeholder-val="{{false}}"><div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-radius: 16px; background: #F6F5F8; font-size: 13px"><span style="color: #55555F">Owner</span><b style="font-weight: 600">{{g.owner}}</b></div></sc-if>

<sc-if value="{{isActive}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 22px">
<section style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 700">This month</h2><span style="font-size: 12px; color: #6B6B76">September</span></div>
<div style="height: 10px; background: #F1F0F4; border-radius: 999px; position: relative"><div style="{{g.monthFill}}"></div></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76; display: flex; align-items: center; gap: 5px">Planned</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">{{g.mPlanned}}</b></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76; display: flex; align-items: center; gap: 5px">Contributed</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">{{g.mDone}}</b></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76; display: flex; align-items: center; gap: 5px">Remaining</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">{{g.mLeft}}</b></span></div>
<span style="{{g.monthNoteStyle}}">{{g.monthNote}}</span>
</section>

<section style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center"><h2 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 700">Projection</h2><span style="padding: 2px 7px; border: 1px dashed #9DB6E3; border-radius: 999px; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; color: #2D5DB0">ESTIMATE</span></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76; display: flex; align-items: center; gap: 5px">Current monthly</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">{{g.monthlyText}}</b></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76; display: flex; align-items: center; gap: 5px">Projected completion</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">{{g.projected}}</b></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76; display: flex; align-items: center; gap: 5px">Time remaining</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">{{g.timeLeft}}</b></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76; display: flex; align-items: center; gap: 5px">Needed for target date</span><b style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">{{g.required}}</b></span>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 12px; background: #F6F5F8; font-size: 13px; font-variant-numeric: tabular-nums"><span style="color: #55555F">Difference</span><b style="font-weight: 700">{{g.diff}}</b></div>
<span style="font-size: 13px; line-height: 19px; color: #3A3A42">{{g.paceNote}}</span>
</section>
</div>
</sc-if>

<section style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 3px"><h2 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 700">Progress over time</h2><span style="font-size: 12px; color: #6B6B76">Is this goal growing at the pace you expected?</span></div>
<div style="position: relative; width: 321px; height: 160px">
<svg width="321" height="160" viewBox="0 0 321 160" style="position: absolute; left: 0; top: 0; overflow: visible">
<path d="M0 16H321" stroke="#BFE3CF" stroke-width="1.2" stroke-dasharray="3 4"></path>
<path d="M0 140H321" stroke="#EEEDF2" stroke-width="1"></path>
<path d="{{ch.area}}" fill="#5134C9" fill-opacity="0.07"></path>
<path d="{{ch.line}}" fill="none" stroke="#5134C9" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"></path>
<path d="{{ch.proj}}" fill="none" stroke="#8A8896" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"></path>
</svg>
<span style="position: absolute; right: 0; top: 0; font-size: 10px; font-weight: 600; color: #1A6B46; font-variant-numeric: tabular-nums">Target {{g.target}}</span>
<sc-for list="{{ch.dots}}" as="d" hint-placeholder-count="5"><span style="{{d.dot}}"></span><span style="{{d.lab}}">{{d.v}}</span></sc-for>
<sc-for list="{{ch.months}}" as="m" hint-placeholder-count="6"><span style="{{m.style}}">{{m.t}}</span></sc-for>
</div>
<div style="display: flex; gap: 14px; font-size: 11px; color: #6B6B76; margin-top: 6px"><span style="display: flex; align-items: center; gap: 5px"><span style="width: 14px; height: 2.5px; background: #5134C9; border-radius: 2px"></span>Saved</span><span style="display: flex; align-items: center; gap: 5px"><span style="width: 14px; border-top: 2px dashed #8A8896"></span>Projected</span></div>
</section>

<section style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 700">Milestones</h2>
<div style="position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
<span style="position: absolute; left: 12.5%; right: 12.5%; top: 7px; height: 2px; background: #ECEAF1"></span>
<sc-for list="{{g.milestones}}" as="m" hint-placeholder-count="4"><span style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center"><span style="{{m.dot}}"></span><b style="font-size: 13px; font-weight: 700">{{m.p}}</b><span style="{{m.textStyle}}">{{m.t}}</span></span></sc-for>
</div>
</section>

<sc-if value="{{isActive}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 22px">
<section style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center"><h2 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 700">What if you save more?</h2><span style="padding: 2px 7px; border: 1px dashed #9DB6E3; border-radius: 999px; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; color: #2D5DB0">SIMULATION</span></div>
<div class="kipu-noscroll" style="overflow-x: auto; margin: 0 -16px; padding: 0 16px"><div role="group" aria-label="Monthly change" style="display: flex; gap: 6px; width: max-content"><sc-for list="{{scen}}" as="o" hint-placeholder-count="5"><button onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="{{o.style}}">{{o.label}}</button></sc-for></div></div>
<sc-if value="{{sim.isCustom}}" hint-placeholder-val="{{false}}"><label style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border-radius: 12px; box-shadow: inset 0 0 0 1.5px #5134C9; font-size: 14px"><span style="color: #6B6B76">New monthly</span><input type="text" inputmode="decimal" value="{{sim.newMonthly}}" readonly aria-label="Custom monthly contribution" style="flex-grow: 1; min-width: 0; border: 0; outline: none; font-weight: 700; font-size: 15px; background: transparent; text-align: right"></label></sc-if>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; font-size: 11px; font-variant-numeric: tabular-nums">
<span style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 12px; background: #F6F5F8"><span style="color: #6B6B76">Current</span><b style="font-size: 14px; font-weight: 700">{{g.monthlyText}}/mo · {{g.projected}}</b></span>
<span style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 12px; background: #F4F1FD"><span style="color: #55506E">New</span><b style="font-size: 14px; font-weight: 700; color: #2B1F66">{{sim.newMonthly}}/mo · {{sim.newDate}}</b></span>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 12px; {{sim.deltaBox}}; font-size: 13px"><span>{{sim.deltaLabel}}</span><b style="font-weight: 700">{{sim.delta}}</b></div>
<button onClick="{{openApply}}" style="height: 44px; border-radius: 14px; border: 1px solid #E4E2EA; font-size: 13px; font-weight: 600; color: #5134C9">Apply this contribution</button>
</section>
