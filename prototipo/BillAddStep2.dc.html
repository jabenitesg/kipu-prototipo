<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Add recurring expense, step 2</title>
<script src="./support.js"></script>
</head>
<body>
<template id="x-dc">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAFAF8;font-family:Inter,system-ui,sans-serif;color:#111114;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
input{font:inherit;color:#111114}
input::placeholder{color:#A09EAB}
a{color:#5134C9;text-decoration:none}a:hover{color:#3E24A8}
.kipu-noscroll{scrollbar-width:none}.kipu-noscroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 393px; height: 852px; position: relative; overflow: hidden; background: #FAFAF8; font-family: Inter, system-ui, sans-serif; color: #111114">

<div style="height: 100%; overflow-y: auto; box-sizing: border-box; padding: 62px 20px 132px; display: flex; flex-direction: column; gap: 22px">
<header style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between; height: 40px">
<div style="display: flex; align-items: center; gap: 10px"><a href="Plan.dc.html" aria-label="Back to Plan" style="width: 32px; height: 32px; margin-left: -6px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2A2540" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a><span style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: #6B6B76">UPCOMING MONEY</span></div>
<button onClick="{{openAdd}}" aria-label="Add recurring expense" style="width: 40px; height: 40px; border-radius: 999px; background: #5134C9; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<h1 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -0.02em">Bills &amp; recurring</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: #55555F">See what’s coming before it hits your accounts.</p>
<div class="kipu-noscroll" role="navigation" aria-label="Sections" style="display: flex; gap: 6px; overflow-x: auto; margin: 2px -20px 0; padding: 0 20px"><a href="Plan.dc.html" style="flex-shrink: 0; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; display: flex; align-items: center; background: #F1F0F4; color: #3A3A42; font-weight: 500">Overview</a><a href="Budget.dc.html" style="flex-shrink: 0; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; display: flex; align-items: center; background: #F1F0F4; color: #3A3A42; font-weight: 500">Budget</a><a href="Bills.dc.html" aria-current="page" style="flex-shrink: 0; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; display: flex; align-items: center; background: #111114; color: #FFFFFF; font-weight: 600">Bills &amp; recurring</a><a href="Goals.dc.html" style="flex-shrink: 0; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; display: flex; align-items: center; background: #F1F0F4; color: #3A3A42; font-weight: 500">Goals</a><a href="Trips.dc.html" style="flex-shrink: 0; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; display: flex; align-items: center; background: #F1F0F4; color: #3A3A42; font-weight: 500">Trips</a></div>
<div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px">
<div role="group" aria-label="Owner" style="display: flex; gap: 6px"><sc-for list="{{owners}}" as="o" hint-placeholder-count="3"><button onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="{{o.style}}">{{o.label}}</button></sc-for></div>
<div style="position: relative"><button onClick="{{toggleCur}}" aria-haspopup="listbox" aria-expanded="{{curAttr}}" aria-label="Currency" style="height: 36px; padding: 0 10px 0 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E9E7EF; display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600">{{currency}}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B6B76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></button>
<sc-if value="{{curOpen}}" hint-placeholder-val="{{false}}"><div role="listbox" style="position: absolute; top: 42px; right: 0; z-index: 25; width: 140px; padding: 5px; background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 14px; box-shadow: 0 12px 32px rgba(24, 16, 64, 0.12); display: flex; flex-direction: column; gap: 2px"><sc-for list="{{currencies}}" as="o" hint-placeholder-count="4"><button onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="{{o.style}}">{{o.label}}</button></sc-for></div></sc-if></div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between">
<div role="group" aria-label="Period" style="display: flex; padding: 3px; gap: 2px; background: #F1F0F4; border-radius: 12px"><sc-for list="{{periods}}" as="o" hint-placeholder-count="3"><button onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="{{o.style}}">{{o.label}}</button></sc-for></div>
<div role="group" aria-label="View" style="display: flex; padding: 3px; gap: 2px; background: #F1F0F4; border-radius: 12px"><sc-for list="{{views}}" as="o" hint-placeholder-count="2"><button onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="{{o.style}}">{{o.label}}</button></sc-for></div>
</div>
</header>

<sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
<div style="padding: 36px 22px; border-radius: 24px; background: #FFFFFF; border: 1px dashed #E4E2EA; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
<span style="width: 60px; height: 60px; border-radius: 20px; background: #F4F1FD; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5134C9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6.5h17v14h-17zM3.5 10.5h17M8 3.5v5M16 3.5v5M12 13.5v4M10 15.5h4"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 6px"><span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 22px; font-weight: 700">Know what’s coming</span><span style="font-size: 14px; line-height: 20px; color: #55555F">Add bills, subscriptions and recurring payments so Kipu can plan ahead.</span></span>
<button onClick="{{openAdd}}" style="width: 100%; height: 50px; border-radius: 16px; background: #5134C9; color: #FFFFFF; font-size: 15px; font-weight: 600; margin-top: 4px">Add recurring expense</button>
<button style="width: 100%; height: 46px; border-radius: 16px; background: #F5F4F8; font-size: 14px; font-weight: 600">Import from transactions</button>
</div>
</sc-if>

<sc-if value="{{hasItems}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 22px">

<section aria-label="Summary" style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); font-variant-numeric: tabular-nums">
<span style="padding: 14px 16px; border-right: 1px solid #F1F0F4; border-bottom: 1px solid #F1F0F4; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 11px; color: #6B6B76">Next 7 days</span><b style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 20px; font-weight: 700; color: #94580A">{{sum.d7}}</b></span>
<span style="padding: 14px 16px; border-bottom: 1px solid #F1F0F4; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 11px; color: #6B6B76">Next 30 days</span><b style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 20px; font-weight: 700">{{sum.d30}}</b></span>
<span style="padding: 14px 16px; border-right: 1px solid #F1F0F4; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 11px; color: #6B6B76">Recurring per month</span><b style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 20px; font-weight: 700">CA$3,557</b></span>
<span style="padding: 14px 16px; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 11px; color: #6B6B76">Autopay</span><b style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 20px; font-weight: 700">8 active</b></span>
</section>

<sc-if value="{{isList}}" hint-placeholder-val="{{true}}">
<section style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: space-between"><h2 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.01em">Coming up</h2><span style="font-size: 12px; color: #6B6B76">{{periodNote}}</span></div>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="{{g.labelStyle}}">{{g.label}}</span>
<div style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; border-radius: 18px; padding: 0 14px">
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="2">
<div style="{{r.wrap}}">
<button onClick="{{r.open}}" aria-label="{{r.aria}}" style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 0; text-align: left">
<span style="{{r.iconWrap}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{r.iconColor}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.icon}}"></path></svg></span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 15px; font-weight: 600; color: #111114; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
<span style="font-size: 12px; color: #6B6B76; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.meta}}</span>
<span style="font-size: 11px; color: #8A8896; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.src}}</span>
</span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0">
<span style="{{r.amountStyle}}">{{r.amount}}</span>
<span style="{{r.statusStyle}}">{{r.status}}</span>
</span>
</button>
<sc-if value="{{r.canPay}}" hint-placeholder-val="{{false}}"><button onClick="{{r.pay}}" style="margin: -4px 0 12px 52px; height: 32px; padding: 0 12px; border-radius: 999px; background: #F4F1FD; color: #5134C9; font-size: 12px; font-weight: 600">Mark as paid</button></sc-if>
</div>
</sc-for>
</div>
</div>
</sc-for>
</section>
</sc-if>

<sc-if value="{{isCalendar}}" hint-placeholder-val="{{false}}">
<section style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-size: 11px; font-weight: 600; color: #8A8896"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{cal}}" as="c" hint-placeholder-count="35">
<button onClick="{{c.pick}}" aria-label="{{c.aria}}" style="{{c.style}}"><span style="{{c.monStyle}}">{{c.mon}}</span><span>{{c.day}}</span><span style="display: flex; gap: 2px; height: 5px"><sc-for list="{{c.dots}}" as="d" hint-placeholder-count="1"><span style="{{d.style}}"></span></sc-for></span></button>
</sc-for>
</div>
<div style="display: flex; gap: 12px; font-size: 11px; color: #6B6B76"><span style="display: flex; align-items: center; gap: 5px"><span style="width: 6px; height: 6px; border-radius: 999px; background: #E0A33B"></span>Upcoming</span><span style="display: flex; align-items: center; gap: 5px"><span style="width: 6px; height: 6px; border-radius: 999px; background: #7FA0D8"></span>Expected</span><span style="display: flex; align-items: center; gap: 5px"><span style="width: 6px; height: 6px; border-radius: 999px; background: #D66A8E"></span>Overdue</span></div>
</section>
<section style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.1em; color: #6B6B76; padding: 0 2px">{{calLabel}}</span>
<div style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; border-radius: 18px; padding: 0 14px">
<sc-for list="{{calRows}}" as="r" hint-placeholder-count="2">
<div style="{{r.wrap}}">
<button onClick="{{r.open}}" aria-label="{{r.aria}}" style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 0; text-align: left">
<span style="{{r.iconWrap}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{r.iconColor}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.icon}}"></path></svg></span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 15px; font-weight: 600; color: #111114; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
<span style="font-size: 12px; color: #6B6B76; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.meta}}</span>
<span style="font-size: 11px; color: #8A8896; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.src}}</span>
</span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0">
<span style="{{r.amountStyle}}">{{r.amount}}</span>
<span style="{{r.statusStyle}}">{{r.status}}</span>
</span>
</button>
<sc-if value="{{r.canPay}}" hint-placeholder-val="{{false}}"><button onClick="{{r.pay}}" style="margin: -4px 0 12px 52px; height: 32px; padding: 0 12px; border-radius: 999px; background: #F4F1FD; color: #5134C9; font-size: 12px; font-weight: 600">Mark as paid</button></sc-if>
</div>
</sc-for>
<sc-if value="{{calNone}}" hint-placeholder-val="{{false}}"><span style="display: block; padding: 16px 0; font-size: 13px; color: #6B6B76">Nothing due on this day.</span></sc-if>
</div>
</section>
</sc-if>

<section style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 700">Cash impact</h2><span style="font-size: 12px; color: #6B6B76">Next 7 days</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><div style="display: flex; height: 12px; gap: 2px"><span style="width: 32.9%; background: #E0A33B; border-radius: 999px 3px 3px 999px"></span><span style="flex-grow: 1; background: #2E9B69; border-radius: 3px 999px 999px 3px"></span></div></div>
<div style="display: flex; flex-direction: column; font-size: 14px; font-variant-numeric: tabular-nums">
<div style="display: flex; justify-content: space-between; padding: 6px 0"><span style="color: #55555F">Available cash</span><b style="font-weight: 600">CA$4,100</b></div>
<div style="display: flex; justify-content: space-between; padding: 6px 0"><span style="display: flex; align-items: center; gap: 8px; color: #55555F"><span style="width: 8px; height: 8px; border-radius: 2px; background: #E0A33B"></span>Scheduled payments</span><b style="font-weight: 600">−CA$1,347</b></div>
<div style="display: flex; justify-content: space-between; padding: 10px 0 0; border-top: 1px solid #F1F0F4"><span style="display: flex; align-items: center; gap: 8px; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 2px; background: #2E9B69"></span>Remaining after payments</span><b style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 17px; font-weight: 700; color: #1A6B46">CA$2,753</b></div>
</div>
<a href="PlanSafeToSpend.dc.html" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px; border-radius: 14px; background: #F4F1FD; color: inherit"><span style="font-size: 12px; line-height: 17px; color: #2B1F66">These upcoming commitments are included in your Safe to Spend calculation.</span><span style="font-size: 12px; font-weight: 600; color: #5134C9; white-space: nowrap">See calculation →</span></a>
</section>

<sc-if value="{{showDetect}}" hint-placeholder-val="{{true}}">
<section style="padding: 16px; border-radius: 20px; background: #F6F5F8; display: flex; flex-direction: column; gap: 12px">
<span style="display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #5134C9"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#5134C9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2.5 20 5.5l-3 3M4 11.5v-2a4 4 0 0 1 4-4h12M7 21.5l-3-3 3-3M20 12.5v2a4 4 0 0 1-4 4H4"></path></svg>LOOKS RECURRING</span>
<span style="font-size: 14px; line-height: 20px; color: #111114">We noticed <b>Music streaming · CA$12.99</b> appears every month on your CIBC Visa.</span>
<div style="display: flex; gap: 8px"><button onClick="{{makeRecurring}}" style="height: 38px; padding: 0 14px; border-radius: 12px; background: #5134C9; color: #FFFFFF; font-size: 13px; font-weight: 600">Make recurring</button><button onClick="{{ignoreDetect}}" style="height: 38px; padding: 0 14px; border-radius: 12px; background: #FFFFFF; font-size: 13px; font-weight: 600; color: #3A3A42">Ignore</button></div>
</section>
</sc-if>
<sc-if value="{{detectDone}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; color: #1A6B46; display: flex; align-items: center; gap: 8px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1A6B46" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>{{detectMsg}}</span></sc-if>

<section style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: space-between"><h2 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.01em">Recently matched</h2><span style="font-size: 12px; color: #6B6B76">Expected vs actual</span></div>
<div style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 2px 16px">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #F1F0F4"><span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: #F5F4F8; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2A2540" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h4"></path></svg></span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 600">Electricity</span><span style="font-size: 12px; color: #6B6B76; font-variant-numeric: tabular-nums">Sep 20 · expected CA$100 · actual CA$112</span></span><span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px"><span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">CA$112.00</span><span style="padding: 1px 7px; border-radius: 999px; background: #FDF1DC; color: #94580A; font-size: 11px; font-weight: 600">Amount changed</span></span></div>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 0"><span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: #EAF1FC; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2D5DB0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2.5 20 5.5l-3 3M4 11.5v-2a4 4 0 0 1 4-4h12M7 21.5l-3-3 3-3M20 12.5v2a4 4 0 0 1-4 4H4"></path></svg></span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 600">Adobe</span><span style="font-size: 12px; color: #6B6B76">Sep 7 · matched to American Express</span></span><span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px"><span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">US$55.00</span><span style="padding: 1px 7px; border-radius: 999px; background: #E6F4EC; color: #1A6B46; font-size: 11px; font-weight: 600">Confirmed</span></span></div>
</div>
</section>

<section style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.01em">Recurring commitments</h2><span style="font-size: 12px; color: #6B6B76">Per month</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><div style="display: flex; height: 12px; gap: 2px"><span style="width: 54%; background: #5134C9; border-radius: 999px 3px 3px 999px"></span><span style="flex-grow: 1; background: #ECEAF1; border-radius: 3px 999px 999px 3px"></span></div><span style="font-size: 12px; color: #3A3A42"><b style="font-weight: 700">54%</b> of expected household income.</span></div>
