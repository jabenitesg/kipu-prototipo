<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Statement partly read</title>
<script src="./support.js"></script>
</head>
<body>
<template id="x-dc">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAFAF8;font-family:Inter,system-ui,sans-serif;color:#111114;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
input{font:inherit;color:#111114}
input::placeholder{color:#A09EAB}
a{color:#5134C9;text-decoration:none}a:hover{color:#3E24A8}
.kipu-noscroll{scrollbar-width:none}.kipu-noscroll::-webkit-scrollbar{display:none}
@keyframes kipu-spin{to{transform:rotate(360deg)}}
@keyframes kipu-in{0%{opacity:0;transform:translateY(4px)}100%{opacity:1;transform:none}}
@keyframes kipu-sweep{0%{top:6%}50%{top:88%}100%{top:6%}}
@keyframes kipu-pulse{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</helmet>
<div style="width: 393px; height: 852px; position: relative; overflow: hidden; background: #FAFAF8; font-family: Inter, system-ui, sans-serif; color: #111114">

<div style="position: absolute; inset: 0; display: flex; flex-direction: column">
<div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 58px 20px 22px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; justify-content: space-between; height: 40px"><a href="StmtUpload.dc.html" aria-label="Close" style="width: 40px; height: 40px; border-radius: 999px; background: #F5F4F8; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2A2540" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></a><span style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: #8A8896"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8A8896" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v5c0 4.5 3 8.3 7 10 4-1.7 7-5.5 7-10V6z"></path></svg>Securely processed and stored</span></div>
<sc-if value="{{isFull}}" hint-placeholder-val="{{true}}"><div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: #6B6B76">STATEMENT FOUND</span>
<h1 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 28px; line-height: 32px; font-weight: 700; letter-spacing: -0.02em">Review statement</h1>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #55555F">Check the details before importing.</p>
</div></sc-if>
<sc-if value="{{isPartial}}" hint-placeholder-val="{{false}}"><div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: #6B6B76">STATEMENT FOUND</span>
<h1 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 28px; line-height: 32px; font-weight: 700; letter-spacing: -0.02em">Some details found</h1>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #55555F">Save what Kipu found now. You can add transactions later.</p>
</div></sc-if>

<div style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 18px; background: #F6F5F8">
<span style="width: 48px; height: 32px; flex-shrink: 0; border-radius: 6px; background: linear-gradient(135deg, #3A3552, #111018); box-shadow: 0 2px 6px rgba(24, 16, 64, 0.2)"></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">CIBC Costco Mastercard</span><span style="font-size: 12px; color: #6B6B76">•••• 4821 · Juan · transactions default to Juan</span></span>
<span style="padding: 3px 8px; border-radius: 999px; background: #E6F4EC; color: #1A6B46; font-size: 11px; font-weight: 600">Detected</span>
</div>

<section style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 4px 16px">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #F1F0F4; font-size: 14px"><span style="color: #55555F">Statement period</span><span style="font-weight: 600; font-variant-numeric: tabular-nums">Aug 20 – Sep 19</span></div>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #F1F0F4"><span style="font-size: 14px; color: #55555F">Statement balance</span><span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums">CA$1,284.62</span></div>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #F1F0F4; font-size: 14px"><span style="color: #55555F">Minimum payment</span><span style="font-weight: 600; font-variant-numeric: tabular-nums">CA$30.00</span></div>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #F1F0F4; font-size: 14px"><span style="color: #55555F">Payment due</span><span style="font-weight: 600; font-variant-numeric: tabular-nums; color: #94580A">Oct 12</span></div>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #F1F0F4; font-size: 14px"><span style="color: #55555F">Currency</span><span style="font-weight: 600; font-variant-numeric: tabular-nums">CAD</span></div>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; font-size: 14px"><span style="color: #55555F">Transactions</span><span style="{{txCountStyle}}">{{txCount}}</span></div>
</section>

<sc-if value="{{isPartial}}" hint-placeholder-val="{{false}}">
<div style="display: flex; gap: 12px; padding: 14px; border-radius: 16px; background: #FDF6E8">
<span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#94580A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4.5M12 15.5h.01M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18z"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 14px; font-weight: 600; color: #4A3206">Transactions couldn’t be detected</span><span style="font-size: 13px; line-height: 18px; color: #6B5320">The balance, minimum payment and due date will still update your card.</span></span>
</div>
</sc-if>

<sc-if value="{{isFull}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 20px">

<section style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 17px; font-weight: 700">34 transactions found</span><span style="font-size: 12px; color: #6B6B76; font-variant-numeric: tabular-nums">CA$1,284.62 spent</span></div>
<div style="display: flex; height: 10px; gap: 2px"><span style="{{bar.newStyle}}"></span><span style="{{bar.dupStyle}}"></span><span style="{{bar.revStyle}}"></span></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; font-variant-numeric: tabular-nums">

<span style="display: flex; flex-direction: column; gap: 2px"><span style="display: flex; align-items: center; gap: 5px; font-size: 12px; color: #6B6B76"><span style="width: 7px; height: 7px; border-radius: 999px; background: #D9C08E"></span>Possible duplicates</span><b style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700">4</b></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="display: flex; align-items: center; gap: 5px; font-size: 12px; color: #6B6B76"><span style="width: 7px; height: 7px; border-radius: 999px; background: #E0A33B"></span>Needs review</span><b style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700">{{reviewCount}}</b></span>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: 18px; background: #F4F1FD">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 32px; height: 32px; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5134C9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13.5l18-7-7 18-2.5-8.5z"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 600; color: #2B1F66">Trip detected · Peru 2026</span><span style="font-size: 12px; color: #55506E">Sep 10 – Sep 24 · includes Restaurant Central, S/ 180</span></span>
</div>
<button onClick="{{toggleTrip}}" aria-pressed="{{tripPressed}}" style="{{tripBtn}}">{{tripLabel}}</button>
</section>

<section style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 17px; font-weight: 700">Transactions</span><span style="font-size: 12px; color: #6B6B76">Tap to edit</span></div>
<div style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 2px 16px">
<sc-for list="{{txs}}" as="t" hint-placeholder-count="6">
<button onClick="{{t.pick}}" aria-label="{{t.aria}}" style="{{t.rowStyle}}">
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.merchant}}</span><span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #6B6B76"><span>{{t.date}} · {{t.cat}}</span></span></span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0"><span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums">{{t.amount}}</span><span style="{{t.chipStyle}}">{{t.chip}}</span></span>
</button>
</sc-for>
</div>
<a href="Transactions.dc.html" style="align-self: center; padding: 6px 12px; font-size: 13px; font-weight: 600; color: #5134C9">View all 34 transactions</a>
</section>

<section style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 18px; background: #F6F5F8">
<div style="display: flex; align-items: center; gap: 12px">
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">Payment · Sep 2</span><span style="font-size: 12px; color: #6B6B76">From Chequing</span></span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px"><span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums">−CA$1,120.00</span><span style="padding: 1px 7px; border-radius: 999px; background: #EAF1FC; color: #2D5DB0; font-size: 11px; font-weight: 600">Card payment</span></span>
</div>
<span style="font-size: 12px; line-height: 17px; color: #55555F">Card payments are matched to the transfer from your bank account, so they never count as spending twice.</span>
</section>

<button onClick="{{openOpt}}" style="display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid #F1F0F4; border-bottom: 1px solid #F1F0F4; text-align: left">
<span style="width: 32px; height: 32px; border-radius: 10px; background: #F6F5F8; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2A2540" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8M16 9a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM10 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 600">Import options</span><span style="font-size: 12px; color: #6B6B76">{{optSummary}}</span></span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A09EAB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg>
</button>

</div>
</sc-if>
</div>

<div style="flex-shrink: 0; padding: 12px 20px 30px; background: #FFFFFF; border-top: 1px solid #F1F0F4; display: flex; flex-direction: column; gap: 8px">
<button onClick="{{doImport}}" style="height: 56px; border-radius: 18px; background: #5134C9; color: #FFFFFF; font-size: 16px; font-weight: 600; box-shadow: 0 8px 20px rgba(81, 52, 201, 0.3)">{{cta}}</button>
<span style="text-align: center; font-size: 12px; color: #6B6B76; font-variant-numeric: tabular-nums">{{ctaNote}}<sc-if value="{{hasReview}}" hint-placeholder-val="{{false}}"><span> · </span><button onClick="{{openCat}}" style="font-size: 12px; font-weight: 600; color: #94580A; text-decoration: underline">1 transaction needs review</button></sc-if></span>
</div>
</div>
<sc-if value="{{sheetDup}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; z-index: 50; background: rgba(17, 17, 20, 0.34)">
<button onClick="{{closeSheet}}" aria-label="Close" style="position: absolute; inset: 0; width: 100%; height: 100%"></button>
<div role="dialog" aria-modal="true" aria-label="Possible duplicate" style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 790px; overflow-y: auto; background: #FFFFFF; border-radius: 28px 28px 0 0; box-shadow: 0 -12px 40px rgba(24, 16, 64, 0.16); padding: 10px 20px 34px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: center"><span style="width: 36px; height: 5px; border-radius: 999px; background: #DCDAE3"></span></div><div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px"><span style="display: flex; flex-direction: column; gap: 3px"><span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 21px; line-height: 26px; font-weight: 700; letter-spacing: -0.01em">Possible duplicate</span><span style="font-size: 13px; color: #6B6B76">This looks like an expense you already added.</span></span><button onClick="{{closeSheet}}" aria-label="Close" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 999px; background: #F5F4F8; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2A2540" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<div style="padding: 12px; border-radius: 16px; background: #F6F5F8; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #6B6B76">ALREADY IN KIPU</span><span style="font-size: 14px; font-weight: 600">Costco</span><span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums">CA$320.47</span><span style="font-size: 12px; color: #6B6B76">Sep 18 · from receipt scan</span><span style="display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: #5134C9"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#5134C9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.5 12.6 21a5.5 5.5 0 0 1-7.8-7.8l8.5-8.5a3.7 3.7 0 0 1 5.2 5.2l-8.5 8.5a1.8 1.8 0 0 1-2.6-2.6l7.8-7.8"></path></svg>Receipt attached</span></div>
<div style="padding: 12px; border-radius: 16px; background: #F6F5F8; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #6B6B76">ON STATEMENT</span><span style="font-size: 14px; font-weight: 600">COSTCO WHOLESALE</span><span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums">CA$320.47</span><span style="font-size: 12px; color: #6B6B76">Sep 18 · •••• 4821</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 12px; font-weight: 600; color: #6B6B76">Why Kipu matched them</span><div style="display: flex; flex-wrap: wrap; gap: 6px"><span style="padding: 4px 9px; border-radius: 999px; background: #E6F4EC; color: #1A6B46; font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 4px"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#1A6B46" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>Merchant</span><span style="padding: 4px 9px; border-radius: 999px; background: #E6F4EC; color: #1A6B46; font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 4px"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#1A6B46" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>Amount</span><span style="padding: 4px 9px; border-radius: 999px; background: #E6F4EC; color: #1A6B46; font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 4px"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#1A6B46" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>Date</span><span style="padding: 4px 9px; border-radius: 999px; background: #E6F4EC; color: #1A6B46; font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 4px"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#1A6B46" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>Card</span><span style="padding: 4px 9px; border-radius: 999px; background: #E6F4EC; color: #1A6B46; font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 4px"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#1A6B46" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>Currency</span></div></div>
<div role="radiogroup" aria-label="What to do" style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{dupOpts}}" as="o" hint-placeholder-count="3">
<button role="radio" onClick="{{o.pick}}" aria-checked="{{o.pressed}}" style="{{o.style}}"><span style="{{o.radio}}"><span style="{{o.dot}}"></span></span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; text-align: left"><span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600">{{o.label}}<sc-if value="{{o.rec}}" hint-placeholder-val="{{false}}"><span style="padding: 1px 6px; border-radius: 999px; background: #F4F1FD; color: #5134C9; font-size: 10px; font-weight: 700">RECOMMENDED</span></sc-if></span><span style="font-size: 12px; line-height: 16px; color: #6B6B76">{{o.sub}}</span></span></button>
</sc-for>
</div>
<button onClick="{{closeSheet}}" style="height: 52px; border-radius: 16px; background: #5134C9; color: #FFFFFF; font-size: 15px; font-weight: 600">Confirm</button>
<span style="font-size: 11px; color: #8A8896; text-align: center">Nothing is deleted or overwritten until you confirm.</span>
</div>
</div>
</sc-if>
<sc-if value="{{sheetRec}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; z-index: 50; background: rgba(17, 17, 20, 0.34)">
<button onClick="{{closeSheet}}" aria-label="Close" style="position: absolute; inset: 0; width: 100%; height: 100%"></button>
<div role="dialog" aria-modal="true" aria-label="Final amount available" style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 790px; overflow-y: auto; background: #FFFFFF; border-radius: 28px 28px 0 0; box-shadow: 0 -12px 40px rgba(24, 16, 64, 0.16); padding: 10px 20px 34px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: center"><span style="width: 36px; height: 5px; border-radius: 999px; background: #DCDAE3"></span></div><div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px"><span style="display: flex; flex-direction: column; gap: 3px"><span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 21px; line-height: 26px; font-weight: 700; letter-spacing: -0.01em">Final amount available</span><span style="font-size: 13px; color: #6B6B76">Restaurant Lima · Sep 15</span></span><button onClick="{{closeSheet}}" aria-label="Close" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 999px; background: #F5F4F8; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2A2540" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 16px; border-radius: 18px; background: #F4F1FD">

    return {
      isFull: !partial, isPartial: partial,
      txCount: partial ? 'Could not detect' : '34', txCountStyle: partial ? 'font-weight: 600; color: #94580A;' : 'font-weight: 600;',
      bar, newCount, reviewCount, txs,
      trip: !!s.trip, tripPressed: s.trip ? 'true' : 'false', toggleTrip: () => this.setState({ trip: !s.trip }),
      tripLabel: s.trip ? '✓ 12 transactions added to Peru 2026 · Undo' : 'Add 12 transactions to Peru 2026',
      tripBtn: 'height: 42px; border-radius: 12px; font-size: 13px; font-weight: 600; ' + (s.trip ? 'background: transparent; color: #2B1F66; box-shadow: inset 0 0 0 1px #CFC6F2;' : 'background: #FFFFFF; color: #5134C9;'),
      openOpt: () => this.setState({ sheet: 'opt' }), optSummary: onCount === 6 ? 'Transactions, balance, due date and more · all on' : onCount + ' of 6 on',
      openCat: () => this.setState({ sheet: 'cat' }),
      cta: partial ? 'Save statement details' : 'Import ' + newCount + ' transactions',
      ctaNote: partial ? 'Try another file later to import transactions' : skipped + ' duplicates will be skipped',
      hasReview: !partial && reviewCount > 0,
      doImport: () => this.setState({ saved: true, sheet: null }),
      sheetDup: s.sheet === 'dup', sheetRec: s.sheet === 'rec', sheetCat: s.sheet === 'cat', sheetOpt: s.sheet === 'opt', sheetEdit: s.sheet === 'edit',
      closeSheet: () => this.setState({ sheet: null }), dupOpts, catOpts, opts, ed,
      reconcile: () => this.setState({ rec: true, sheet: null }),
      saved: !!s.saved, importedLine: partial ? 'Statement details saved.' : newCount + ' new transactions added.', doneItems
    };
  }
}
</script>
