<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan, add planned expense</title>
<script src="./support.js"></script>
</head>
<body>
<template id="x-dc">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAFAF8;font-family:Inter,system-ui,sans-serif;color:#111114;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
input{font:inherit;color:#111114}
input::placeholder{color:#A09EAB}
a{color:#5134C9;text-decoration:none}a:hover{color:#3E24A8}
.kipu-noscroll{scrollbar-width:none}.kipu-noscroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 393px; height: 852px; position: relative; overflow: hidden; background: #FAFAF8; font-family: Inter, system-ui, sans-serif; color: #111114">

<div style="height: 100%; overflow-y: auto; box-sizing: border-box; padding: 62px 20px 132px; display: flex; flex-direction: column; gap: 22px">
<header style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between; height: 40px">
<div style="display: flex; align-items: center; gap: 10px"><a href="Main.dc.html" aria-label="Back" style="width: 32px; height: 32px; margin-left: -6px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2A2540" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a><span style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: #6B6B76">MONEY PLAN</span></div>
<div style="position: relative"><button onClick="{{toggleMenu}}" aria-label="Edit plan" aria-haspopup="menu" aria-expanded="{{menuExpanded}}" style="width: 40px; height: 40px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E9E7EF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2A2540" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8M16 9a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM10 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"></path></svg></button><sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
<div role="menu" style="position: absolute; top: 46px; right: 0; z-index: 30; width: 244px; padding: 6px; background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 16px; box-shadow: 0 14px 34px rgba(24, 16, 64, 0.14); display: flex; flex-direction: column">
<sc-for list="{{menuItems}}" as="m" hint-placeholder-count="5"><button role="menuitem" onClick="{{m.pick}}" style="height: 42px; padding: 0 10px; border-radius: 10px; display: flex; align-items: center; gap: 10px; font-size: 14px; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2A2540" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{m.icon}}"></path></svg>{{m.label}}</button></sc-for>
</div>
</sc-if></div>
</div>
<h1 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -0.02em">Plan</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: #55555F">See what your money needs to cover.</p>
<div class="kipu-noscroll" role="navigation" aria-label="Sections" style="display: flex; gap: 6px; overflow-x: auto; margin: 2px -20px 0; padding: 0 20px"><a href="Plan.dc.html" aria-current="page" style="flex-shrink: 0; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; display: flex; align-items: center; background: #111114; color: #FFFFFF; font-weight: 600">Overview</a><a href="Budget.dc.html" style="flex-shrink: 0; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; display: flex; align-items: center; background: #F1F0F4; color: #3A3A42; font-weight: 500">Budget</a><a href="Bills.dc.html" style="flex-shrink: 0; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; display: flex; align-items: center; background: #F1F0F4; color: #3A3A42; font-weight: 500">Bills &amp; recurring</a><a href="Goals.dc.html" style="flex-shrink: 0; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; display: flex; align-items: center; background: #F1F0F4; color: #3A3A42; font-weight: 500">Goals</a><a href="Trips.dc.html" style="flex-shrink: 0; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; display: flex; align-items: center; background: #F1F0F4; color: #3A3A42; font-weight: 500">Trips</a></div>
<div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px">
<div role="group" aria-label="Owner" style="display: flex; gap: 6px"><sc-for list="{{owners}}" as="o" hint-placeholder-count="3"><button onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="{{o.style}}">{{o.label}}</button></sc-for></div>
<div style="display: flex; align-items: center; gap: 2px">
<button onClick="{{prevMonth}}" aria-label="Previous month" style="width: 30px; height: 36px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6B76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></button>
<span style="font-size: 13px; font-weight: 700; white-space: nowrap">{{monthLabel}}</span>
<button onClick="{{nextMonth}}" aria-label="Next month" style="width: 30px; height: 36px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6B76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></button>
</div>
</div>
</header>

<sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
<div style="padding: 36px 22px; border-radius: 24px; background: #FFFFFF; border: 1px dashed #E4E2EA; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
<span style="width: 60px; height: 60px; border-radius: 20px; background: #F4F1FD; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5134C9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6.5h17v14h-17zM3.5 10.5h17M8 3.5v5M16 3.5v5M8 14.5h3M8 17.5h6"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 6px"><span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 22px; font-weight: 700">Plan your month</span><span style="font-size: 14px; line-height: 20px; color: #55555F">Add your recurring bills, budget and savings goals to see what your money needs to cover.</span></span>
<button style="width: 100%; height: 50px; border-radius: 16px; background: #5134C9; color: #FFFFFF; font-size: 15px; font-weight: 600; margin-top: 4px">Set up my plan</button>
<button onClick="{{openAdd}}" style="width: 100%; height: 46px; border-radius: 16px; background: #F5F4F8; font-size: 14px; font-weight: 600">Add recurring expense</button>
</div>
</sc-if>

<sc-if value="{{hasPlan}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 22px">

<section aria-label="Monthly plan" style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 24px; overflow: hidden">
<div style="padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: flex-start">
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #6B6B76">{{sum.remainingLabel}}</span><span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 38px; line-height: 42px; font-weight: 700; letter-spacing: -0.02em; color: #1A6B46; font-variant-numeric: tabular-nums">{{sum.remaining}}</span></span>
<sc-if value="{{isFuture}}" hint-placeholder-val="{{false}}"><span style="padding: 3px 8px; border: 1px dashed #9DB6E3; border-radius: 999px; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; color: #2D5DB0">ESTIMATE</span></sc-if>
</div>
<span style="font-size: 13px; line-height: 18px; color: #55555F">{{sum.caption}}</span>
<div style="display: flex; height: 12px; gap: 2px"><sc-for list="{{sum.segs}}" as="g" hint-placeholder-count="4"><span style="{{g.style}}"></span></sc-for></div>
</div>
<div style="padding: 4px 20px 14px; border-top: 1px solid #F1F0F4; font-variant-numeric: tabular-nums">
<div style="display: flex; justify-content: space-between; padding: 10px 0; font-size: 14px"><span style="color: #3A3A42; font-weight: 600">{{sum.incomeLabel}}</span><b style="font-weight: 700; color: #1A6B46">{{sum.income}}</b></div>
<sc-for list="{{sum.segs}}" as="g" hint-placeholder-count="4"><div style="display: flex; justify-content: space-between; padding: 7px 0; font-size: 14px"><span style="display: flex; align-items: center; gap: 8px; color: #55555F"><span style="{{g.dot}}"></span>{{g.label}}</span><span style="font-weight: 600">{{g.value}}</span></div></sc-for>
</div>
</section>

<sc-if value="{{isFuture}}" hint-placeholder-val="{{false}}">
<div style="display: flex; gap: 12px; padding: 14px; border-radius: 16px; background: #F5F8FD"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2D5DB0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4.5M12 15.5h.01M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18z"></path></svg><span style="font-size: 13px; line-height: 18px; color: #1F2F4D">October only includes income, bills, loan payments and savings that are scheduled. Kipu doesn’t guess your day-to-day spending.</span></div>
</sc-if>

<sc-if value="{{isCurrent}}" hint-placeholder-val="{{true}}">
<section style="background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 20px; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: baseline; justify-content: space-between"><h2 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.01em">Plan vs actual</h2><span style="font-size: 12px; font-weight: 600; color: #94580A; display: flex; align-items: center; gap: 5px"><span style="width: 6px; height: 6px; border-radius: 999px; background: #E0A33B"></span>6 days left</span></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); font-variant-numeric: tabular-nums">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #6B6B76">Planned</span><b style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 700">CA$4,310</b></span>
<span style="display: flex; flex-direction: column; gap: 2px; padding-left: 12px; border-left: 1px solid #F1F0F4"><span style="font-size: 11px; color: #6B6B76">Spent so far</span><b style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 700">CA$3,428</b></span>
<span style="display: flex; flex-direction: column; gap: 2px; padding-left: 12px; border-left: 1px solid #F1F0F4"><span style="font-size: 11px; color: #6B6B76">Remaining</span><b style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 700; color: #1A6B46">CA$882</b></span>
</div>
<div style="position: relative; height: 12px; background: #EEEDF2; border-radius: 999px"><div style="position: absolute; left: 0; top: 0; bottom: 0; width: 79.5%; background: #5134C9; border-radius: 999px"></div><div style="position: absolute; left: 80%; top: -4px; width: 2px; height: 20px; margin-left: -1px; background: #2A2540; border-radius: 1px"></div></div>
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #55555F"><span><b style="font-weight: 600; color: #111114">79%</b> of planned spending used</span><span>Today: 80% of the month</span></div>
<span style="font-size: 12px; color: #6B6B76; font-variant-numeric: tabular-nums">About CA$147 a day for the rest of September.</span>
</section>

<button onClick="{{openSts}}" style="width: 100%; display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 20px; background: #F4F1FD; text-align: left">
<span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1"><span style="font-size: 12px; font-weight: 600; color: #55506E">Safe to spend</span><span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 24px; font-weight: 700; color: #2B1F66; font-variant-numeric: tabular-nums">CA$1,480</span><span style="font-size: 12px; color: #55506E">Based on your current cash and upcoming commitments.</span></span>
<span style="font-size: 13px; font-weight: 600; color: #5134C9; white-space: nowrap">See calculation →</span>
</button>
</sc-if>





<sc-if value="{{isCurrent}}" hint-placeholder-val="{{true}}">

</sc-if>







<section style="display: flex; flex-direction: column; gap: 10px"><h2 style="margin: 0; font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.01em">Plan in detail</h2><a href="Bills.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 20px; background: #FFFFFF; border: 1px solid #EEEDF2; color: #111114">
<span style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 12px; background: #F4F1FD; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5134C9" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Bills & recurring</span><span style="font-size: 12px; color: #6B6B76">Upcoming payments, subscriptions and fixed costs</span></span>
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#A09EAB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></a><a href="Projections.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 20px; background: #FFFFFF; border: 1px solid #EEEDF2; color: #111114">
<span style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 12px; background: #F4F1FD; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5134C9" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Forecast</span><span style="font-size: 12px; color: #6B6B76">Cash flow for the next months</span></span>
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#A09EAB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></a></section>

</div>
</sc-if>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: linear-gradient(180deg, rgba(250, 250, 248, 0) 0%, #FAFAF8 55%); pointer-events: none"></div>
<nav aria-label="Primary" style="position: absolute; left: 16px; right: 16px; bottom: 28px; height: 68px; background: #FFFFFF; border: 1px solid #EEEDF2; border-radius: 24px; box-shadow: 0 10px 30px rgba(24, 16, 64, 0.08); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #6B6B76; padding-bottom: 6px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6B76" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"></path></svg><span style="font-size: 11px; font-weight: 500">Home</span></a>
<a href="Money.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #6B6B76; padding-bottom: 6px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6B76" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V5.5A1.5 1.5 0 0 0 17.5 4h-12A2.5 2.5 0 0 0 3 6.5v11A2.5 2.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V9a1.5 1.5 0 0 0-1.5-1.5H5.5"></path><circle cx="16.5" cy="13.75" r="1" fill="#6B6B76"></circle></svg><span style="font-size: 11px; font-weight: 500">Money</span></a>
<div style="display: flex; justify-content: center"><a href="QuickAdd.dc.html" aria-label="Add" style="width: 58px; height: 58px; margin-top: -30px; border-radius: 999px; background: #5134C9; border: 4px solid #FAFAF8; box-sizing: content-box; box-shadow: 0 10px 24px rgba(81, 52, 201, 0.35); display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></a></div>
<a href="Plan.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #111114"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111114" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 12h10M4 19h6M15.5 17l2 2 3.5-4"></path></svg><span style="font-size: 11px; font-weight: 600">Plan</span><span style="width: 16px; height: 3px; border-radius: 999px; background: #5134C9"></span></a>
<a href="Stats.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #6B6B76; padding-bottom: 6px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6B76" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V12M11 20V5M17 20v-9M3 20.5h18"></path></svg><span style="font-size: 11px; font-weight: 500">Stats</span></a>
</nav>
<sc-if value="{{sheetSts}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; z-index: 40; background: rgba(17, 17, 20, 0.34)">
<button onClick="{{closeSheet}}" aria-label="Close" style="position: absolute; inset: 0; width: 100%; height: 100%"></button>
<div role="dialog" aria-modal="true" aria-label="Safe to spend calculation" style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 780px; overflow-y: auto; background: #FFFFFF; border-radius: 28px 28px 0 0; box-shadow: 0 -12px 40px rgba(24, 16, 64, 0.14); padding: 10px 20px 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: center"><span style="width: 36px; height: 5px; border-radius: 999px; background: #DCDAE3"></span></div>
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -0.02em">How Safe to Spend is calculated</span><span style="font-size: 13px; color: #6B6B76">Based on your current cash and upcoming commitments.</span></span>
<button onClick="{{closeSheet}}" aria-label="Close" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 999px; background: #F5F4F8; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2A2540" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</div>
<div style="background: #F6F5F8; border-radius: 16px; padding: 4px 14px; font-size: 14px; font-variant-numeric: tabular-nums">
<div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #ECEAF1"><span style="font-weight: 600">Available cash</span><b style="font-weight: 700">CA$4,100</b></div>
<sc-for list="{{stsRows}}" as="r" hint-placeholder-count="5"><div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #ECEAF1"><span style="color: #55555F; display: flex; flex-direction: column; gap: 1px">{{r.k}}<span style="font-size: 11px; color: #8A8896">{{r.sub}}</span></span><span style="font-weight: 600">{{r.v}}</span></div></sc-for>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0"><span style="font-weight: 600">Safe to spend</span><b style="font-family: Satoshi, 'Plus Jakarta Sans', sans-serif; font-size: 22px; font-weight: 700; color: #5134C9">CA$1,480</b></div>
</div>
<span style="font-size: 12px; line-height: 17px; color: #6B6B76">Emergency Savings, Travel Savings and investments aren’t counted as available cash. Change this per account in Money.</span>
<button onClick="{{closeSheet}}" style="height: 50px; border-radius: 16px; background: #111114; color: #FFFFFF; font-size: 15px; font-weight: 600">Got it</button>
</div>
</div>
</sc-if>
<sc-if value="{{sheetGroup}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; z-index: 40; background: rgba(17, 17, 20, 0.34)">
<button onClick="{{closeSheet}}" aria-label="Close" style="position: absolute; inset: 0; width: 100%; height: 100%"></button>
<div role="dialog" aria-modal="true" aria-label="Budget group" style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 780px; overflow-y: auto; background: #FFFFFF; border-radius: 28px 28px 0 0; box-shadow: 0 -12px 40px rgba(24, 16, 64, 0.14); padding: 10px 20px 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: center"><span style="width: 36px; height: 5px; border-radius: 999px; background: #DCDAE3"></span></div>
