<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = {"filter": "All", "sheet": null, "empty": false, "aOwner": "Household", "aBud": "CAD", "aLoc": "MXN", "aGoal": "None", "aOpt": false}; }
  renderVals() {
    const s = this.state;

    const segW = (on) => 'flex: 1 1 0; height: 36px; padding: 0 8px; border-radius: 9px; font-size: 13px; white-space: nowrap; ' + (on ? 'background: #FFFFFF; color: #111114; font-weight: 600; box-shadow: 0 1px 3px rgba(24, 16, 64, 0.12);' : 'color: #6B6B76; font-weight: 500;');
    const pill = (on) => 'height: 34px; padding: 0 12px; border-radius: 999px; font-size: 13px; ' + (on ? 'background: #111114; color: #FFFFFF; font-weight: 600;' : 'background: #F6F5F8; color: #3A3A42; font-weight: 500;');
    const opts = (list, key, st, def) => list.map((o) => ({ label: o, pressed: o === (s[key] || def) ? 'true' : 'false', style: st(o === (s[key] || def)), pick: () => this.setState({ [key]: o }) }));
    const addVals = { aOwners: opts(['Juan', 'Karinna', 'Household'], 'aOwner', segW, 'Household'), aBudCur: opts(['CAD', 'USD'], 'aBud', segW, 'CAD'),
      aLocal: opts(['MXN', 'USD', 'PEN', 'EUR', 'Other'], 'aLoc', pill, 'MXN'), aGoals: opts(['None', 'New trip goal', 'Travel Fund'], 'aGoal', pill, 'None'),
      optOpen: !!s.aOpt, optAttr: s.aOpt ? 'true' : 'false', optIcon: s.aOpt ? 'm6 15 6-6 6 6' : 'm6 9 6 6 6-6', toggleOpt: () => this.setState({ aOpt: !s.aOpt }) };

    const seg = (on) => 'height: 34px; border-radius: 9px; font-size: 13px; ' + (on ? 'background: #FFFFFF; color: #111114; font-weight: 600; box-shadow: 0 1px 3px rgba(24, 16, 64, 0.12);' : 'color: #6B6B76; font-weight: 500;');
    const f = s.filter;
    return Object.assign({
      filters: opts(['Upcoming', 'Active', 'Past', 'All'], 'filter', seg, 'All'),
      isEmpty: !!s.empty, hasTrips: !s.empty, showActive: f === 'All' || f === 'Active', showUpcoming: f === 'All' || f === 'Upcoming', showPast: f === 'All' || f === 'Past',
      openAdd: () => this.setState({ sheet: 'add' }), closeSheet: () => this.setState({ sheet: null }), sheetAdd: s.sheet === 'add'
    }, addVals);
  }
}
</script>
