<style>

:root {
  --bg: #F7F6FB; --surface: #FFFFFF; --surface2: #F1EFF8; --elev: #FFFFFF; --ink: #121117; --ink2: #3A3945; --muted: #6C6A78; --line: #E7E4F0; --tint: #F4F1FE; --solid: #4B32C3; --grad2: linear-gradient(150deg, #3F46C9 0%, #2F6BFF 100%); --page-glow: none; --card-shadow: none; --c1: #5B3FD6; --c2: #2F6BFF; --c3: #9C8CF0; --c4: #62A8F5; --c5: #C9C1F4;
  --acc: #5B3FD6; --acc2: #3F46C9; --acc3: #2F6BFF; --accbg: #EFEBFD; --acc-ink: #FFFFFF; --grad: linear-gradient(135deg, #4B2FC4 0%, #3D5BE0 100%); --hero-ink: #FFFFFF; --chart2: #7FA0D8; --glow: none;
  --pos: #1A6B46; --pos2: #2E9B69; --posbg: #E6F4EC; --warn: #8F5608; --warn2: #E0A33B; --warnbg: #FDF1DC; --crit: #A3325A; --crit2: #D0537D; --critbg: #FCEBF1; --info: #2D5DB0; --info2: #7FA0D8; --infobg: #EAF1FC; --neutral: #D9D7E1;
  --shadow: 0 1px 2px rgba(20, 16, 50, 0.04), 0 8px 24px rgba(20, 16, 50, 0.06);
  --display: 'Satoshi', 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; --body: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0E0F17; --surface: #171824; --surface2: #1F2130; --ink: #F2F2F7; --ink2: #D2D3DE; --muted: #9A9CB0; --line: #2A2C3D; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0E0F17; --surface: #171824; --surface2: #1F2130; --ink: #F2F2F7; --ink2: #D2D3DE; --muted: #9A9CB0; --line: #2A2C3D; color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:disabled { cursor: default; }
input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
.disp { font-family: var(--display); letter-spacing: -0.02em; }
h1, h2, h3 { margin: 0; font-family: var(--display); letter-spacing: -0.02em; text-wrap: balance; }
p { margin: 0; }

/* ---------- shell ---------- */
#root { min-height: 100%; }
.app { min-height: 100vh; min-height: 100dvh; background: var(--page-glow), var(--bg); background-repeat: no-repeat; color: var(--ink); }
.m-page { max-width: 640px; margin: 0 auto; padding: env(safe-area-inset-top, 0px) 20px calc(env(safe-area-inset-bottom, 0px) + 124px); }
.m-top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px; min-height: 52px; padding-top: env(safe-area-inset-top, 0px); margin: 0 -20px 8px; padding-left: 10px; padding-right: 16px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.m-top .t { flex: 1; font-weight: 600; font-size: 15px; text-align: center; margin-right: 36px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bnav { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); max-width: 560px; margin: 0 auto; height: 72px; z-index: 30; display: flex; align-items: center; gap: 6px; padding: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 30px; box-shadow: var(--shadow); }
.bnav > button { flex: 1; height: 54px; border-radius: 999px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--muted); font-size: 10.5px; font-weight: 600; transition: background 0.15s, color 0.15s; }
.bnav > button.on { background: var(--acc); color: var(--acc-ink); box-shadow: 0 6px 16px color-mix(in srgb, var(--acc) 30%, transparent); }
.bnav .add { flex: 0 0 56px; width: 56px; height: 56px; border-radius: 20px; display: flex; align-items: center; justify-content: center; background: var(--grad); color: var(--hero-ink); box-shadow: var(--glow); }
.d-shell { display: grid; grid-template-columns: 108px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: 16px; margin: 16px 0 16px 16px; height: calc(100vh - 32px); width: 76px; border-radius: 32px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--card-shadow); display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 18px 0; z-index: 30; }
.rail-mark span { display: block; width: 38px; height: 38px; border-radius: 13px; background: var(--grad); box-shadow: var(--glow); }
.rail-add { width: 48px; height: 48px; border-radius: 17px; margin: 6px 0 10px; background: var(--grad); color: var(--hero-ink); display: flex; align-items: center; justify-content: center; box-shadow: var(--glow); }
.rail-nav { display: flex; flex-direction: column; gap: 8px; padding: 6px; border-radius: 999px; background: var(--surface2); }
.rail-btn, .rail-face { position: relative; width: 48px; height: 48px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--muted); transition: background 0.15s, color 0.15s; }
.rail-btn:hover { background: var(--surface); color: var(--ink); }
.rail-btn.on { background: var(--acc); color: var(--acc-ink); box-shadow: 0 6px 16px color-mix(in srgb, var(--acc) 35%, transparent); }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.rail-tip { position: absolute; left: 60px; top: 50%; transform: translate(-4px, -50%); background: var(--ink); color: var(--bg); padding: 6px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.15s, transform 0.15s; }
.rail-btn:hover .rail-tip, .rail-btn:focus-visible .rail-tip, .rail-face:hover .rail-tip, .rail-face:focus-visible .rail-tip { opacity: 1; transform: translate(0, -50%); }
.d-main { min-width: 0; padding: 16px 32px 120px 16px; } /* room so the dock never covers the last card */
.rail-wrap { position: relative; }
.rail-btn.flying { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--acc); }
.rail-btn.on.flying { background: var(--acc); color: var(--acc-ink); }
.fly { position: absolute; left: 66px; top: -8px; min-width: 210px; padding: 8px; border-radius: 22px; background: var(--elev); border: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 2px; z-index: 40; animation: flyin 0.14s ease; }
.fly-title { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding: 8px 12px 6px; }
.fly-item { height: 40px; padding: 0 12px; border-radius: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; font-weight: 500; color: var(--ink2); text-align: left; }
.fly-item:hover { background: var(--surface2); color: var(--ink); }
.fly-item.on { background: var(--accbg); color: var(--acc); font-weight: 700; }
.side-badge { font-style: normal; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--acc); color: var(--acc-ink); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
@keyframes flyin { from { opacity: 0; transform: translateX(-4px); } to { opacity: 1; transform: none; } }
.bento { display: grid; gap: 16px; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-areas: var(--areas-md); align-items: stretch; }
.bento > * { min-width: 0; }
.bento > div > .hero, .bento > div > button.card { height: 100%; }
@media (min-width: 1280px) { .bento { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-areas: var(--areas-lg); } }
.d-bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; min-height: 64px; margin: 0 -8px 18px; padding: 10px 8px; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.crumb { display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 16px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; font-weight: 600; }
.circle-btn { width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--ink); }
.circle-btn:hover { background: var(--surface2); }
.pill-soft { height: 44px; padding: 0 16px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn.pill { border-radius: 999px; height: 44px; padding: 0 18px; }
.bell-dot { position: absolute; top: 10px; right: 11px; width: 8px; height: 8px; border-radius: 999px; background: var(--warn2); box-shadow: 0 0 0 2px var(--surface); }
.d-content { max-width: 1200px; margin: 0 auto; }
@media (max-width: 1000px) { .d-shell { grid-template-columns: 100px minmax(0, 1fr); } .d-main { padding: 12px 20px 60px 12px; } .d-bar .pill-soft { display: none; } }
/* wide: modern dashboard touches */
.wide .d-content > .stack > :first-child h1 { font-size: 46px !important; line-height: 1.05 !important; font-weight: 500 !important; letter-spacing: -0.035em; }
.wide .card { border-radius: 26px; }
.wide .card.tight { border-radius: 24px; }
.wide .hero { border-radius: 30px; padding: 26px; }
.wide button.card, .wide button.hero { transition: transform 0.18s ease, box-shadow 0.18s ease; }
.wide button.card:hover, .wide button.hero:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.wide .tabs { display: inline-flex; align-self: flex-start; gap: 4px; padding: 5px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); max-width: 100%; }
.wide .tabs button { height: 38px; padding: 0 18px; border-radius: 999px; border-bottom: 0; }
.wide .tabs button.on { background: var(--ink); color: var(--bg); }
.wide .chip { height: 36px; padding: 0 14px; }
.wide .sec-h .link { height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.pill-link { display: inline-flex; align-items: center; gap: 3px; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--acc); font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill-link:hover { background: var(--surface2); }
.dock { position: fixed; right: 32px; bottom: 28px; z-index: 25; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 32px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.dock-add { position: relative; width: 48px; height: 48px; border-radius: 17px; background: var(--grad); color: var(--hero-ink); display: flex; align-items: center; justify-content: center; box-shadow: var(--glow); }
.dock-group { display: flex; gap: 8px; padding: 6px; border-radius: 999px; background: var(--surface2); }
.dock-group button { position: relative; width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--muted); transition: background 0.15s, color 0.15s; }
.dock-group button:hover { background: var(--surface); color: var(--ink); }
.dock .tip { position: absolute; bottom: 58px; left: 50%; transform: translate(-50%, 4px); background: var(--ink); color: var(--bg); padding: 6px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.15s, transform 0.15s; }
.dock button:hover .tip, .dock button:focus-visible .tip { opacity: 1; transform: translate(-50%, 0); }
.rail-add.flying { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--acc); }
.fly.fly-down { left: auto; right: 0; top: 52px; }
.fly.fly-up { left: 50%; top: auto; bottom: 70px; width: min(290px, calc(100vw - 32px)); animation: flyup 0.16s ease; transform: translateX(-50%); }
@keyframes flyup { from { opacity: 0; transform: translate(-50%, 6px); } to { opacity: 1; transform: translate(-50%, 0); } }
.bnav .add.flying { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--acc); }
.bnav .rail-wrap { flex: 0 0 56px; display: flex; justify-content: center; }
.wide .d-content { padding-bottom: 60px; }
.d-bar .chip { height: 44px; border-radius: 999px; padding: 0 16px; }
.previews { display: grid; justify-content: center; gap: 16px 12px; padding: 14px 12px; border-radius: 18px; background: var(--surface); min-width: 0; overflow: hidden; }
.preview-pick { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 6px; border-radius: 26px; border: 2px solid transparent; min-width: 0; transition: border-color 0.15s, background 0.15s; }
.preview-pick:hover { background: var(--surface2); }
.preview-pick.on { border-color: var(--acc); background: color-mix(in srgb, var(--acc) 8%, transparent); }
.lock { position: fixed; inset: 0; z-index: 100; background: var(--page-glow), var(--bg); background-repeat: no-repeat; color: var(--ink); overflow-y: auto; }
.lock-mark { width: 36px; height: 36px; border-radius: 12px; background: var(--grad); box-shadow: var(--glow); flex-shrink: 0; }
.lock-card { width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
.lock-phone { display: flex; flex-direction: column; align-items: center; gap: 22px; padding: calc(env(safe-area-inset-top, 0px) + 22px) 20px calc(env(safe-area-inset-bottom, 0px) + 22px); }
.lock-phone .lock-top, .lock-tablet .lock-top { display: flex; justify-content: center; }
.lock-tablet { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 32px; background: var(--grad); color: var(--ink); }
.lock-tablet .lock-top { color: var(--hero-ink); }
.lock-tablet .lock-mark { background: color-mix(in srgb, var(--hero-ink) 92%, transparent); box-shadow: none; }
.lock-tablet .lock-card { max-width: 440px; padding: 36px 32px; border-radius: 34px; background: var(--surface); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3); }
.lock-split { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
.lock-brand { position: relative; overflow: hidden; background: var(--grad); color: var(--hero-ink); padding: 48px 56px; display: flex; flex-direction: column; justify-content: space-between; min-height: 100vh; }
.lock-brand::after { content: ''; position: absolute; right: -120px; top: -160px; width: 520px; height: 520px; border-radius: 999px; background: radial-gradient(circle, color-mix(in srgb, var(--hero-ink) 18%, transparent), transparent 70%); pointer-events: none; }
.lock-brand .lock-mark { background: color-mix(in srgb, var(--hero-ink) 92%, transparent); box-shadow: none; }
.lock-h { font-size: clamp(48px, 5.4vw, 84px); font-weight: 500; line-height: 1.02; letter-spacing: -0.045em; }
.lock-panel { display: flex; align-items: center; justify-content: center; padding: 40px; }
.pinpad { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; }
.pin-dots { display: flex; gap: 14px; }
.pin-dots i { width: 14px; height: 14px; border-radius: 999px; border: 2px solid color-mix(in srgb, var(--muted) 70%, transparent); transition: background 0.12s, border-color 0.12s; }
.pin-dots i.on { background: var(--acc); border-color: var(--acc); }
.pin-dots.shake { animation: shake 0.42s ease; }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-9px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
.pin-keys { display: grid; grid-template-columns: repeat(3, 72px); gap: 14px 24px; justify-content: center; }
.pin-key { width: 72px; height: 72px; border-radius: 999px; background: var(--surface2); color: var(--ink); font-family: var(--display); font-size: 28px; font-weight: 500; display: flex; align-items: center; justify-content: center; transition: background 0.1s, transform 0.1s; }
.pin-key:active:not(:disabled) { background: var(--accbg); transform: scale(0.96); }
.pin-key.ghost { background: transparent; color: var(--muted); }
.pin-key:disabled { opacity: 0.4; }
@media (max-height: 720px) { .pin-keys { grid-template-columns: repeat(3, 62px); gap: 10px 20px; } .pin-key { width: 62px; height: 62px; font-size: 24px; } .lock-card { gap: 14px; } }
.mode-btn { height: 44px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 600; color: var(--ink2); }
.mode-btn svg { flex-shrink: 0; }
.mode-btn:hover { background: var(--surface2); }
.mode-btn[aria-pressed="true"] { border-color: var(--acc); background: var(--accbg); color: var(--acc); font-weight: 700; }
.set-me { display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px; }
.set-tile { display: flex; flex-direction: column; justify-content: space-between; gap: 14px; min-height: 124px; padding: 14px; text-align: left; width: 100%; }
.set-tile.on, .set-me.on { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc); }
.set-sw { width: 34px; height: 34px; border-radius: 999px; box-shadow: 0 0 0 3px var(--surface), inset 0 0 0 1px rgba(128, 128, 128, 0.25); }
.set-ic { width: 36px; height: 36px; flex-shrink: 0; border-radius: 999px; background: var(--surface2); color: var(--ink); display: flex; align-items: center; justify-content: center; }
.set-row.on { background: var(--accbg); }
.set-row.on .set-ic { background: var(--acc); color: var(--acc-ink); }
.set-val { font-size: 12px; font-weight: 600; color: var(--muted); padding: 4px 10px; border-radius: 999px; background: var(--surface2); white-space: nowrap; max-width: 40%; overflow: hidden; text-overflow: ellipsis; }
.set-title { font-size: 30px; line-height: 1.1; font-weight: 500; letter-spacing: -0.03em; }
.kpis.m { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 4px 2px; width: 100%; text-align: left; }
.kpis.m .v { font-size: clamp(18px, 5.6vw, 24px); }
.kpis.m .l { font-size: 12px; }
/* phone: same language as the dashboard */
.app:not(.wide) .m-page > .stack > :first-child h1 { font-size: 32px !important; line-height: 1.08 !important; font-weight: 500 !important; letter-spacing: -0.035em; }
.app:not(.wide) .card { border-radius: 22px; }
.app:not(.wide) .hero { border-radius: 26px; }
.tabs { display: flex; gap: 4px; padding: 5px; margin: 0; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); overflow-x: auto; scrollbar-width: none; }
.sec-h .link { height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 12px; }
.kpis { display: flex; gap: 36px; flex-wrap: wrap; align-items: flex-end; }
.kpi { display: flex; flex-direction: column; gap: 2px; text-align: left; }
.kpi .v { font-family: var(--display); font-size: 40px; line-height: 1; font-weight: 500; letter-spacing: -0.035em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kpi .l { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.kpi .b { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 999px; }
.kpi .b.pos { background: var(--posbg); color: var(--pos); } .kpi .b.warn { background: var(--warnbg); color: var(--warn); }
.onb { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: calc(env(safe-area-inset-top, 0px) + 24px) 20px calc(env(safe-area-inset-bottom, 0px) + 24px); }
.onb-card { width: 100%; max-width: 440px; }
.cloud-access .onb-card { max-width: 480px; overflow: hidden; border: 1px solid var(--line); border-radius: 28px; background: var(--surface); box-shadow: var(--shadow); }
.cloud-hero { min-height: 220px; padding: 28px; display: flex; flex-direction: column; justify-content: space-between; background: radial-gradient(circle at 80% 10%, color-mix(in srgb, var(--acc3) 75%, transparent), transparent 48%), var(--grad); color: var(--hero-ink); }
.cloud-hero h1 { font-size: 30px; line-height: 1.12; max-width: 12ch; }
.cloud-body { padding: 24px 28px 30px; }
.cloud-provider { width: 100%; justify-content: flex-start; gap: 12px; }
.cloud-provider-mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: var(--surface2); font-weight: 800; font-size: 17px; }
.cloud-provider:disabled { opacity: .48; }
.cloud-divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; }
.cloud-divider::before, .cloud-divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }
